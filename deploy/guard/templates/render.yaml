# Zunder Guard on Render, on your own account, as a Blueprint (deploy/guard/README.md, "Render").
# Dashboard: New > Blueprint, point it at a repository holding this file as render.yaml.
#
# A private service (pserv): Render gives it no public URL. Your other Render services in the
# same region reach it at http://zunder-guard:8547. Render has no Tokyo region; Singapore is the
# nearest. Render asks for ZUNDER_GUARD_RULES and ZUNDER_GUARD_ACCOUNT (the account's address)
# when the Blueprint is created; Guard starts in paper mode from them.
#
# Testnet: in the dashboard, add a Secret File named hl-api-wallet-key holding the API wallet
# key (Render mounts it at /etc/secrets/hl-api-wallet-key; it is never in this file), run
# `zunder-guard init` for testnet in a shell on the service, then set
# ZUNDER_GUARD_NETWORK=testnet and ZUNDER_GUARD_KEY_FILE=/etc/secrets/hl-api-wallet-key.
# Mainnet is not offered here: Guard takes a mainnet key on standard input only.
#
# PUBLIC ACCESS, opt-in only: changing the type to "web" gives Guard a public URL. WARNING:
# anyone who reaches it can send orders signed with a paired client key.
services:
  - type: pserv
    name: zunder-guard
    runtime: image
    image:
      url: ghcr.io/zunderlabs/zunder-guard:latest
    plan: starter
    region: singapore
    # One instance only: two would race on the journal and the nonces.
    numInstances: 1
    disk:
      name: guard-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ZUNDER_GUARD_RULES
        sync: false
      - key: ZUNDER_GUARD_ACCOUNT
        sync: false
      # Listens on the service's private interface; a pserv has no public address.
      - key: ZUNDER_GUARD_LISTEN
        value: "0.0.0.0:8547"
