[package]
name = "zunder-venue"
description = "Venue foundations: Hyperliquid addresses and networks, mainnet consent, the HTTPS transport, instrument rules, and the persistent risk journal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "Elastic-2.0"

[features]
# Lets tests outside this crate make a `MainnetConsent` from a value instead of
# the environment (`MainnetConsent::confirm_for_tests`). Enabled only by
# dev-dependencies (the executor's unit tests); never in a release build.
test-hooks = []

[dependencies]
reqwest.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sha3.workspace = true
thiserror.workspace = true
zunder-core.workspace = true
zunder-risk.workspace = true

[target.'cfg(windows)'.dependencies]
windows-permissions.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio.workspace = true

[lints]
workspace = true
