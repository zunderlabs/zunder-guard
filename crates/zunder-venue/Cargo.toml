[package]
name = "zunder-venue"
description = "Venue I/O: the sealed HTTPS transport to the chosen Hyperliquid network, owner-only files, and the persistent risk journal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "Elastic-2.0"

[features]
# `ScriptedTransport`, the transport for tests that never leaves this
# machine, for the tests of the crates built on this one. Enabled only by
# dev-dependencies; never in a release build.
test-hooks = []

[dependencies]
reqwest.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sha3.workspace = true
thiserror.workspace = true
zunder-core.workspace = true
zunder-hl-protocol.workspace = true
zunder-risk.workspace = true
zunder-venue-types.workspace = true

[target.'cfg(windows)'.dependencies]
windows-permissions.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio.workspace = true
# `MainnetConsent::confirm_for_tests` for the transport's tests.
zunder-venue-types = { workspace = true, features = ["test-hooks"] }

[lints]
workspace = true
