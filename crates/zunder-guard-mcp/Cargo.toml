[package]
name = "zunder-guard-mcp"
description = "MCP server that gives AI agents guarded trading tools on Hyperliquid through a local Zunder Guard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# Code published with Guard under the Elastic License 2.0 (decided 6 Oct 2026).
# cargo deny ignores our own unpublished crates.
license = "Elastic-2.0"

[[bin]]
name = "zunder-guard-mcp"
path = "src/main.rs"

[features]
# Test doubles (`ratelimit::ManualClock`, a clock moved by hand) for the
# integration tests; never in a release build. Enabled by the
# dev-dependency on this crate itself below.
test-hooks = []

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
k256.workspace = true
# Plain HTTP to Guard on a loopback address only (`guard::GuardUrl`).
reqwest.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
zunder-core.workspace = true
# The Hyperliquid protocol: MessagePack and L1 signing, shared with Guard.
zunder-hl-protocol.workspace = true
# The rules code's bounds (`contract.rs`): the risk engine's own validation.
zunder-risk.workspace = true
# Owner-only key files and address parsing.
zunder-venue.workspace = true
# Hyperliquid's price and size grid (`InstrumentRules`).
zunder-venue-types.workspace = true
# Guard core's stop rule (`OpenOrderView`, the covering stop), so that what
# this server shows and pre-checks is what Guard judges; also holds this
# server's action builders to Guard core's encoding (`sign.rs` tests).
zunder-guard-core.workspace = true

[dev-dependencies]
zunder-guard-mcp = { path = ".", features = ["test-hooks"] }

[lints]
workspace = true
