[package]
name = "zunder-guard-core"
description = "Zunder Guard's core: decodes a bot's Hyperliquid exchange requests, authenticates them, judges them against the policy and the risk engine, and builds the action to re-sign. No I/O; compiles natively and to wasm32-unknown-unknown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# Source-available: Elastic License 2.0 (docs/guard.md, "Licence").
license = "Elastic-2.0"

[features]
# Test hooks (switching trigger orders' builder field on), for the
# integration tests only; never in a release build.
test-hooks = []

[dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
k256.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sha3.workspace = true
thiserror.workspace = true
zeroize.workspace = true
zunder-core.workspace = true
zunder-risk.workspace = true

[dev-dependencies]
fastrand.workspace = true

[lints]
workspace = true
