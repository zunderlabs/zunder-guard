name: Hosted Testnet journey preparation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-ordinary-${{ github.repository_id }}
  cancel-in-progress: false
jobs:
  negative:
    uses: ./.github/workflows/hosted-testnet-journey-negative.yml
    permissions:
      contents: read
  verify:
    needs: negative
    uses: ./.github/workflows/hosted-testnet-journey-run.yml
    permissions:
      contents: read
