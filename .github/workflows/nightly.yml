# Drift detection against authenticated promoted subjects; never creates a release gate.
name: nightly
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guard-nightly
  cancel-in-progress: false
jobs:
  promoted:
    if: github.repository == 'zunderlabs/zunder-guard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      attestations: read
      packages: read
    outputs:
      tag: ${{ steps.admission.outputs.tag }}
      commit: ${{ steps.admission.outputs.commit }}
      previous_tag: ${{ steps.admission.outputs.previous_tag }}
      previous_commit: ${{ steps.admission.outputs.previous_commit }}
      seed: ${{ steps.seed.outputs.seed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: v3.1.3}
      - run: python -m pip install -e ./deploy/guard/harness
      - name: Authenticate current promoted subjects and published upgrade predecessor
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m guard_harness.monitor --previous --work "$RUNNER_TEMP/nightly-canonical"
      - name: Record random reproducible property seed
        id: seed
        shell: python
        run: |
          import os, secrets
          from pathlib import Path
          seed = str(secrets.randbits(64))
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as stream:
              stream.write('seed=' + seed + '\n')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as stream:
              stream.write('Nightly PROPTEST_RNG_SEED=' + seed + '\n')
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-canonical/receipt.json
          if-no-files-found: error
          retention-days: 14
  properties:
    needs: promoted
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PROPTEST_RNG_SEED: ${{ needs.promoted.outputs.seed }}
      ZUNDER_FLOWS_CASES: '4000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.promoted.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Random-seed properties on authenticated promoted source
        run: cargo test --locked -p zunder-venue --test flows_model
  installs:
    needs: promoted
    # Same-commit reusable workflow; $. syntax is unsupported by pinned actionlint.
    uses: ./.github/workflows/install-matrix.yml # zizmor: ignore[self-repository]
    with:
      profile: nightly
      tag: ${{ needs.promoted.outputs.tag }}
      commit: ${{ needs.promoted.outputs.commit }}
      previous_tag: ${{ needs.promoted.outputs.previous_tag }}
      previous_commit: ${{ needs.promoted.outputs.previous_commit }}
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
      packages: read
  purchase:
    needs: promoted
    # Same-commit reusable workflow; $. syntax is unsupported by pinned actionlint.
    uses: ./.github/workflows/journey.yml # zizmor: ignore[self-repository]
    with:
      profile: nightly
      tag: ${{ needs.promoted.outputs.tag }}
      commit: ${{ needs.promoted.outputs.commit }}
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
      packages: read
  nightly:
    if: always()
    needs: [promoted, properties, installs, purchase]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every drift check
        shell: python
        run: |
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert set(results) == {'promoted', 'properties', 'installs', 'purchase'}
          assert all(row['result'] == 'success' for row in results.values()), 'Nightly drift check failed'
