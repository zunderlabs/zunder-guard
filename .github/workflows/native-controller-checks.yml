name: Native controller checks

on:
  workflow_dispatch:
  push:
    branches: [codex/native-controller-checks]
  pull_request:
    paths:
      - .github/workflows/native-controller-checks.yml
      - deploy/guard/e2e/native/windows.ps1
      - deploy/guard/e2e/native/windows_native.cs
      - deploy/guard/e2e/native/test_windows_native.ps1
      - deploy/guard/e2e/private_process_scope.py
      - deploy/guard/e2e/private_process_entry.py
      - deploy/guard/e2e/test_private_process_scope.py
      - deploy/guard/e2e/release_flow.py

permissions:
  contents: read

concurrency:
  group: native-controller-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-public-fixtures:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Parse, compile and exercise public native fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./deploy/guard/e2e/native/test_windows_native.ps1
          $Files = @('windows.ps1', 'windows_native.cs', 'test_windows_native.ps1')
          $Hashes = @{}
          foreach ($Name in $Files) {
            $Hashes[$Name] = (Get-FileHash -LiteralPath ('deploy/guard/e2e/native/' + $Name) -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $Receipt = @{
            schema = 1
            kind = 'public-native-controller-fixture'
            source = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            runner_os = $env:RUNNER_OS
            powershell = $PSVersionTable.PSVersion.ToString()
            files = $Hashes
            parser_compile = 'passed'
            public_job_frame_fixtures = 'passed'
            venue_calls = 0
            real_credentials = $false
            guard_installation = $false
            actual_release_acceptance = $false
          }
          New-Item -ItemType Directory -Path public-native-receipt | Out-Null
          $Receipt | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath public-native-receipt/receipt.json -Encoding utf8
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-native-controller-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-native-receipt/receipt.json
          if-no-files-found: error
          retention-days: 14

  linux-private-process-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check bounded public scope fixtures
        run: python3 -B deploy/guard/e2e/test_private_process_scope.py
      - name: Exercise actual harmless detached-process containment
        run: |
          set -euo pipefail
          sudo -n swapoff -a
          mkdir public-provider-receipt
          sudo -n python3 -B deploy/guard/e2e/test_private_process_scope.py --actual | tee public-provider-receipt/actual.json
          python3 - <<'PYRECEIPT'
          import hashlib,json,os
          from pathlib import Path
          paths=['private_process_scope.py','private_process_entry.py','test_private_process_scope.py','release_flow.py']
          result=json.loads(Path('public-provider-receipt/actual.json').read_text())
          assert result['kind']=='actual-no-key-cgroup-containment' and result['cleanup']['complete']
          assert result['cleanup']['populated'] is False and result['cleanup']['cgroup_removed']
          assert result['setsid_descendant'] and result['no_new_privileges'] and result['release_ready'] is False
          result.update(source=os.environ['GITHUB_SHA'],workflow_sha=os.environ['GITHUB_WORKFLOW_SHA'],
              run_id=os.environ['GITHUB_RUN_ID'],run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
              source_hashes={p:hashlib.sha256(Path('deploy/guard/e2e',p).read_bytes()).hexdigest() for p in paths},
              actual_private_input=False,actual_release_acceptance=False)
          Path('public-provider-receipt/receipt.json').write_text(json.dumps(result,indent=2)+'\n')
          PYRECEIPT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-provider-containment-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-provider-receipt/
          if-no-files-found: error
          retention-days: 14
