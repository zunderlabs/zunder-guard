name: Public SSM transport inert checks
on:
  workflow_dispatch:
    inputs:
      control_sha:
        description: Exact reviewed immutable control commit
        type: string
        required: true
permissions:
  contents: read
jobs:
  public-inert:
    if: github.repository == 'zunderlabs/zunder-guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Original reviewed control identity
        shell: bash
        env:
          EXPECTED_CONTROL_SHA: ${{ inputs.control_sha }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_CONTROL_SHA}" =~ ^[0-9a-f]{40}$ && "${GITHUB_SHA}" == "${EXPECTED_CONTROL_SHA}" ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact reviewed public transport gate
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' '7c3ba2afba5c23c5197c71d7078b780547a7a59948b38e9d9aef532f46767490' 'deploy/guard/e2e/public-ssm-inert/public_linux_ssm_inert.py' | sha256sum --check --strict
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 /usr/bin/python3 -I -B deploy/guard/e2e/public-ssm-inert/public_linux_ssm_inert.py --output "${RUNNER_TEMP}/public-linux-ssm-inert-results"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: public-linux-ssm-inert-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/public-linux-ssm-inert-results/receipt.json
            ${{ runner.temp }}/public-linux-ssm-inert-results/compile.log
            ${{ runner.temp }}/public-linux-ssm-inert-results/tests.log
          if-no-files-found: error
          retention-days: 3
