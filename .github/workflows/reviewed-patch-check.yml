name: reviewed-public-patch-check
on:
  workflow_dispatch:
    inputs:
      patch_base64:
        description: Public reviewed unified patch, base64 encoded, maximum 45000 characters
        required: true
        type: string
      patch_sha256:
        description: Expected SHA256 of decoded public patch bytes
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: reviewed-public-patch-check-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  ZUNDER_FLOWS_CASES: '4000'
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 05028b2848bc1bb5075db010c18e19136bbfd853
          persist-credentials: false
      - name: Admit bounded public patch against the fixed reviewed base
        env:
          PATCH_BASE64: ${{ inputs.patch_base64 }}
          PATCH_SHA256: ${{ inputs.patch_sha256 }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, subprocess
          from pathlib import Path
          def require(value, message):
              if not value:
                  raise SystemExit(message)
          expected = os.environ['PATCH_SHA256']
          encoded = os.environ['PATCH_BASE64']
          require(re.fullmatch('[0-9a-f]{64}', expected), 'Expected public patch SHA256 required')
          require(0 < len(encoded) <= 45000, 'Public patch exceeds input boundary')
          patch = base64.b64decode(encoded, validate=True)
          require(0 < len(patch) <= 33750 and b'\x00' not in patch, 'Invalid public patch bytes')
          require(hashlib.sha256(patch).hexdigest() == expected, 'Public patch hash differs')
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          require(base == '05028b2848bc1bb5075db010c18e19136bbfd853', 'Source base differs')
          for option in ('--check', ''):
              command = ['git', 'apply', '--whitespace=error']
              if option:
                  command.append(option)
              result = subprocess.run(command + ['-'], input=patch, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              require(result.returncode == 0, 'Public patch cannot apply exactly')
          # No proposed workflow code is executed. Every workflow/action remains
          # the reviewed dispatch controller rather than bytes in the input patch.
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          added = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()
          paths = changed + added
          require(paths and len(paths) <= 64, 'Unexpected public patch file count')
          require(all(not name.startswith('.github/') and not name.startswith('/') and
                      '..' not in name.split('/') for name in paths), 'Public patch cannot change automation')
          require(all(name.startswith(('crates/', 'deploy/guard/')) or name in
                      ('Cargo.toml', 'Cargo.lock', 'deny.toml', 'rust-toolchain.toml') for name in paths),
                  'Public patch path outside product source')
          require(all(Path(name).is_file() and not Path(name).is_symlink() for name in paths),
                  'Only regular public product files may be changed')
          subprocess.run(['git', 'add', '--', *paths], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          evidence = Path('patch-evidence'); evidence.mkdir()
          (evidence / 'source.json').write_text(json.dumps({
              'schema': 1, 'kind': 'uncommitted-public-source-gate', 'base': base,
              'tree': tree, 'patch_sha256': expected, 'files': paths,
              'workflow_ref': os.environ['GITHUB_WORKFLOW_REF'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'flow_histories_per_property': 4000, 'native_signed_release_evidence': False,
          }, indent=2) + '\n')
          (evidence / 'reviewed.patch').write_bytes(patch)
          print('Admitted exact reviewed public patch ' + expected + ' at source tree ' + tree)
          PY
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - name: Require tested source bytes to remain unchanged
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          expected = json.loads(Path('patch-evidence/source.json').read_text())
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == expected['tree']
          expected['gate_passed'] = True
          Path('patch-evidence/receipt.json').write_text(json.dumps(expected, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reviewed-public-patch-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: patch-evidence/
          if-no-files-found: error
          retention-days: 30
