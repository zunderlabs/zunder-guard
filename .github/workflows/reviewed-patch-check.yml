name: reviewed-public-patch-check
on:
  workflow_dispatch:
    inputs:
      base_commit:
        description: Exact reviewed public commit SHA; branches and tags are refused
        required: true
        type: string
      patch_base64:
        description: Public reviewed unified patch, base64 encoded, maximum 60000 characters
        required: true
        type: string
      patch_sha256:
        description: Expected SHA256 of decoded public patch bytes
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: reviewed-public-patch-check-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  ZUNDER_FLOWS_CASES: '4000'
jobs:
  check:
    name: public patch (${{ matrix.partition }})
    strategy:
      fail-fast: false
      matrix:
        partition:
          - workspace
          - the_generator_reaches_every_path
          - the_implementation_is_the_reference
          - the_implementation_is_the_reference_when_told_in_time
          - the_order_of_the_reports_does_not_matter
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Require immutable public base before checkout
        env:
          SOURCE_BASE: ${{ inputs.base_commit }}
        run: |
          python3 - <<'PYBASE'
          import os,re
          assert re.fullmatch('[0-9a-f]{40}',os.environ['SOURCE_BASE']), 'Exact public commit SHA required'
          PYBASE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_commit }}
          persist-credentials: false
      - name: Admit bounded public patch against the immutable reviewed base
        env:
          SOURCE_BASE: ${{ inputs.base_commit }}
          PATCH_BASE64: ${{ inputs.patch_base64 }}
          PATCH_SHA256: ${{ inputs.patch_sha256 }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, subprocess
          from pathlib import Path
          def require(value, message):
              if not value:
                  raise SystemExit(message)
          expected = os.environ['PATCH_SHA256']
          encoded = os.environ['PATCH_BASE64']
          require(re.fullmatch('[0-9a-f]{64}', expected), 'Expected public patch SHA256 required')
          require(0 < len(encoded) <= 60000, 'Public patch exceeds input boundary')
          patch = base64.b64decode(encoded, validate=True)
          require(0 < len(patch) <= 45000 and b'\x00' not in patch, 'Invalid public patch bytes')
          require(hashlib.sha256(patch).hexdigest() == expected, 'Public patch hash differs')
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          require(base == os.environ['SOURCE_BASE'], 'Source base differs')
          for option in ('--check', ''):
              command = ['git', 'apply', '--whitespace=error']
              if option:
                  command.append(option)
              result = subprocess.run(command + ['-'], input=patch, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              require(result.returncode == 0, 'Public patch cannot apply exactly')
          # No proposed workflow code is executed. Every workflow/action remains
          # the reviewed dispatch controller rather than bytes in the input patch.
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          added = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()
          paths = changed + added
          require(paths and len(paths) <= 64, 'Unexpected public patch file count')
          require(all(not name.startswith('.github/') and not name.startswith('/') and
                      '..' not in name.split('/') for name in paths), 'Public patch cannot change automation')
          require(all(name.startswith(('crates/', 'deploy/guard/')) or name in
                      ('Cargo.toml', 'Cargo.lock', 'deny.toml', 'rust-toolchain.toml') for name in paths),
                  'Public patch path outside product source')
          require(all(Path(name).is_file() and not Path(name).is_symlink() for name in paths),
                  'Only regular public product files may be changed')
          subprocess.run(['git', 'add', '--', *paths], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          evidence = Path('patch-evidence'); evidence.mkdir()
          (evidence / 'source.json').write_text(json.dumps({
              'schema': 1, 'kind': 'uncommitted-public-source-gate', 'base': base,
              'tree': tree, 'patch_sha256': expected, 'files': paths,
              'workflow_ref': os.environ['GITHUB_WORKFLOW_REF'],
              'workflow_sha': os.environ['GITHUB_WORKFLOW_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'flow_histories_per_property': 4000, 'native_signed_release_evidence': False,
          }, indent=2) + '\n')
          (evidence / 'reviewed.patch').write_bytes(patch)
          print('Admitted exact reviewed public patch ' + expected + ' at source tree ' + tree)
          PY
      - run: rustup toolchain install
      - if: matrix.partition == 'workspace'
        run: cargo fmt --all -- --check
      - if: matrix.partition == 'workspace'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - if: matrix.partition == 'workspace'
        run: cargo test --workspace --locked -- --exact --skip the_generator_reaches_every_path --skip the_implementation_is_the_reference --skip the_implementation_is_the_reference_when_told_in_time --skip the_order_of_the_reports_does_not_matter
      - name: Full deterministic property coverage
        if: matrix.partition != 'workspace'
        env:
          FLOW_TEST: ${{ matrix.partition }}
        run: cargo test --locked -p zunder-venue --test flows_model "$FLOW_TEST" -- --exact
      - name: Native pinned cargo-deny policy check
        if: matrix.partition == 'workspace'
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}"
          test ! -e "$RUNNER_TEMP/zunder-patch-gate-cargo-deny-0.20.2"
          test ! -L "$RUNNER_TEMP/zunder-patch-gate-cargo-deny-0.20.2"
          mkdir -m 0700 "$RUNNER_TEMP/zunder-patch-gate-cargo-deny-0.20.2"
          cargo install --locked --version 0.20.2 --root "$RUNNER_TEMP/zunder-patch-gate-cargo-deny-0.20.2" cargo-deny
          test "$("$RUNNER_TEMP/zunder-patch-gate-cargo-deny-0.20.2/bin/cargo-deny" --version)" = 'cargo-deny 0.20.2'
          "$RUNNER_TEMP/zunder-patch-gate-cargo-deny-0.20.2/bin/cargo-deny" --log-level warn --manifest-path ./Cargo.toml --all-features check
      - name: Require tested source bytes to remain unchanged
        env:
          PARTITION: ${{ matrix.partition }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          expected = json.loads(Path('patch-evidence/source.json').read_text())
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == expected['tree']
          expected['gate_passed'] = True
          expected['partition'] = os.environ['PARTITION']
          Path('patch-evidence/receipt.json').write_text(json.dumps(expected, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: public-patch-partition-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.partition }}
          path: patch-evidence/
          if-no-files-found: error
          retention-days: 30

  receipt:
    needs: check
    if: always() && needs.check.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: public-patch-partition-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: partitions
      - name: Require every partition and identical source before issuing gate receipt
        env:
          SOURCE_BASE: ${{ inputs.base_commit }}
          PATCH_SHA256: ${{ inputs.patch_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          names=['workspace','the_generator_reaches_every_path','the_implementation_is_the_reference',
                 'the_implementation_is_the_reference_when_told_in_time','the_order_of_the_reports_does_not_matter']
          run=os.environ['GITHUB_RUN_ID']; attempt=os.environ['GITHUB_RUN_ATTEMPT']
          dirs=list(Path('partitions').iterdir())
          expected={f'public-patch-partition-{run}-{attempt}-{name}' for name in names}
          assert {p.name for p in dirs}==expected and all(p.is_dir() and not p.is_symlink() for p in dirs)
          reference=None; raw=None
          for name in names:
              folder=Path('partitions')/f'public-patch-partition-{run}-{attempt}-{name}'
              receipt=json.loads((folder/'receipt.json').read_text())
              assert receipt.pop('partition')==name and receipt['gate_passed'] is True
              assert receipt['base']==os.environ['SOURCE_BASE'] and receipt['patch_sha256']==os.environ['PATCH_SHA256']
              assert receipt['run_id']==run and receipt['run_attempt']==attempt
              assert receipt['workflow_ref']==os.environ['GITHUB_WORKFLOW_REF']
              assert receipt['workflow_sha']==os.environ['GITHUB_WORKFLOW_SHA']
              assert receipt['flow_histories_per_property']==4000
              patch=(folder/'reviewed.patch').read_bytes()
              assert hashlib.sha256(patch).hexdigest()==receipt['patch_sha256']
              if reference is None: reference=receipt; raw=patch
              assert receipt==reference and patch==raw
          reference['partitions']=names
          out=Path('patch-evidence');out.mkdir()
          (out/'receipt.json').write_text(json.dumps(reference,indent=2)+'\n')
          (out/'reviewed.patch').write_bytes(raw)
          print('All workspace and full property partitions passed for identical immutable source.')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-public-patch-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: patch-evidence/
          if-no-files-found: error
          retention-days: 30
