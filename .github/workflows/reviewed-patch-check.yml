name: Public Linux transfer and actual isolated APT solve
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-input-solve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f9c50347dd3053d90abb5e3ca4849e2470cd65a5
          persist-credentials: false
      - name: Fixed source admission
        shell: bash
        run: |
          set -euo pipefail
          [[ 'f9c50347dd3053d90abb5e3ca4849e2470cd65a5' =~ ^[0-9a-f]{40}$ ]]
          printf '%s  %s\n' 'de6bb3dd790ee27f3262d7d7743527712c2c1adfc4d03ba764ca0cf108021a7e' 'deploy/guard/e2e/public-transfer/fetch_public_transfer.py' | sha256sum --check --strict
          printf '%s  %s\n' '2b03de78e9b18c164582a0842f10b17e3b98acb38ec9e5eba87b5b7ed71ede2a' 'deploy/guard/e2e/public-transfer/transfer_bundle.py' | sha256sum --check --strict
          printf '%s  %s\n' '004f7bf254d0bb03a9c8a7283a94563498882f5deea2c827eac6bd560407090c' 'deploy/guard/e2e/free_runner_inventory.sh' | sha256sum --check --strict
      - name: This execution job actual public inventory
        shell: bash
        run: |
          set -euo pipefail
          (sudo -n timeout --kill-after=5s 120s /usr/bin/bash deploy/guard/e2e/free_runner_inventory.sh) > actual-job-inventory.txt 2>&1
      - name: Fetch exact dedicated draft public asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I -S deploy/guard/e2e/public-transfer/fetch_public_transfer.py > public-transfer-receipt.json
      - name: Stage exact public inputs and solve only
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/bin/bash <<'FIXED_ROOT'
          set -euo pipefail
          umask 077
          test ! -e /opt/zunder-release-check-tools/linux-public-inputs-r1
          test ! -L /opt/zunder-release-check-tools/linux-public-inputs-r1
          test ! -e /opt/zunder-release-check-tools
          test ! -L /opt/zunder-release-check-tools
          mkdir -m 0700 /opt/zunder-release-check-tools
          mkdir -m 0700 /opt/zunder-release-check-tools/linux-public-inputs-r1
          install -o root -g root -m 0400 deploy/guard/e2e/public-transfer/transfer_bundle.py /opt/zunder-release-check-tools/linux-public-inputs-r1/transfer_bundle.py
          install -o root -g root -m 0400 deploy/guard/e2e/public-transfer/public-file-map.json /opt/zunder-release-check-tools/linux-public-inputs-r1/public-file-map.json
          install -o root -g root -m 0400 deploy/guard/e2e/public-transfer/linux-public-transfer-20261009-r1.tar /opt/zunder-release-check-tools/linux-public-inputs-r1/input.tar
          printf '%s  %s\n' '2b03de78e9b18c164582a0842f10b17e3b98acb38ec9e5eba87b5b7ed71ede2a' '/opt/zunder-release-check-tools/linux-public-inputs-r1/transfer_bundle.py' | sha256sum --check --strict
          /usr/bin/python3 -B -I -S /opt/zunder-release-check-tools/linux-public-inputs-r1/transfer_bundle.py stage --archive /opt/zunder-release-check-tools/linux-public-inputs-r1/input.tar --archive-sha 1ce0ce0755c090975cd4eb09e11b39de4e793d01ba15f706331d48ce130576bb --archive-bytes 405309440
          test ! -e /opt/zunder-release-check-tools/linux-public-solve-r1
          mkdir -m 0700 /opt/zunder-release-check-tools/linux-public-solve-r1
          printf '%s  %s\n' '3df2f256b0fe5d594cbf3d304a151633f95ac2b9c69a7a6ea6471486c4e5f123' '/opt/zunder-release-check-tools/linux-public-inputs-r1/payload/bootstrap/bootstrap.py' | sha256sum --check --strict
          timeout --kill-after=15s 600s /usr/bin/python3 -B -I -S /opt/zunder-release-check-tools/linux-public-inputs-r1/payload/bootstrap/bootstrap.py solve --architecture amd64 --bundle /opt/zunder-release-check-tools/linux-public-inputs-r1/payload/bundle/amd64-bundle.json --work /opt/zunder-release-check-tools/linux-public-solve-r1/attempt-1
          FIXED_ROOT
          sudo -n cat /opt/zunder-release-check-tools/linux-public-solve-r1/attempt-1/transaction.json | cat > actual-apt-transaction.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: public-linux-actual-job-inventory-and-solve
          path: |
            actual-job-inventory.txt
            public-transfer-receipt.json
            actual-apt-transaction.json
          if-no-files-found: error
          retention-days: 3
