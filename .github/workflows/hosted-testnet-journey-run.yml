name: Free hosted ordinary no-secret preparation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  preparation:
    if: github.repository == 'zunderlabs/zunder-guard' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Exact public source and inert contracts
        shell: bash
        env:
          CONTROL_SOURCE: ${{ github.workflow_sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          [[ "$CONTROL_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CONTROL_SOURCE"
          test -z "$(git status --porcelain)"
          python3 -I -B deploy/guard/e2e/hosted_launch/test_launch.py
      - name: Fresh runner public OS prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/sbin/swapoff -a
          test "$(wc -l < /proc/swaps)" -eq 1
          sudo /usr/bin/apt-get update -qq > /dev/null
          sudo /usr/bin/apt-get install --no-install-recommends -y -qq bubblewrap nftables libnss3-tools python3-pip > /dev/null
      - name: Materialize and inventory without credential input
        shell: bash
        env:
          CONTROL_SOURCE: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          sudo /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 /usr/bin/python3.12 -I -B deploy/guard/e2e/hosted_launch/bootstrap.py --workspace "$GITHUB_WORKSPACE" --control-source "$CONTROL_SOURCE"
      - name: Export bounded public preparation receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/hosted-ordinary-preparation"
          if sudo test -d /run/zunder-hosted-ordinary/reports; then
            sudo /usr/bin/python3.12 -I -B deploy/guard/e2e/hosted_launch/export.py --destination "$RUNNER_TEMP/hosted-ordinary-preparation"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: hosted-ordinary-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-ordinary-preparation/*.json
          if-no-files-found: error
          retention-days: 7
