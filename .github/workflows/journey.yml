      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - run: npm ci --prefix deploy/guard/journeys
      - name: Verify exact release subjects before purchase API requests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/quote-evidence"
          bash deploy/guard/github/verify-release-assets.sh "$TAG" "$RUNNER_TEMP/quote-evidence/assets" \
            2>&1 | tee "$RUNNER_TEMP/quote-evidence/assets.log"
          python - <<'PY'
          import os
          from pathlib import Path
          from guard_harness.testnet_run import verified_asset
          verified_asset(Path(os.environ['RUNNER_TEMP']) / 'quote-evidence/assets', 'install.sh',
                         tag=os.environ['TAG'], commit=os.environ['SOURCE'])
          PY
      - name: Authenticate canonical admission before the nightly purchase
        if: ${{ inputs.profile == 'nightly' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
        shell: bash
        run: |
          python -m guard_harness.monitor --tag "$TAG" --commit "$SOURCE" --work "$RUNNER_TEMP/nightly-admission"
      - name: Install Chromium for the pricing and checkout browser journey
        if: ${{ contains(fromJSON('["P1","P2","P3","P5","P6"]'), matrix.journey) }}
        working-directory: deploy/guard/journeys
        run: npx playwright install --with-deps chromium
      - name: Run paid journey through browser, testnet payment, email and released licence install
        if: ${{ contains(fromJSON('["P1","P2","P3","P5","P6"]'), matrix.journey) }}
        working-directory: deploy/guard/journeys
        env:
          GUARD_PAY_TO_HYPERLIQUID: ${{ vars.E2E_PAY_TO_HYPERLIQUID }}
          GUARD_PAY_TO_ARBITRUM: ${{ vars.E2E_PAY_TO_ARBITRUM }}
          GUARD_PAY_TO_BASE: ${{ vars.E2E_PAY_TO_BASE }}
          GUARD_PAID_JOURNEY: ${{ matrix.journey }}
          GUARD_PURCHASE_WORK: ${{ runner.temp }}/quote-evidence/${{ matrix.journey }}
          GUARD_BROWSER_DIAGNOSTICS: ${{ runner.temp }}/quote-evidence/click-diagnostics
          GUARD_RELEASE_ASSETS: ${{ runner.temp }}/quote-evidence/assets
          GUARD_RELEASE_TAG: ${{ inputs.tag }}
          GUARD_RELEASE_COMMIT: ${{ inputs.commit }}
          GUARD_LICENSE_ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
          GUARD_STAGING_URL: ${{ vars.GUARD_STAGING_URL }}
          GUARD_INBOX_URL: ${{ vars.GUARD_INBOX_URL }}
          GUARD_EMAIL_DOMAIN: ${{ vars.GUARD_EMAIL_DOMAIN }}
          GUARD_ACCESS_CLIENT_ID: ${{ secrets.E2E_ACCESS_CLIENT_ID }}
          GUARD_ACCESS_CLIENT_SECRET: ${{ secrets.E2E_ACCESS_CLIENT_SECRET }}
          GUARD_ORDER_TOKEN: ${{ secrets.E2E_ORDER_TOKEN }}
          GUARD_INBOX_TOKEN: ${{ secrets.E2E_INBOX_TOKEN }}
          E2E_PAYER_HYPERLIQUID_TESTNET_KEY: ${{ contains(fromJSON('["P1","P5","P6"]'), matrix.journey) && secrets.E2E_PAYER_HYPERLIQUID_TESTNET_KEY || '' }}
          E2E_PAYER_BLOCKED_KEY: ${{ matrix.journey == 'P5' && secrets.E2E_PAYER_BLOCKED_KEY || '' }}
          E2E_PAYER_EVM_SEPOLIA_KEY: ${{ contains(fromJSON('["P2","P3"]'), matrix.journey) && secrets.E2E_PAYER_EVM_SEPOLIA_KEY || '' }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          GUARD_BROWSER_BOUNDARY_TEST=1 npm test -- browser-boundary.test.ts 2>&1 | tee "$RUNNER_TEMP/quote-evidence/browser-boundary.log"
          if [ "$GUARD_PAID_JOURNEY" = P5 ]; then
            GUARD_TEST_PROOF="$RUNNER_TEMP/quote-evidence/browser-proof.json" npm test -- edges.test.ts 2>&1 | tee "$RUNNER_TEMP/quote-evidence/journey.log"
          else
            GUARD_TEST_PROOF="$RUNNER_TEMP/quote-evidence/browser-proof.json" npm test -- paid.test.ts 2>&1 | tee "$RUNNER_TEMP/quote-evidence/journey.log"
          fi
      - name: Run quote-only journey against real C4 staging
        if: ${{ !contains(fromJSON('["P1","P2","P3","P5","P6"]'), matrix.journey) }}
        working-directory: deploy/guard/journeys
        env:
          JOURNEY: ${{ matrix.journey }}
          GUARD_STAGING_URL: ${{ vars.GUARD_STAGING_URL }}
          GUARD_INBOX_URL: ${{ vars.GUARD_INBOX_URL }}
          GUARD_EMAIL_DOMAIN: ${{ vars.GUARD_EMAIL_DOMAIN }}
          GUARD_ACCESS_CLIENT_ID: ${{ secrets.E2E_ACCESS_CLIENT_ID }}
          GUARD_ACCESS_CLIENT_SECRET: ${{ secrets.E2E_ACCESS_CLIENT_SECRET }}
          GUARD_ORDER_TOKEN: ${{ secrets.E2E_ORDER_TOKEN }}
          GUARD_INBOX_TOKEN: ${{ secrets.E2E_INBOX_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          [ -n "$GUARD_STAGING_URL" ]
          GUARD_TEST_PROOF="$RUNNER_TEMP/quote-evidence/browser-proof.json" npm test -- quote.test.ts --grep "$JOURNEY quote:" \
            2>&1 | tee "$RUNNER_TEMP/quote-evidence/journey.log"
      - name: Record passing purchase journey on authenticated build bytes
        if: ${{ inputs.profile == 'all' }}
        env:
          JOURNEY: ${{ matrix.journey }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
        run: |
          python -m guard_harness.purchase_evidence --work "$RUNNER_TEMP/quote-evidence" \
            --row "$JOURNEY" --tag "$TAG" --commit "$SOURCE"
      - name: Attest passing purchase journey
        if: ${{ inputs.profile == 'all' }}
        id: evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/quote-evidence/assets/release-manifest.json
          predicate-type: https://zunderlabs.com/guard/journey/v1
          predicate-path: ${{ runner.temp }}/quote-evidence/predicate.json
      - name: Retain sanitized purchase evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.journey }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/quote-evidence/assets.log
            ${{ runner.temp }}/quote-evidence/journey.log
            ${{ runner.temp }}/quote-evidence/browser-proof.json
            ${{ runner.temp }}/quote-evidence/browser-boundary.log
            ${{ runner.temp }}/quote-evidence/click-diagnostics/pricing-buy-pro/screenshot.png
            ${{ runner.temp }}/quote-evidence/click-diagnostics/pricing-buy-pro/page.html
            ${{ runner.temp }}/quote-evidence/click-diagnostics/pricing-buy-pro/diagnostics.json
            ${{ runner.temp }}/quote-evidence/predicate.json
            ${{ runner.temp }}/quote-evidence/P*/payment/payment-attempt.json
            ${{ runner.temp }}/quote-evidence/P*/payment/payment-failure.json
            ${{ runner.temp }}/quote-evidence/P*/payment/payment-receipt.json
            ${{ runner.temp }}/quote-evidence/P5/under/payment-attempt.json
            ${{ runner.temp }}/quote-evidence/P5/under/payment-receipt.json
            ${{ runner.temp }}/quote-evidence/P5/over/payment-attempt.json
            ${{ runner.temp }}/quote-evidence/P5/over/payment-receipt.json
            ${{ runner.temp }}/quote-evidence/P5/late/payment-attempt.json
            ${{ runner.temp }}/quote-evidence/P5/late/payment-receipt.json
            ${{ runner.temp }}/quote-evidence/P5/blocked/payment-attempt.json
            ${{ runner.temp }}/quote-evidence/P5/blocked/payment-receipt.json
            ${{ runner.temp }}/quote-evidence/P*/renewal-payment/payment-attempt.json
            ${{ runner.temp }}/quote-evidence/P*/renewal-payment/payment-failure.json
            ${{ runner.temp }}/quote-evidence/P*/renewal-payment/payment-receipt.json
            ${{ runner.temp }}/quote-evidence/P*/licensed/licence-receipt.json
            ${{ steps.evidence.outputs.bundle-path }}
          if-no-files-found: warn
          retention-days: 7

  signing-subjects:
    if: ${{ inputs.profile == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.commit }}
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.13'
    - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      with:
        cosign-release: v3.1.3
    - run: |
        python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
        python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
    - name: Authenticate exact released source and manifest
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
        SOURCE: ${{ inputs.commit }}
      run: 'set -euo pipefail

        [ "$SOURCE" = "$GITHUB_SHA" ]

        [ "$GITHUB_REPOSITORY" = zunderlabs/zunder-guard ]

        case "$GITHUB_REF" in refs/heads/main|"refs/tags/$TAG") ;; *) exit 1 ;; esac

        mkdir -p "$RUNNER_TEMP/sdk"

        bash deploy/guard/github/verify-release-assets.sh "$TAG" "$RUNNER_TEMP/sdk/assets"
        > "$RUNNER_TEMP/sdk/assets.log" 2>&1

        '
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: signing-subjects-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/sdk/assets
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
  signing-contract:
    if: ${{ inputs.profile == 'all' }}
    name: SDK ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux
          runner: ubuntu-24.04
        - platform: macos
          runner: macos-15
        - platform: windows
          runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.commit }}
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.13'
    - run: |
        python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
        python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
    # Every artifact of the run, one directory each (a pattern matching a single artifact
    # would be extracted flat and lose its attempt); the helper selects the latest attempt.
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: ${{ runner.temp }}/sdk/subjects-attempts
    - name: Select the latest signing subjects at or before this attempt
      run: python -m guard_harness.run_attempts --directory "$RUNNER_TEMP/sdk/subjects-attempts"
        --prefix signing-subjects --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
        --move-to "$RUNNER_TEMP/sdk/assets"
    - name: Install the pinned SDK toolchain in fresh job-private homes
      env:
        RUSTUP_HOME: ${{ runner.temp }}/sdk-rustup
        CARGO_HOME: ${{ runner.temp }}/sdk-cargo
      run: |
        set -euo pipefail
        [ ! -e "$RUSTUP_HOME" ]
        [ ! -e "$CARGO_HOME" ]
        python -c 'import os,pathlib; [pathlib.Path(os.environ[k]).mkdir(mode=0o700) for k in ("RUSTUP_HOME","CARGO_HOME")]'
        unset RUSTUP_TOOLCHAIN
        rustup toolchain install --no-self-update
        python -c 'import os,tomllib; pin=tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"]; f=open(os.environ["GITHUB_ENV"],"a"); f.write("RUSTUP_TOOLCHAIN="+pin+"\n"); f.writelines(k+"="+os.environ[k]+"\n" for k in ("RUSTUP_HOME","CARGO_HOME")); f.close()'
        rustup show active-toolchain
        cargo --version
    - name: Run SDK vectors and native custody contracts
      if: runner.os != 'Windows'
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
        SOURCE: ${{ inputs.commit }}
      run: python -m guard_harness.signing_vectors --tag "$TAG" --commit "$SOURCE"
        --assets "$RUNNER_TEMP/sdk/assets" --output "$RUNNER_TEMP/sdk/proof"
    - name: Select the installed MSVC developer toolchain before Windows SDK tests
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
        $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'Installed MSVC toolchain not found' }
        $vcvars = Join-Path $installation 'VC/Auxiliary/Build/vcvars64.bat'
        $variables = & $env:ComSpec /d /s /c "`"$vcvars`" >nul && set"
        if ($LASTEXITCODE -ne 0) { throw 'MSVC developer environment setup failed' }
        foreach ($line in $variables) {
          $name, $value = $line -split '=', 2
          if ($name -in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCINSTALLDIR', 'VCToolsInstallDir', 'WindowsSdkDir')) {
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "$name=$value" -Encoding utf8
          }
        }
    - name: Run SDK vectors with the native Windows linker path
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
        SOURCE: ${{ inputs.commit }}
      run: |
        python -m guard_harness.signing_vectors --tag "$env:TAG" --commit "$env:SOURCE" --assets "$env:RUNNER_TEMP/sdk/assets" --output "$env:RUNNER_TEMP/sdk/proof"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      id: signing
      with:
        subject-path: ${{ runner.temp }}/sdk/assets/release-manifest.json
        predicate-type: https://zunderlabs.com/guard/signing/v1
        predicate-path: ${{ runner.temp }}/sdk/proof/signing.predicate.json
    - env:
        BUNDLE: ${{ steps.signing.outputs.bundle-path }}
        PLATFORM: ${{ matrix.platform }}
      run: cp "$BUNDLE" "$RUNNER_TEMP/sdk/signing-$PLATFORM.sigstore.json"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() }}
      with:
        name: signing-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: '${{ runner.temp }}/sdk/*.sigstore.json

          ${{ runner.temp }}/sdk/*.log

          ${{ runner.temp }}/sdk/proof/*.log'
        if-no-files-found: warn
        retention-days: 7
    needs: signing-subjects
  signing-gate:
    if: ${{ inputs.profile == 'all' }}
    name: M3
    needs:
    - signing-contract
    - testnet-foreground
    - testnet-systemd
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.commit }}
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.13'
    - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      with:
        cosign-release: v3.1.3
    - run: |
        python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
        python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
    - name: Authenticate exact released source and manifest
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
        SOURCE: ${{ inputs.commit }}
      run: 'set -euo pipefail

        [ "$SOURCE" = "$GITHUB_SHA" ]

        [ "$GITHUB_REPOSITORY" = zunderlabs/zunder-guard ]

        case "$GITHUB_REF" in refs/heads/main|"refs/tags/$TAG") ;; *) exit 1 ;; esac

        mkdir -p "$RUNNER_TEMP/M3"

        bash deploy/guard/github/verify-release-assets.sh "$TAG" "$RUNNER_TEMP/M3/assets"
        > "$RUNNER_TEMP/M3/assets.log" 2>&1

        '
    # Every artifact of the run, one directory each (a pattern matching a single artifact
    # would be extracted flat and lose its attempt); the latest attempt at or before this
    # one is selected per producer below, never by download order.
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: ${{ runner.temp }}/M3/attempts
    - name: Authenticate all three SDK platforms and both live testnet journeys
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
        SOURCE: ${{ inputs.commit }}
      run: |
        set -euo pipefail
        python - <<'PY_M3'
        import json, os
        from pathlib import Path
        from guard_harness.run_attempts import latest
        root = Path(os.environ['RUNNER_TEMP']) / 'M3'
        run, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
        evidence = root / 'evidence'
        evidence.mkdir()
        for platform in ('linux', 'macos', 'windows'):
            name = 'signing-' + platform
            source = latest(root / 'attempts', name, run, attempt).path / (name + '.sigstore.json')
            if source.is_symlink() or not source.is_file():
                raise SystemExit('Expected one signing bundle per platform')
            (evidence / (name + '.sigstore.json')).write_bytes(source.read_bytes())
        for row in ('T1', 'T2'):
            bundles = {}
            for path in latest(root / 'attempts', row, run, attempt).path.rglob('*.json'):
                value = json.loads(path.read_bytes())
                if isinstance(value, dict) and 'dsseEnvelope' in value and 'verificationMaterial' in value:
                    bundles[path.read_bytes()] = path
            if len(bundles) != 1:
                raise SystemExit('Expected one authenticated testnet bundle')
            (evidence / (row + '.sigstore.json')).write_bytes(next(iter(bundles)))
        PY_M3
        python -m guard_harness.mainnet_evidence --row M3 --tag "$TAG" --commit "$SOURCE" --assets "$RUNNER_TEMP/M3/assets" --evidence "$RUNNER_TEMP/M3/evidence" --output "$RUNNER_TEMP/M3/proof"
    - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      id: evidence
      with:
        subject-path: ${{ runner.temp }}/M3/assets/release-manifest.json
        predicate-type: https://zunderlabs.com/guard/journey/v1
        predicate-path: ${{ runner.temp }}/M3/proof/M3.predicate.json
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() }}
      with:
        name: M3-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/M3/assets.log

          ${{ runner.temp }}/M3/proof/*

          ${{ steps.evidence.outputs.bundle-path }}'
        if-no-files-found: warn
        retention-days: 7

  testnet-failure-alert:
    needs: [testnet-foreground, testnet-systemd]
    if: ${{ always() && inputs.profile == 'all' && (contains(fromJSON('["failure","cancelled"]'), needs.testnet-foreground.result) || contains(fromJSON('["failure","cancelled"]'), needs.testnet-systemd.result)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: monitor
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ inputs.commit }}', persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - name: Notify failed C6 journey through authenticated alert endpoint
        env:
          MONITOR_ALERT_TOKEN: ${{ secrets.MONITOR_ALERT_TOKEN }}
          RUN_URL: https://github.com/zunderlabs/zunder-guard/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: python -m guard_harness.monitor --alert --check C6.journey-failed --run-url "$RUN_URL"

  checkout-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'checkout' }}
    name: Checkout diagnostic ${{ matrix.journey }} (no payment)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: e2e
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: {journey: [P1, P2, P3]}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '24'}
      - run: npm ci --prefix deploy/guard/journeys
      - working-directory: deploy/guard/journeys
        run: npx playwright install --with-deps chromium
      - name: Check staged pricing, ordinary consent and quote; stop before payment
        working-directory: deploy/guard/journeys
        env:
          GUARD_CHECKOUT_DIAGNOSTIC: '1'
          GUARD_PAID_JOURNEY: ${{ matrix.journey }}
          GUARD_STAGING_URL: ${{ vars.GUARD_STAGING_URL }}
          GUARD_EMAIL_DOMAIN: ${{ vars.GUARD_EMAIL_DOMAIN }}
          GUARD_LICENSE_ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
          GUARD_PAY_TO_HYPERLIQUID: ${{ vars.E2E_PAY_TO_HYPERLIQUID }}
          GUARD_PAY_TO_ARBITRUM: ${{ vars.E2E_PAY_TO_ARBITRUM }}
          GUARD_PAY_TO_BASE: ${{ vars.E2E_PAY_TO_BASE }}
          GUARD_ACCESS_CLIENT_ID: ${{ secrets.E2E_ACCESS_CLIENT_ID }}
          GUARD_ACCESS_CLIENT_SECRET: ${{ secrets.E2E_ACCESS_CLIENT_SECRET }}
          GUARD_BROWSER_DIAGNOSTICS: ${{ runner.temp }}/checkout-diagnostic
          GUARD_TEST_PROOF: ${{ runner.temp }}/checkout-diagnostic-proof.json
        run: npm test -- purchase/paid.test.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: checkout-diagnostic-${{ matrix.journey }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/checkout-diagnostic/*.json
            ${{ runner.temp }}/checkout-diagnostic/pricing-buy-pro/diagnostics.json
            ${{ runner.temp }}/checkout-diagnostic-proof.json
          if-no-files-found: warn
          retention-days: 7


  payment-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'payment' && contains(github.workflow_ref, '/.github/workflows/journey.yml@') }}
    name: ${{ inputs.payment_network }} payment diagnostic only (no gate credit)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: e2e
    concurrency:
      group: guard-e2e-purchase-${{ inputs.payment_network }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - name: Seal standalone trusted harness and exact released identities before checkout
        env:
          PROFILE: ${{ inputs.profile }}
          PAYMENT_NETWORK: ${{ inputs.payment_network }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          PREVIOUS_SOURCE: ${{ inputs.previous_commit }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = zunderlabs/zunder-guard ]
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]
          [ "$PROFILE" = payment ]
          case "$PAYMENT_NETWORK" in arbitrum|base) ;; *) exit 1 ;; esac
          [[ $GITHUB_SHA =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ $SOURCE =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ $PREVIOUS_SOURCE =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]] || exit 1
          [[ $PREVIOUS_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]] || exit 1
          [ "$TAG" != "$PREVIOUS_TAG" ]
          [[ $GITHUB_REF =~ ^refs/heads/(main|preview/[a-z0-9-]+)$ ]]
          [ "$WORKFLOW_REF" = "zunderlabs/zunder-guard/.github/workflows/journey.yml@$GITHUB_REF" ]
          [ "$WORKFLOW_SHA" = "$GITHUB_SHA" ]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - name: Read-only staging wallet refill preflight
        env:
          E2E_TESTNET_ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
        run: python3 -I -S deploy/guard/harness/src/guard_harness/wallet_preflight.py
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '24'}
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: v3.1.3}
      - name: Install only the source-bound diagnostic harness
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
          npm ci --prefix deploy/guard/journeys
      - name: Authenticate exact released candidate and predecessor before staging or payer custody
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          PREVIOUS_SOURCE: ${{ inputs.previous_commit }}
          DIAGNOSTIC: 'true'
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          install -d -m 700 "$RUNNER_TEMP/payment-diagnostic"
          python -m guard_harness.native_release --tag "$TAG" --commit "$SOURCE" \
            --previous-tag "$PREVIOUS_TAG" --previous-commit "$PREVIOUS_SOURCE" \
            --work "$RUNNER_TEMP/payment-diagnostic/subjects"
          python - <<'PY_IDENTITY'
          import json, os
          from pathlib import Path
          from guard_harness.native_release import Release
          root = Path(os.environ['RUNNER_TEMP']) / 'payment-diagnostic/subjects'
          value = json.loads((root / 'input.json').read_bytes())
          if (value['diagnostic'] is not True or value['harness_commit'] != os.environ['GITHUB_SHA']
              or value['tag'] != os.environ['TAG'] or value['commit'] != os.environ['SOURCE']
              or value['previous_tag'] != os.environ['PREVIOUS_TAG']
              or value['previous_commit'] != os.environ['PREVIOUS_SOURCE']):
              raise SystemExit('payment diagnostic release identity refused')
          Release(value['tag'], value['commit'], root / 'candidate/assets').asset('install.sh')
          PY_IDENTITY
      - name: Install Chromium for one fresh staging quote
        working-directory: deploy/guard/journeys
        run: npx playwright install --with-deps chromium
      - name: One fresh testnet payment only; no delivery or installed licence gate
        id: payment
        working-directory: deploy/guard/journeys
        env:
          PROFILE: payment
          GUARD_PAYMENT_DIAGNOSTIC: '1'
          GUARD_PAYMENT_DIAGNOSTIC_PROFILE: payment
          GUARD_DIAGNOSTIC_HARNESS_COMMIT: ${{ github.sha }}
          GUARD_PAID_JOURNEY: ${{ inputs.payment_network == 'arbitrum' && 'P2' || 'P3' }}
          GUARD_PURCHASE_WORK: ${{ runner.temp }}/payment-diagnostic/payment
          GUARD_RELEASE_ASSETS: ${{ runner.temp }}/payment-diagnostic/subjects/candidate/assets
          GUARD_RELEASE_TAG: ${{ inputs.tag }}
          GUARD_RELEASE_COMMIT: ${{ inputs.commit }}
          GUARD_LICENSE_ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
          GUARD_STAGING_URL: ${{ vars.GUARD_STAGING_URL }}
          GUARD_EMAIL_DOMAIN: ${{ vars.GUARD_EMAIL_DOMAIN }}
          GUARD_PAY_TO_ARBITRUM: ${{ inputs.payment_network == 'arbitrum' && vars.E2E_PAY_TO_ARBITRUM || '' }}
          GUARD_PAY_TO_BASE: ${{ inputs.payment_network == 'base' && vars.E2E_PAY_TO_BASE || '' }}
          GUARD_ACCESS_CLIENT_ID: ${{ secrets.E2E_ACCESS_CLIENT_ID }}
          GUARD_ACCESS_CLIENT_SECRET: ${{ secrets.E2E_ACCESS_CLIENT_SECRET }}
          GUARD_ORDER_TOKEN: ${{ secrets.E2E_ORDER_TOKEN }}
          E2E_PAYER_EVM_SEPOLIA_KEY: ${{ secrets.E2E_PAYER_EVM_SEPOLIA_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          npm test -- purchase/paid.test.ts > "$RUNNER_TEMP/payment-diagnostic/private-journey.log" 2>&1
      - name: Retain bounded authored failure phases without private Playwright output
        if: ${{ always() }}
        env:
          PAYMENT_STEP_OUTCOME: ${{ steps.payment.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY_PHASE'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'payment-diagnostic'
          root.mkdir(mode=0o700, exist_ok=True)
          outcome = os.environ.get('PAYMENT_STEP_OUTCOME', '')
          if outcome not in {'success', 'failure', 'cancelled', 'skipped'}: outcome = 'unknown'
          phases = {'checkout-plan-pro', 'checkout-term-month', 'checkout-accounts',
                    'checkout-company', 'checkout-street', 'checkout-postcode', 'checkout-city',
                    'checkout-email', 'checkout-country', 'checkout-network', 'checkout-business',
                    'checkout-terms', 'checkout-quote'}
          authored = []
          log = root / 'private-journey.log'
          if log.is_file() and not log.is_symlink() and log.stat().st_size <= 1024 * 1024:
              for line in log.read_text(errors='replace').splitlines():
                  # Playwright prefixes console records; only a strict literal prefix is admitted.
                  if not line.startswith('checkout-phase '): continue
                  try: value = json.loads(line[len('checkout-phase '):])
                  except (ValueError, RecursionError): continue
                  if (not isinstance(value, dict) or not isinstance(value.get('phase'), str)
                      or value['phase'] not in phases
                      or type(value.get('quoteRequested')) is not bool
                      or type(value.get('quoteResponded')) is not bool): continue
                  authored.append({k: value[k] for k in ('phase', 'quoteRequested', 'quoteResponded')})
                  if len(authored) == 16: break
          value = {'schema':1, 'diagnostic':True, 'gate_eligible':False,
                   'payment_step_outcome':outcome, 'checkout_phases':authored}
          with (root / 'phase-diagnostic.json').open('x') as stream:
              stream.write(json.dumps(value) + '\n')
              stream.flush()
              os.fsync(stream.fileno())
          PY_PHASE
      - name: Retain only finite payment diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: payment-diagnostic-${{ inputs.payment_network }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/payment-diagnostic/payment/payment/payment-attempt.json
            ${{ runner.temp }}/payment-diagnostic/payment/payment/payment-failure.json
            ${{ runner.temp }}/payment-diagnostic/payment/payment/payment-receipt.json
            ${{ runner.temp }}/payment-diagnostic/payment/payment-diagnostic.json
            ${{ runner.temp }}/payment-diagnostic/phase-diagnostic.json
          if-no-files-found: warn
          retention-days: 7
