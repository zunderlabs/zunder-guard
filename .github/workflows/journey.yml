# Canonical private source; exported once to .github/workflows/journey.yml.
name: journey
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      commit:
        type: string
        required: true
      profile:
        type: string
        default: all
    # Caller admission is required even for secrets stored only in e2e.
    # Optional credentials are guarded by the specific all-profile row that uses them.
    secrets:
      E2E_ACCESS_CLIENT_ID:
        required: true
      E2E_ACCESS_CLIENT_SECRET:
        required: true
      E2E_ORDER_TOKEN:
        required: true
      E2E_INBOX_TOKEN:
        required: true
      E2E_PAYER_HYPERLIQUID_TESTNET_KEY:
        required: true
      E2E_PAYER_EVM_SEPOLIA_KEY:
        required: false
      E2E_PAYER_BLOCKED_KEY:
        required: false
      E2E_TESTNET_API_WALLET_KEY:
        required: false
      E2E_TESTNET_OWNER_KEY:
        required: false
      MONITOR_ALERT_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  testnet-foreground:
    if: ${{ inputs.profile == 'all' }}
    name: T1
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: e2e
    # T2 and nightly must use this same account group; never interrupt protection.
    concurrency:
      group: guard-e2e-testnet
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
      attestations: write
    steps:
      - name: Bind the caller source before checkout or custody
        env:
          SOURCE: ${{ inputs.commit }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = zunderlabs/zunder-guard ]
          [[ $SOURCE =~ ^[0-9a-f]{40}$ && $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]
          [ "$SOURCE" = "$GITHUB_SHA" ]
          case "$GITHUB_REF" in refs/heads/main|"refs/tags/$TAG") ;; *) exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Install the release's harness
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --prefix deploy/guard/journeys
      - name: Authenticate builder from the released keyless paper Guard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$RUNNER_TEMP/guard-release"
          bash deploy/guard/github/verify-release-assets.sh "$TAG" "$RUNNER_TEMP/guard-release/P8-assets" > "$RUNNER_TEMP/guard-release/P8-assets.log" 2>&1
          python -m guard_harness.builder_journey descriptor --assets "$RUNNER_TEMP/guard-release/P8-assets" --work "$RUNNER_TEMP/guard-release/P8-subject" --tag "$TAG" --commit "$SOURCE" --account "$ACCOUNT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'guard-release/P8-subject/builder-descriptor.json'
          value = json.loads(path.read_bytes())
          with Path(os.environ['GITHUB_ENV']).open('a') as output:
              output.write('GUARD_BUILDER_APPROVAL_DESCRIPTOR=' + str(path) + '\n')
              output.write('GUARD_BUILDER_APPROVAL_ADDRESS=' + value['builder'] + '\n')
          PY
      - name: Install Chromium for the staging approval page
        working-directory: deploy/guard/journeys
        run: npx playwright install --with-deps chromium
      - name: P8 browser approval with the dedicated testnet owner
        working-directory: deploy/guard/journeys
        env:
          GUARD_PAID_JOURNEY: P8
          GUARD_PURCHASE_WORK: ${{ runner.temp }}/guard-release/P8-approval
          GUARD_RELEASE_COMMIT: ${{ inputs.commit }}
          GUARD_BUILDER_APPROVAL_ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
          GUARD_BUILDER_APPROVAL_OWNER_KEY: ${{ secrets.E2E_TESTNET_OWNER_KEY }}
          GUARD_STAGING_URL: ${{ vars.GUARD_STAGING_URL }}
          GUARD_ACCESS_CLIENT_ID: ${{ secrets.E2E_ACCESS_CLIENT_ID }}
          GUARD_ACCESS_CLIENT_SECRET: ${{ secrets.E2E_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          GUARD_BROWSER_BOUNDARY_TEST=1 npm test -- browser-boundary.test.ts > "$RUNNER_TEMP/guard-release/P8-boundary.log" 2>&1
          npm test -- approval.test.ts > "$RUNNER_TEMP/guard-release/P8-browser.log" 2>&1
      - name: Reserve cleanup against the recorded job start
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_PAGES: ${{ runner.temp }}/journey-jobs.json
          JOB_TIMEOUT_SECONDS: '7200'
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$JOB_PAGES"
          python -m guard_harness.job_deadline
      - name: Run T1 with inherited wallet stdin
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          E2E_ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
          API_WALLET: ${{ vars.E2E_TESTNET_API_WALLET_ADDRESS }}
          WALLET_INPUT: ${{ secrets.E2E_TESTNET_API_WALLET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          [ -n "$WALLET_INPUT" ]
          install -d -m 700 "$RUNNER_TEMP/guard-release"
          printf '%s\n' "$WALLET_INPUT" | env -u WALLET_INPUT python -m guard_harness.testnet_run \
            --tag "$TAG" --commit "$SOURCE" --account "$E2E_ACCOUNT" --api-wallet "$API_WALLET" \
            --deadline "$JOURNEY_DEADLINE" --work "$RUNNER_TEMP/guard-release/T1" \
            --builder-approval "$RUNNER_TEMP/guard-release/P8-approval/approval-receipt.json"
      - name: Attest passing T1 against the signed immutable manifest
        id: evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/guard-release/T1/assets/release-manifest.json
          predicate-type: https://zunderlabs.com/guard/journey/v1
          predicate-path: ${{ runner.temp }}/guard-release/T1/T1.predicate.json
      - name: Attest completed P8 including the actual Guard fee-bearing fill
        id: fee-evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/guard-release/T1/assets/release-manifest.json
          predicate-type: https://zunderlabs.com/guard/journey/v1
          predicate-path: ${{ runner.temp }}/guard-release/T1/P8.predicate.json
      - name: Retain only completed P8 proof and signed evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: P8-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/guard-release/T1/P8.fee-proof.json
            ${{ runner.temp }}/guard-release/T1/P8.predicate.json
            ${{ runner.temp }}/guard-release/P8-assets.log
            ${{ runner.temp }}/guard-release/P8-boundary.log
            ${{ runner.temp }}/guard-release/P8-browser.log
            ${{ steps.fee-evidence.outputs.bundle-path }}
          if-no-files-found: warn
          retention-days: 7
      - name: Independent keyless C6 flat scan after failure
        if: ${{ failure() || cancelled() }}
        env:
          E2E_ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
        run: python -m guard_harness.failure_scan --work "$RUNNER_TEMP/guard-release/T1-failure/postfailure-flat.json"
      - name: Retain sanitized evidence on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: T1-${{ github.run_id }}-${{ github.run_attempt }}
          # Explicit files only: runtime includes credentials and must never be uploaded.
          path: |
            ${{ runner.temp }}/guard-release/T1/receipt.json
            ${{ runner.temp }}/guard-release/T1-failure/postfailure-flat.json
            ${{ runner.temp }}/guard-release/T1/assets.log
            ${{ runner.temp }}/guard-release/T1/runtime/init.log
            ${{ runner.temp }}/guard-release/T1/runtime/pair.log
            ${{ runner.temp }}/guard-release/T1/runtime/process.log
            ${{ runner.temp }}/guard-release/T1/runtime/mcp.log
            ${{ runner.temp }}/guard-release/T1/T1.predicate.json
            ${{ steps.evidence.outputs.bundle-path }}
          if-no-files-found: warn
          retention-days: 7

  testnet-systemd:
    if: ${{ inputs.profile == 'all' }}
    needs: testnet-foreground
    name: T2
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: e2e
    # T2 and nightly must use this same account group; never interrupt protection.
    concurrency:
      group: guard-e2e-testnet
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
      attestations: write
    steps:
      - name: Bind the caller source before checkout or custody
        env:
          SOURCE: ${{ inputs.commit }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = zunderlabs/zunder-guard ]
          [[ $SOURCE =~ ^[0-9a-f]{40}$ && $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]
          [ "$SOURCE" = "$GITHUB_SHA" ]
          case "$GITHUB_REF" in refs/heads/main|"refs/tags/$TAG") ;; *) exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Install the release's harness
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - name: Reserve cleanup against the recorded job start
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_PAGES: ${{ runner.temp }}/journey-jobs.json
          JOB_TIMEOUT_SECONDS: '7200'
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$JOB_PAGES"
          python -m guard_harness.job_deadline
      - name: Run T2 with inherited wallet stdin
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          E2E_ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
          API_WALLET: ${{ vars.E2E_TESTNET_API_WALLET_ADDRESS }}
          WALLET_INPUT: ${{ secrets.E2E_TESTNET_API_WALLET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          [ -n "$WALLET_INPUT" ]
          ROOT_PARENT="/root/guard-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sudo install -d -o root -g root -m 700 "$ROOT_PARENT"
          MARKER=$(python -c 'import secrets; print(secrets.token_hex(16))')
          printf '%s' "$MARKER" | sudo tee /etc/zunder-native-disposable >/dev/null
          sudo chmod 600 /etc/zunder-native-disposable
          printf '%s\n' "$WALLET_INPUT" | env -u WALLET_INPUT sudo --preserve-env=GH_TOKEN,PATH \
            "$(command -v python)" -m guard_harness.testnet_run --service-marker "$MARKER" \
            --tag "$TAG" --commit "$SOURCE" --account "$E2E_ACCOUNT" --api-wallet "$API_WALLET" \
            --deadline "$JOURNEY_DEADLINE" --work "$ROOT_PARENT/T2"
      - name: Export only fixed public evidence from root-owned custody workspace
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ROOT_WORK="/root/guard-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/T2"
          install -d -m 700 "$RUNNER_TEMP/guard-release/T2"
          FILES=()
          for FILE in assets/release-manifest.json receipt.json assets.log runtime/init.log runtime/pair.log runtime/process.log runtime/mcp.log T2.predicate.json; do
            if sudo test -f "$ROOT_WORK/$FILE" && ! sudo test -L "$ROOT_WORK/$FILE"; then
              FILES+=("$FILE")
            fi
          done
          if [ "${#FILES[@]}" -gt 0 ]; then
            # Root only reads its own fixed allowlist; the runner creates artifact files.
            sudo /usr/bin/tar -C "$ROOT_WORK" -cf - "${FILES[@]}" | tar --no-same-owner --no-same-permissions -xf - -C "$RUNNER_TEMP/guard-release/T2"
          fi
      - name: Attest passing T2 against the signed immutable manifest
        id: evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/guard-release/T2/assets/release-manifest.json
          predicate-type: https://zunderlabs.com/guard/journey/v1
          predicate-path: ${{ runner.temp }}/guard-release/T2/T2.predicate.json
      - name: Independent keyless C6 flat scan after failure
        if: ${{ failure() || cancelled() }}
        env:
          E2E_ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
        run: python -m guard_harness.failure_scan --work "$RUNNER_TEMP/guard-release/T2-failure/postfailure-flat.json"
      - name: Retain sanitized evidence on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: T2-${{ github.run_id }}-${{ github.run_attempt }}
          # Explicit files only: runtime includes credentials and must never be uploaded.
          path: |
            ${{ runner.temp }}/guard-release/T2/receipt.json
            ${{ runner.temp }}/guard-release/T2-failure/postfailure-flat.json
            ${{ runner.temp }}/guard-release/T2/assets.log
            ${{ runner.temp }}/guard-release/T2/runtime/init.log
            ${{ runner.temp }}/guard-release/T2/runtime/pair.log
            ${{ runner.temp }}/guard-release/T2/runtime/process.log
            ${{ runner.temp }}/guard-release/T2/runtime/mcp.log
            ${{ runner.temp }}/guard-release/T2/T2.predicate.json
            ${{ steps.evidence.outputs.bundle-path }}
          if-no-files-found: warn
          retention-days: 7

  purchase:
    name: ${{ matrix.journey }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: e2e
    concurrency:
      group: guard-e2e-purchase-${{ (matrix.journey == 'P1' || matrix.journey == 'P5' || matrix.journey == 'P6') && 'hyperliquid' || (matrix.journey == 'P2' || matrix.journey == 'P3') && 'evm' || matrix.journey }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix:
        journey: ${{ fromJSON(inputs.profile == 'nightly' && '["P1"]' || '["P1","P2","P3","P4","P5","P6","P7"]') }}
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
      attestations: write
    steps:
      - name: Bind the caller source before staging requests
        env:
          SOURCE: ${{ inputs.commit }}
          TAG: ${{ inputs.tag }}
          PROFILE: ${{ inputs.profile }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = zunderlabs/zunder-guard ]
          [[ $SOURCE =~ ^[0-9a-f]{40}$ && $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]
          case "$PROFILE" in
            all) [ "$SOURCE" = "$GITHUB_SHA" ] ;;
            nightly) [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ;;
            *) exit 1 ;;
          esac
          case "$GITHUB_REF" in refs/heads/main|"refs/tags/$TAG") ;; *) exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - run: npm ci --prefix deploy/guard/journeys
      - name: Verify exact release subjects before purchase API requests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/quote-evidence"
          bash deploy/guard/github/verify-release-assets.sh "$TAG" "$RUNNER_TEMP/quote-evidence/assets" \
            2>&1 | tee "$RUNNER_TEMP/quote-evidence/assets.log"
          python - <<'PY'
          import os
          from pathlib import Path
          from guard_harness.testnet_run import verified_asset
          verified_asset(Path(os.environ['RUNNER_TEMP']) / 'quote-evidence/assets', 'install.sh',
                         tag=os.environ['TAG'], commit=os.environ['SOURCE'])
          PY
      - name: Authenticate canonical admission before the nightly purchase
        if: ${{ inputs.profile == 'nightly' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
        shell: bash
        run: |
          python -m guard_harness.monitor --tag "$TAG" --commit "$SOURCE" --work "$RUNNER_TEMP/nightly-admission"
      - name: Install Chromium for the pricing and checkout browser journey
        if: ${{ contains(fromJSON('["P1","P2","P3","P5","P6"]'), matrix.journey) }}
        working-directory: deploy/guard/journeys
        run: npx playwright install --with-deps chromium
      - name: Run paid journey through browser, testnet payment, email and released licence install
        if: ${{ contains(fromJSON('["P1","P2","P3","P5","P6"]'), matrix.journey) }}
        working-directory: deploy/guard/journeys
        env:
          GUARD_PAY_TO_HYPERLIQUID: ${{ vars.E2E_PAY_TO_HYPERLIQUID }}
          GUARD_PAY_TO_ARBITRUM: ${{ vars.E2E_PAY_TO_ARBITRUM }}
          GUARD_PAY_TO_BASE: ${{ vars.E2E_PAY_TO_BASE }}
          GUARD_PAID_JOURNEY: ${{ matrix.journey }}
          GUARD_PURCHASE_WORK: ${{ runner.temp }}/quote-evidence/${{ matrix.journey }}
          GUARD_RELEASE_ASSETS: ${{ runner.temp }}/quote-evidence/assets
          GUARD_RELEASE_TAG: ${{ inputs.tag }}
          GUARD_RELEASE_COMMIT: ${{ inputs.commit }}
          GUARD_LICENSE_ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
          GUARD_STAGING_URL: ${{ vars.GUARD_STAGING_URL }}
          GUARD_INBOX_URL: ${{ vars.GUARD_INBOX_URL }}
          GUARD_EMAIL_DOMAIN: ${{ vars.GUARD_EMAIL_DOMAIN }}
          GUARD_ACCESS_CLIENT_ID: ${{ secrets.E2E_ACCESS_CLIENT_ID }}
          GUARD_ACCESS_CLIENT_SECRET: ${{ secrets.E2E_ACCESS_CLIENT_SECRET }}
          GUARD_ORDER_TOKEN: ${{ secrets.E2E_ORDER_TOKEN }}
          GUARD_INBOX_TOKEN: ${{ secrets.E2E_INBOX_TOKEN }}
          E2E_PAYER_HYPERLIQUID_TESTNET_KEY: ${{ contains(fromJSON('["P1","P5","P6"]'), matrix.journey) && secrets.E2E_PAYER_HYPERLIQUID_TESTNET_KEY || '' }}
          E2E_PAYER_BLOCKED_KEY: ${{ matrix.journey == 'P5' && secrets.E2E_PAYER_BLOCKED_KEY || '' }}
          E2E_PAYER_EVM_SEPOLIA_KEY: ${{ contains(fromJSON('["P2","P3"]'), matrix.journey) && secrets.E2E_PAYER_EVM_SEPOLIA_KEY || '' }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          GUARD_BROWSER_BOUNDARY_TEST=1 npm test -- browser-boundary.test.ts 2>&1 | tee "$RUNNER_TEMP/quote-evidence/browser-boundary.log"
          if [ "$GUARD_PAID_JOURNEY" = P5 ]; then
            GUARD_TEST_PROOF="$RUNNER_TEMP/quote-evidence/browser-proof.json" npm test -- edges.test.ts 2>&1 | tee "$RUNNER_TEMP/quote-evidence/journey.log"
          else
            GUARD_TEST_PROOF="$RUNNER_TEMP/quote-evidence/browser-proof.json" npm test -- paid.test.ts 2>&1 | tee "$RUNNER_TEMP/quote-evidence/journey.log"
          fi
      - name: Run quote-only journey against real C4 staging
        if: ${{ !contains(fromJSON('["P1","P2","P3","P5","P6"]'), matrix.journey) }}
        working-directory: deploy/guard/journeys
        env:
          JOURNEY: ${{ matrix.journey }}
          GUARD_STAGING_URL: ${{ vars.GUARD_STAGING_URL }}
          GUARD_INBOX_URL: ${{ vars.GUARD_INBOX_URL }}
          GUARD_EMAIL_DOMAIN: ${{ vars.GUARD_EMAIL_DOMAIN }}
          GUARD_ACCESS_CLIENT_ID: ${{ secrets.E2E_ACCESS_CLIENT_ID }}
          GUARD_ACCESS_CLIENT_SECRET: ${{ secrets.E2E_ACCESS_CLIENT_SECRET }}
          GUARD_ORDER_TOKEN: ${{ secrets.E2E_ORDER_TOKEN }}
          GUARD_INBOX_TOKEN: ${{ secrets.E2E_INBOX_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          [ -n "$GUARD_STAGING_URL" ]
          GUARD_TEST_PROOF="$RUNNER_TEMP/quote-evidence/browser-proof.json" npm test -- quote.test.ts --grep "$JOURNEY quote:" \
            2>&1 | tee "$RUNNER_TEMP/quote-evidence/journey.log"
      - name: Record passing purchase journey on authenticated build bytes
        if: ${{ inputs.profile == 'all' }}
        env:
          JOURNEY: ${{ matrix.journey }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
        run: |
          python -m guard_harness.purchase_evidence --work "$RUNNER_TEMP/quote-evidence" \
            --row "$JOURNEY" --tag "$TAG" --commit "$SOURCE"
      - name: Attest passing purchase journey
        if: ${{ inputs.profile == 'all' }}
        id: evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/quote-evidence/assets/release-manifest.json
          predicate-type: https://zunderlabs.com/guard/journey/v1
          predicate-path: ${{ runner.temp }}/quote-evidence/predicate.json
      - name: Retain sanitized purchase evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.journey }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/quote-evidence/assets.log
            ${{ runner.temp }}/quote-evidence/journey.log
            ${{ runner.temp }}/quote-evidence/browser-proof.json
            ${{ runner.temp }}/quote-evidence/browser-boundary.log
            ${{ runner.temp }}/quote-evidence/predicate.json
            ${{ runner.temp }}/quote-evidence/P*/payment/payment-attempt.json
            ${{ runner.temp }}/quote-evidence/P*/payment/payment-receipt.json
            ${{ runner.temp }}/quote-evidence/P*/licensed/licence-receipt.json
            ${{ steps.evidence.outputs.bundle-path }}
          if-no-files-found: warn
          retention-days: 7

  signing-subjects:
    if: ${{ inputs.profile == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.commit }}
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.13'
    - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      with:
        cosign-release: v3.1.3
    - run: |
        python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
        python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
    - name: Authenticate exact released source and manifest
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
        SOURCE: ${{ inputs.commit }}
      run: 'set -euo pipefail

        [ "$SOURCE" = "$GITHUB_SHA" ]

        [ "$GITHUB_REPOSITORY" = zunderlabs/zunder-guard ]

        case "$GITHUB_REF" in refs/heads/main|"refs/tags/$TAG") ;; *) exit 1 ;; esac

        mkdir -p "$RUNNER_TEMP/sdk"

        bash deploy/guard/github/verify-release-assets.sh "$TAG" "$RUNNER_TEMP/sdk/assets"
        > "$RUNNER_TEMP/sdk/assets.log" 2>&1

        '
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: signing-subjects-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/sdk/assets
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
  signing-contract:
    if: ${{ inputs.profile == 'all' }}
    name: SDK ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux
          runner: ubuntu-24.04
        - platform: macos
          runner: macos-15
        - platform: windows
          runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.commit }}
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.13'
    - run: |
        python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
        python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: signing-subjects-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/sdk/assets
    - run: rustup toolchain install
    - name: Run SDK vectors and native custody contracts
      if: runner.os != 'Windows'
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
        SOURCE: ${{ inputs.commit }}
      run: python -m guard_harness.signing_vectors --tag "$TAG" --commit "$SOURCE"
        --assets "$RUNNER_TEMP/sdk/assets" --output "$RUNNER_TEMP/sdk/proof"
    - name: Select the installed MSVC developer toolchain before Windows SDK tests
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
        $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'Installed MSVC toolchain not found' }
        $vcvars = Join-Path $installation 'VC/Auxiliary/Build/vcvars64.bat'
        $variables = & $env:ComSpec /d /s /c "`"$vcvars`" >nul && set"
        if ($LASTEXITCODE -ne 0) { throw 'MSVC developer environment setup failed' }
        foreach ($line in $variables) {
          $name, $value = $line -split '=', 2
          if ($name -in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCINSTALLDIR', 'VCToolsInstallDir', 'WindowsSdkDir')) {
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "$name=$value" -Encoding utf8
          }
        }
    - name: Run SDK vectors with the native Windows linker path
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
        SOURCE: ${{ inputs.commit }}
      run: |
        python -m guard_harness.signing_vectors --tag "$env:TAG" --commit "$env:SOURCE" --assets "$env:RUNNER_TEMP/sdk/assets" --output "$env:RUNNER_TEMP/sdk/proof"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      id: signing
      with:
        subject-path: ${{ runner.temp }}/sdk/assets/release-manifest.json
        predicate-type: https://zunderlabs.com/guard/signing/v1
        predicate-path: ${{ runner.temp }}/sdk/proof/signing.predicate.json
    - env:
        BUNDLE: ${{ steps.signing.outputs.bundle-path }}
        PLATFORM: ${{ matrix.platform }}
      run: cp "$BUNDLE" "$RUNNER_TEMP/sdk/signing-$PLATFORM.sigstore.json"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() }}
      with:
        name: signing-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: '${{ runner.temp }}/sdk/*.sigstore.json

          ${{ runner.temp }}/sdk/*.log

          ${{ runner.temp }}/sdk/proof/*.log'
        if-no-files-found: warn
        retention-days: 7
    needs: signing-subjects
  signing-gate:
    if: ${{ inputs.profile == 'all' }}
    name: M3
    needs:
    - signing-contract
    - testnet-foreground
    - testnet-systemd
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.commit }}
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.13'
    - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      with:
        cosign-release: v3.1.3
    - run: |
        python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
        python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
    - name: Authenticate exact released source and manifest
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
        SOURCE: ${{ inputs.commit }}
      run: 'set -euo pipefail

        [ "$SOURCE" = "$GITHUB_SHA" ]

        [ "$GITHUB_REPOSITORY" = zunderlabs/zunder-guard ]

        case "$GITHUB_REF" in refs/heads/main|"refs/tags/$TAG") ;; *) exit 1 ;; esac

        mkdir -p "$RUNNER_TEMP/M3"

        bash deploy/guard/github/verify-release-assets.sh "$TAG" "$RUNNER_TEMP/M3/assets"
        > "$RUNNER_TEMP/M3/assets.log" 2>&1

        '
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: signing-*-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/M3/evidence
        merge-multiple: true
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: T1-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/M3/T1
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: T2-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/M3/T2
    - name: Authenticate all three SDK platforms and both live testnet journeys
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
        SOURCE: ${{ inputs.commit }}
      run: "set -euo pipefail\npython - <<'PY_M3'\nimport json, os\nfrom pathlib import\
        \ Path\nroot = Path(os.environ['RUNNER_TEMP']) / 'M3'\nfor row in ('T1', 'T2'):\n\
        \    bundles = {}\n    for path in (root / row).rglob('*.json'):\n       \
        \ value = json.loads(path.read_bytes())\n        if isinstance(value, dict)\
        \ and 'dsseEnvelope' in value and 'verificationMaterial' in value:\n     \
        \       bundles[path.read_bytes()] = path\n    if len(bundles) != 1:\n   \
        \     raise SystemExit('Expected one authenticated testnet bundle')\n    (root\
        \ / 'evidence' / (row + '.sigstore.json')).write_bytes(next(iter(bundles)))\n\
        PY_M3\npython -m guard_harness.mainnet_evidence --row M3 --tag \"$TAG\" --commit\
        \ \"$SOURCE\" --assets \"$RUNNER_TEMP/M3/assets\" --evidence \"$RUNNER_TEMP/M3/evidence\"\
        \ --output \"$RUNNER_TEMP/M3/proof\"\n"
    - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      id: evidence
      with:
        subject-path: ${{ runner.temp }}/M3/assets/release-manifest.json
        predicate-type: https://zunderlabs.com/guard/journey/v1
        predicate-path: ${{ runner.temp }}/M3/proof/M3.predicate.json
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() }}
      with:
        name: M3-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/M3/assets.log

          ${{ runner.temp }}/M3/proof/*

          ${{ steps.evidence.outputs.bundle-path }}'
        if-no-files-found: warn
        retention-days: 7

  testnet-failure-alert:
    needs: [testnet-foreground, testnet-systemd]
    if: ${{ always() && inputs.profile == 'all' && (contains(fromJSON('["failure","cancelled"]'), needs.testnet-foreground.result) || contains(fromJSON('["failure","cancelled"]'), needs.testnet-systemd.result)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: monitor
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ inputs.commit }}', persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - name: Notify failed C6 journey through authenticated alert endpoint
        env:
          MONITOR_ALERT_TOKEN: ${{ secrets.MONITOR_ALERT_TOKEN }}
          RUN_URL: https://github.com/zunderlabs/zunder-guard/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: python -m guard_harness.monitor --alert --check C6.journey-failed --run-url "$RUN_URL"
