# Canonical private source; exported once to .github/workflows/journey.yml.
name: journey
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [checkout, payment]
        default: checkout
        description: Diagnostic-only checkout or payment; never release evidence
      tag: {type: string, required: false, default: ''}
      commit: {type: string, required: false, default: ''}
      previous_tag: {type: string, required: false, default: ''}
      previous_commit: {type: string, required: false, default: ''}
      payment_network: {type: choice, options: [arbitrum, base], default: arbitrum}
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      commit:
        type: string
        required: true
      profile:
        type: string
        default: all
    # Caller admission is required even for secrets stored only in e2e.
    # Optional credentials are guarded by the specific all-profile row that uses them.
    secrets:
      E2E_ACCESS_CLIENT_ID:
        required: true
      E2E_ACCESS_CLIENT_SECRET:
        required: true
      E2E_ORDER_TOKEN:
        required: true
      E2E_INBOX_TOKEN:
        required: true
      E2E_PAYER_HYPERLIQUID_TESTNET_KEY:
        required: true
      E2E_PAYER_EVM_SEPOLIA_KEY:
        required: false
      E2E_PAYER_BLOCKED_KEY:
        required: false
      E2E_TESTNET_API_WALLET_KEY:
        required: false
      E2E_TESTNET_OWNER_KEY:
        required: false
      MONITOR_ALERT_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  testnet-foreground:
    if: ${{ inputs.profile == 'all' }}
    name: T1
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: e2e
    # The admitted caller owns C6 for the whole run; T2 follows successful T1.
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
      attestations: write
    steps:
      - name: Bind the caller source before checkout or custody
        env:
          SOURCE: ${{ inputs.commit }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = zunderlabs/zunder-guard ]
          [[ $SOURCE =~ ^[0-9a-f]{40}$ && $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]
          [ "$SOURCE" = "$GITHUB_SHA" ]
          case "$GITHUB_REF" in refs/heads/main|"refs/tags/$TAG") ;; *) exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Install the release's harness
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --prefix deploy/guard/journeys
      - name: Admit exact caller whole-run C6 ownership before custody
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_REF: ${{ github.ref }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_EVENT: ${{ github.event_name }}
        shell: bash
        run: python -m guard_harness.c6_owner --callee journey.yml --profile all
      - name: Authenticate builder from the released keyless paper Guard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$RUNNER_TEMP/guard-release"
          bash deploy/guard/github/verify-release-assets.sh "$TAG" "$RUNNER_TEMP/guard-release/P8-assets" > "$RUNNER_TEMP/guard-release/P8-assets.log" 2>&1
          python -m guard_harness.builder_journey descriptor --assets "$RUNNER_TEMP/guard-release/P8-assets" --work "$RUNNER_TEMP/guard-release/P8-subject" --tag "$TAG" --commit "$SOURCE" --account "$ACCOUNT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'guard-release/P8-subject/builder-descriptor.json'
          value = json.loads(path.read_bytes())
          with Path(os.environ['GITHUB_ENV']).open('a') as output:
              output.write('GUARD_BUILDER_APPROVAL_DESCRIPTOR=' + str(path) + '\n')
              output.write('GUARD_BUILDER_APPROVAL_ADDRESS=' + value['builder'] + '\n')
          PY
      - name: Install Chromium for the staging approval page
        working-directory: deploy/guard/journeys
        run: npx playwright install --with-deps chromium
      - name: P8 browser approval with the dedicated testnet owner
        working-directory: deploy/guard/journeys
        env:
          GUARD_PAID_JOURNEY: P8
          GUARD_PURCHASE_WORK: ${{ runner.temp }}/guard-release/P8-approval
          GUARD_BROWSER_DIAGNOSTICS: ${{ runner.temp }}/guard-release/P8-click-diagnostics
          GUARD_RELEASE_COMMIT: ${{ inputs.commit }}
          GUARD_BUILDER_APPROVAL_ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
          GUARD_BUILDER_APPROVAL_OWNER_KEY: ${{ secrets.E2E_TESTNET_OWNER_KEY }}
          GUARD_STAGING_URL: ${{ vars.GUARD_STAGING_URL }}
          GUARD_ACCESS_CLIENT_ID: ${{ secrets.E2E_ACCESS_CLIENT_ID }}
          GUARD_ACCESS_CLIENT_SECRET: ${{ secrets.E2E_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          GUARD_BROWSER_BOUNDARY_TEST=1 npm test -- browser-boundary.test.ts > "$RUNNER_TEMP/guard-release/P8-boundary.log" 2>&1
          npm test -- approval.test.ts > "$RUNNER_TEMP/guard-release/P8-browser.log" 2>&1
      - name: Age out approval reads before the shared Guard and scanner budget
        run: sleep 60
      - name: Reserve cleanup against the recorded job start
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_PAGES: ${{ runner.temp }}/journey-jobs.json
          JOB_TIMEOUT_SECONDS: '7200'
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$JOB_PAGES"
          python -m guard_harness.job_deadline
      - name: Run T1 with inherited wallet stdin
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          E2E_ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
          API_WALLET: ${{ vars.E2E_TESTNET_API_WALLET_ADDRESS }}
          WALLET_INPUT: ${{ secrets.E2E_TESTNET_API_WALLET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          [ -n "$WALLET_INPUT" ]
          install -d -m 700 "$RUNNER_TEMP/guard-release"
          printf '%s\n' "$WALLET_INPUT" | env -u WALLET_INPUT python -m guard_harness.testnet_run \
            --tag "$TAG" --commit "$SOURCE" --account "$E2E_ACCOUNT" --api-wallet "$API_WALLET" \
            --deadline "$JOURNEY_DEADLINE" --work "$RUNNER_TEMP/guard-release/T1" \
            --builder-approval "$RUNNER_TEMP/guard-release/P8-approval/approval-receipt.json"
      - name: Attest passing T1 against the signed immutable manifest
        id: evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/guard-release/T1/assets/release-manifest.json
          predicate-type: https://zunderlabs.com/guard/journey/v1
          predicate-path: ${{ runner.temp }}/guard-release/T1/T1.predicate.json
      - name: Attest completed P8 including the actual Guard fee-bearing fill
        id: fee-evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/guard-release/T1/assets/release-manifest.json
          predicate-type: https://zunderlabs.com/guard/journey/v1
          predicate-path: ${{ runner.temp }}/guard-release/T1/P8.predicate.json
      - name: Retain only completed P8 proof and signed evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: P8-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/guard-release/T1/P8.fee-proof.json
            ${{ runner.temp }}/guard-release/T1/P8.predicate.json
            ${{ runner.temp }}/guard-release/P8-assets.log
            ${{ runner.temp }}/guard-release/P8-boundary.log
            ${{ runner.temp }}/guard-release/P8-browser.log
            ${{ runner.temp }}/guard-release/P8-click-diagnostics/approve-network-testnet/screenshot.png
            ${{ runner.temp }}/guard-release/P8-click-diagnostics/approve-network-testnet/page.html
            ${{ runner.temp }}/guard-release/P8-click-diagnostics/approve-network-testnet/diagnostics.json
            ${{ steps.fee-evidence.outputs.bundle-path }}
          if-no-files-found: warn
          retention-days: 7
      - name: Retain finite T1 failure evidence before cleanup scan
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: T1-early-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/guard-release/T1/receipt.json
            ${{ runner.temp }}/guard-release/T1/assets.log
            ${{ runner.temp }}/guard-release/T1/runtime/entry-attempt.json
            ${{ runner.temp }}/guard-release/T1/runtime/entry-response.json
            ${{ runner.temp }}/guard-release/T1/runtime/ownership.json
            ${{ runner.temp }}/guard-release/T1/runtime/collection-failure.json
            ${{ runner.temp }}/guard-release/T1/runtime/cleanup-responses.json
          if-no-files-found: warn
          retention-days: 7
      - name: Independent keyless C6 flat scan after failure
        if: ${{ failure() || cancelled() }}
        env:
          E2E_ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
        run: python -m guard_harness.failure_scan --work "$RUNNER_TEMP/guard-release/T1-failure/postfailure-flat.json"
      - name: Retain sanitized evidence on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: T1-${{ github.run_id }}-${{ github.run_attempt }}
          # Explicit files only: runtime includes credentials and must never be uploaded.
          path: |
            ${{ runner.temp }}/guard-release/T1/receipt.json
            ${{ runner.temp }}/guard-release/T1-failure/postfailure-flat.json
            ${{ runner.temp }}/guard-release/T1/assets.log
            ${{ runner.temp }}/guard-release/T1/runtime/init.log
            ${{ runner.temp }}/guard-release/T1/runtime/pair.log
            ${{ runner.temp }}/guard-release/T1/runtime/process.log
            ${{ runner.temp }}/guard-release/T1/runtime/mcp.log
            ${{ runner.temp }}/guard-release/T1/runtime/entry-attempt.json
            ${{ runner.temp }}/guard-release/T1/runtime/entry-response.json
            ${{ runner.temp }}/guard-release/T1/runtime/ownership.json
            ${{ runner.temp }}/guard-release/T1/runtime/collection-failure.json
            ${{ runner.temp }}/guard-release/T1/runtime/cleanup-responses.json
            ${{ runner.temp }}/guard-release/T1/T1.predicate.json
            ${{ steps.evidence.outputs.bundle-path }}
          if-no-files-found: warn
          retention-days: 7

  testnet-systemd:
    if: ${{ inputs.profile == 'all' }}
    needs: testnet-foreground
    name: T2
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: e2e
    # The admitted caller owns C6 for the whole run; T2 follows successful T1.
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
      attestations: write
    steps:
      - name: Bind the caller source before checkout or custody
        env:
          SOURCE: ${{ inputs.commit }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = zunderlabs/zunder-guard ]
          [[ $SOURCE =~ ^[0-9a-f]{40}$ && $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]
          [ "$SOURCE" = "$GITHUB_SHA" ]
          case "$GITHUB_REF" in refs/heads/main|"refs/tags/$TAG") ;; *) exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Install the release's harness
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - name: Admit exact caller whole-run C6 ownership before custody
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_REF: ${{ github.ref }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_EVENT: ${{ github.event_name }}
        shell: bash
        run: python -m guard_harness.c6_owner --callee journey.yml --profile all
      - name: Reserve cleanup against the recorded job start
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_PAGES: ${{ runner.temp }}/journey-jobs.json
          JOB_TIMEOUT_SECONDS: '7200'
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$JOB_PAGES"
          python -m guard_harness.job_deadline
      - name: Run T2 with inherited wallet stdin
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          E2E_ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
          API_WALLET: ${{ vars.E2E_TESTNET_API_WALLET_ADDRESS }}
          WALLET_INPUT: ${{ secrets.E2E_TESTNET_API_WALLET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          [ -n "$WALLET_INPUT" ]
          ROOT_PARENT="/root/guard-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sudo install -d -o root -g root -m 700 "$ROOT_PARENT"
          MARKER=$(python -c 'import secrets; print(secrets.token_hex(16))')
          printf '%s' "$MARKER" | sudo tee /etc/zunder-native-disposable >/dev/null
          sudo chmod 600 /etc/zunder-native-disposable
          printf '%s\n' "$WALLET_INPUT" | env -u WALLET_INPUT sudo --preserve-env=GH_TOKEN,PATH,GITHUB_ACTIONS,RUNNER_ENVIRONMENT \
            "$(command -v python)" -m guard_harness.testnet_run --service-marker "$MARKER" \
            --tag "$TAG" --commit "$SOURCE" --account "$E2E_ACCOUNT" --api-wallet "$API_WALLET" \
            --deadline "$JOURNEY_DEADLINE" --work "$ROOT_PARENT/T2"
      - name: Export only fixed public evidence from root-owned custody workspace
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ROOT_WORK="/root/guard-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/T2"
          install -d -m 700 "$RUNNER_TEMP/guard-release/T2"
          FILES=()
          for FILE in assets/release-manifest.json receipt.json assets.log runtime/init.log runtime/testnet-service-install.log runtime/service-stop.log runtime/service-start.log runtime/pair.log runtime/process.log runtime/mcp.log runtime/entry-attempt.json runtime/entry-response.json runtime/ownership.json runtime/collection-failure.json runtime/cleanup-responses.json runtime/linux-opt-refusal.receipt.json runtime/linux-opt-normalized.receipt.json T2.predicate.json; do
            if sudo test -f "$ROOT_WORK/$FILE" && ! sudo test -L "$ROOT_WORK/$FILE"; then
              FILES+=("$FILE")
            fi
          done
          if [ "${#FILES[@]}" -gt 0 ]; then
            # Root only reads its own fixed allowlist; the runner creates artifact files.
            sudo /usr/bin/tar -C "$ROOT_WORK" -cf - "${FILES[@]}" | tar --no-same-owner --no-same-permissions -xf - -C "$RUNNER_TEMP/guard-release/T2"
          fi
      - name: Attest passing T2 against the signed immutable manifest
        id: evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/guard-release/T2/assets/release-manifest.json
          predicate-type: https://zunderlabs.com/guard/journey/v1
          predicate-path: ${{ runner.temp }}/guard-release/T2/T2.predicate.json
      - name: Retain finite T2 failure evidence before cleanup scan
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: T2-early-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/guard-release/T2/receipt.json
            ${{ runner.temp }}/guard-release/T2/assets.log
            ${{ runner.temp }}/guard-release/T2/runtime/testnet-service-install.log
            ${{ runner.temp }}/guard-release/T2/runtime/service-stop.log
            ${{ runner.temp }}/guard-release/T2/runtime/service-start.log
            ${{ runner.temp }}/guard-release/T2/runtime/entry-attempt.json
            ${{ runner.temp }}/guard-release/T2/runtime/entry-response.json
            ${{ runner.temp }}/guard-release/T2/runtime/ownership.json
            ${{ runner.temp }}/guard-release/T2/runtime/collection-failure.json
            ${{ runner.temp }}/guard-release/T2/runtime/cleanup-responses.json
            ${{ runner.temp }}/guard-release/T2/runtime/linux-opt-refusal.receipt.json
            ${{ runner.temp }}/guard-release/T2/runtime/linux-opt-normalized.receipt.json
          if-no-files-found: warn
          retention-days: 7
      - name: Independent keyless C6 flat scan after failure
        if: ${{ failure() || cancelled() }}
        env:
          E2E_ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
        run: python -m guard_harness.failure_scan --work "$RUNNER_TEMP/guard-release/T2-failure/postfailure-flat.json"
      - name: Retain sanitized evidence on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: T2-${{ github.run_id }}-${{ github.run_attempt }}
          # Explicit files only: runtime includes credentials and must never be uploaded.
          path: |
            ${{ runner.temp }}/guard-release/T2/receipt.json
            ${{ runner.temp }}/guard-release/T2-failure/postfailure-flat.json
            ${{ runner.temp }}/guard-release/T2/assets.log
            ${{ runner.temp }}/guard-release/T2/runtime/init.log
            ${{ runner.temp }}/guard-release/T2/runtime/testnet-service-install.log
            ${{ runner.temp }}/guard-release/T2/runtime/service-stop.log
            ${{ runner.temp }}/guard-release/T2/runtime/service-start.log
            ${{ runner.temp }}/guard-release/T2/runtime/pair.log
            ${{ runner.temp }}/guard-release/T2/runtime/process.log
            ${{ runner.temp }}/guard-release/T2/runtime/mcp.log
            ${{ runner.temp }}/guard-release/T2/runtime/entry-attempt.json
            ${{ runner.temp }}/guard-release/T2/runtime/entry-response.json
            ${{ runner.temp }}/guard-release/T2/runtime/ownership.json
            ${{ runner.temp }}/guard-release/T2/runtime/collection-failure.json
            ${{ runner.temp }}/guard-release/T2/runtime/cleanup-responses.json
            ${{ runner.temp }}/guard-release/T2/runtime/linux-opt-refusal.receipt.json
            ${{ runner.temp }}/guard-release/T2/runtime/linux-opt-normalized.receipt.json
            ${{ runner.temp }}/guard-release/T2/T2.predicate.json
            ${{ steps.evidence.outputs.bundle-path }}
          if-no-files-found: warn
          retention-days: 7

  purchase:
    if: ${{ inputs.profile == 'all' || inputs.profile == 'nightly' }}
    name: ${{ matrix.journey }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: e2e
    concurrency:
      group: guard-e2e-purchase-${{ (matrix.journey == 'P1' || matrix.journey == 'P5' || matrix.journey == 'P6') && 'hyperliquid' || matrix.journey == 'P2' && 'arbitrum' || matrix.journey == 'P3' && 'base' || matrix.journey }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix:
        journey: ${{ fromJSON(inputs.profile == 'nightly' && '["P1"]' || '["P1","P2","P3","P4","P5","P6","P7"]') }}
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
      attestations: write
    steps:
      - name: Bind the caller source before staging requests
        env:
          SOURCE: ${{ inputs.commit }}
          TAG: ${{ inputs.tag }}
          PROFILE: ${{ inputs.profile }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = zunderlabs/zunder-guard ]
          [[ $SOURCE =~ ^[0-9a-f]{40}$ && $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]
          case "$PROFILE" in
            all) [ "$SOURCE" = "$GITHUB_SHA" ] ;;
            nightly) [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ;;
            *) exit 1 ;;
          esac
          case "$GITHUB_REF" in refs/heads/main|"refs/tags/$TAG") ;; *) exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
