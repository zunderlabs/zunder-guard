name: release acceptance admission
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: release-owner-admission
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: zunderlabs/zunder-guard/.github/workflows/release-acceptance-run.yml@7384f839cc7f89d9251ef504df4d17d48069c9b3
  negative:
    needs: verify
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: zunderlabs/zunder-guard/.github/workflows/release-owner-admission-negative.yml@7384f839cc7f89d9251ef504df4d17d48069c9b3
