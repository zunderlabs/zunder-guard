name: release acceptance admission
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: release-owner-admission
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: zunderlabs/zunder-guard/.github/workflows/release-acceptance-run.yml@ecb52cb131dee4ce044de5bf8a9caea3f5f21cb2
  negative:
    needs: verify
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: zunderlabs/zunder-guard/.github/workflows/release-owner-admission-negative.yml@ecb52cb131dee4ce044de5bf8a9caea3f5f21cb2
