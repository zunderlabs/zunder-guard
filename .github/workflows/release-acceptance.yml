name: release acceptance admission
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: release-owner-admission
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: zunderlabs/zunder-guard/.github/workflows/release-acceptance-run.yml@89a0746c28b25a407c4c20911ce13153f8993585
  negative:
    needs: verify
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: zunderlabs/zunder-guard/.github/workflows/release-owner-admission-negative.yml@89a0746c28b25a407c4c20911ce13153f8993585
