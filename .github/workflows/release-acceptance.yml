name: release acceptance admission
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: release-owner-admission
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: zunderlabs/zunder-guard/.github/workflows/release-acceptance-run.yml@c49843c953a1bd8ebe714c0258cf3bf4f951778f
  negative:
    needs: verify
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: zunderlabs/zunder-guard/.github/workflows/release-owner-admission-negative.yml@c49843c953a1bd8ebe714c0258cf3bf4f951778f
