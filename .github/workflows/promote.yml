# Stable only. Full cryptographic C2 admission precedes every canonical mutation.
name: promote
on:
  workflow_call:
    secrets:
      HOMEBREW_APP_PRIVATE_KEY:
        description: Environment-scoped tap publisher credential
        required: true
      INSTALLER_PUBLISH_TOKEN:
        description: Environment-scoped canonical capsule publisher credential
        required: true
    inputs:
      tag: {type: string, required: true}
      commit: {type: string, required: true}
      run_id: {type: string, required: true}
      attempt: {type: string, required: true}
      mode: {type: string, default: promote}
      source_run: {type: string, default: ''}
      source_attempt: {type: string, default: ''}
  workflow_dispatch:
    inputs:
      tag: {type: string, required: true}
      commit: {type: string, required: true}
      run_id: {type: string, required: true}
      attempt: {type: string, required: true}
      mode:
        type: choice
        options: [promote, rollback]
        default: promote
      source_run:
        description: Original promotion workflow run ID (rollback only)
        type: string
        default: ''
      source_attempt:
        description: Original promotion attempt (rollback only)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: guard-release-promotion
  cancel-in-progress: false
  queue: max
jobs:
  promote:
    if: ${{ inputs.mode == 'promote' }}
    concurrency:
      group: guard-release-channel-mutation
      cancel-in-progress: false
      queue: max
    outputs:
      # The attempt this job ran in. A failed-jobs rerun keeps a passed promote job's
      # earlier attempt, so its artifacts are named by this, never by a consumer's own attempt.
      attempt: ${{ steps.attempt.outputs.attempt }}
      manifest_sha256: ${{ steps.admission.outputs.manifest_sha256 }}
      mutation_attempted: ${{ steps.publication.outcome != '' && steps.publication.outcome != 'skipped' }}
    name: Authenticate complete gate and promote stable channels
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: promote
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Bind stable promotion to the exact released workflow source
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          VERIFY_RUN: ${{ inputs.run_id }}
          VERIFY_ATTEMPT: ${{ inputs.attempt }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = zunderlabs/zunder-guard ]
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && $SOURCE =~ ^[0-9a-f]{40}$ ]]
          [[ $VERIFY_RUN =~ ^[1-9][0-9]*$ && $VERIFY_ATTEMPT =~ ^[1-9][0-9]*$ ]]
          [ "$GITHUB_SHA" = "$SOURCE" ]
          case "$GITHUB_REF" in refs/heads/main|"refs/tags/$TAG") ;; *) exit 1 ;; esac
      - name: Record this job's attempt before anything can fail
        id: attempt
        shell: bash
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ inputs.commit }}', persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: v3.1.3}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          path: ${{ runner.temp }}/promotion-evidence
      - name: Authenticate staged and gated revisions, every journey, and prior channel identities
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          VERIFY_RUN: ${{ inputs.run_id }}
          VERIFY_ATTEMPT: ${{ inputs.attempt }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          python -m guard_harness.promotion --phase prepare --tag "$TAG" --commit "$SOURCE" \
            --run-id "$VERIFY_RUN" --attempt "$VERIFY_ATTEMPT" \
            --evidence "$RUNNER_TEMP/promotion-evidence" --work "$RUNNER_TEMP/promotion"
      - name: Sign immutable rollback snapshot before any channel mutation
        id: snapshot
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/promotion/rollback-snapshot.json
          predicate-type: https://zunderlabs.com/guard/promotion-snapshot/v1
          predicate-path: ${{ runner.temp }}/promotion/rollback-snapshot.json
      - name: Retain original snapshot attestation before minting channel credentials
        shell: bash
        env:
          SNAPSHOT_BUNDLE: ${{ steps.snapshot.outputs.bundle-path }}
        run: cp "$SNAPSHOT_BUNDLE" "$RUNNER_TEMP/promotion/rollback-snapshot.sigstore.json"
      - name: Persist signed recovery inputs before credentials or channel mutations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain Ubuntu-authenticated exact-run canonical subjects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-subjects-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion/candidate/assets
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Mint a short-lived token scoped only to the Homebrew tap
        id: tap
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: zunderlabs
          repositories: homebrew-tap
          permission-contents: write
          skip-token-revoke: false
      - name: Sign promoted revision 3 on the original immutable build manifest
        id: promoted
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/promotion/candidate/assets/release-manifest.json
          predicate-type: https://zunderlabs.com/guard/release-state/v1
          predicate-path: ${{ runner.temp }}/promotion/promoted.predicate.json
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish signed canonical capsule then promote tap, image and GitHub latest
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap.outputs.token }}
          INSTALLER_PUBLISH_TOKEN: ${{ secrets.INSTALLER_PUBLISH_TOKEN }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          VERIFY_RUN: ${{ inputs.run_id }}
          VERIFY_ATTEMPT: ${{ inputs.attempt }}
          BUNDLE: ${{ steps.promoted.outputs.bundle-path }}
          SNAPSHOT_BUNDLE: ${{ steps.snapshot.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          python -m guard_harness.promotion --phase publish --tag "$TAG" --commit "$SOURCE" \
            --run-id "$VERIFY_RUN" --attempt "$VERIFY_ATTEMPT" --bundle "$BUNDLE" --snapshot-bundle "$SNAPSHOT_BUNDLE" \
            --evidence "$RUNNER_TEMP/promotion-evidence" --work "$RUNNER_TEMP/promotion"
      - name: Retain transaction identities, immutable bytes and sanitized diagnostics even on partial failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-transaction-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  canonical-smoke:
    name: Fresh canonical ${{ matrix.channel }} on ${{ matrix.runner }} ${{ matrix.shell }}
    needs: promote
    if: ${{ inputs.mode == 'promote' }}
    environment: e2e
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {channel: D1, runner: ubuntu-24.04, shell: sh}
          - {channel: D1, runner: macos-15, shell: sh}
          - {channel: D2, runner: windows-2025, shell: powershell.exe}
          - {channel: D2, runner: windows-2025, shell: pwsh.exe}
          - {channel: D3, runner: macos-15, shell: sh}
          - {channel: D4, runner: ubuntu-24.04, shell: sh}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ inputs.commit }}', persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          path: ${{ runner.temp }}/promotion-evidence
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # The promote job's own attempt: it may precede this rerun job's attempt.
          name: canonical-subjects-${{ github.run_id }}-${{ needs.promote.outputs.attempt }}
          path: ${{ runner.temp }}/canonical-subjects
      - name: Install actual canonical channel and observe paper allow, resize and veto
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_PAPER_ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          VERIFY_RUN: ${{ inputs.run_id }}
          VERIFY_ATTEMPT: ${{ inputs.attempt }}
          MANIFEST_SHA256: ${{ needs.promote.outputs.manifest_sha256 }}
          CHANNEL: ${{ matrix.channel }}
          NATIVE_SHELL: ${{ matrix.shell }}
        run: |
          set -euo pipefail
          umask 077
          python -m guard_harness.promotion_smoke --tag "$TAG" --commit "$SOURCE" \
            --run-id "$VERIFY_RUN" --attempt "$VERIFY_ATTEMPT" --channel "$CHANNEL" --shell "$NATIVE_SHELL" \
            --assets "$RUNNER_TEMP/canonical-subjects" --manifest-sha256 "$MANIFEST_SHA256" \
            --evidence "$RUNNER_TEMP/promotion-evidence" --work "$RUNNER_TEMP/canonical-smoke"
      - name: Retain canonical install and service diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-${{ matrix.channel }}-${{ matrix.runner }}-${{ matrix.shell }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canonical-smoke/public
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  rollback:
    name: Withdraw failed promotion and restore captured prior channels
    needs: [promote, canonical-smoke]
    if: ${{ always() && (inputs.mode == 'rollback' || (needs.promote.outputs.mutation_attempted != 'false' && (needs.promote.result != 'success' || needs.canonical-smoke.result != 'success'))) }}
    concurrency:
      group: guard-release-channel-mutation
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: promote
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
      attestations: write
    env:
      # The original promotion this recovery binds. Rollback mode takes exactly the dispatched
      # run and attempt. Automatic recovery takes the promote job's own attempt, which a
      # failed-jobs rerun can leave below this job's; it falls back to this attempt only when
      # promote recorded no outputs (its runner was lost), and such a job never passed, so it
      # ran in this attempt. The recovery signature binds the exact attempt either way.
      SOURCE_RUN: ${{ inputs.mode == 'rollback' && inputs.source_run || github.run_id }}
      SOURCE_ATTEMPT: ${{ inputs.mode == 'rollback' && inputs.source_attempt || needs.promote.outputs.attempt || github.run_attempt }}
    steps:
      - name: Bind recovery to original stable source and exact artifact invocation
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          MODE: ${{ inputs.mode }}
          SOURCE_RUN_INPUT: ${{ inputs.source_run }}
          SOURCE_ATTEMPT_INPUT: ${{ inputs.source_attempt }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = zunderlabs/zunder-guard ]
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && $SOURCE =~ ^[0-9a-f]{40}$ ]]
          [[ $SOURCE_RUN =~ ^[1-9][0-9]*$ && $SOURCE_ATTEMPT =~ ^[1-9][0-9]*$ ]]
          [ "$MODE" = promote ] || [ "$MODE" = rollback ]
          if [ "$MODE" = rollback ]; then
            [[ $SOURCE_RUN_INPUT =~ ^[1-9][0-9]*$ && $SOURCE_ATTEMPT_INPUT =~ ^[1-9][0-9]*$ ]]
            [ "$SOURCE_RUN" = "$SOURCE_RUN_INPUT" ] && [ "$SOURCE_ATTEMPT" = "$SOURCE_ATTEMPT_INPUT" ]
          else
            [ "$SOURCE_RUN" = "$GITHUB_RUN_ID" ] && [ "$SOURCE_ATTEMPT" -le "$GITHUB_RUN_ATTEMPT" ]
          fi
          [ "$GITHUB_SHA" = "$SOURCE" ]
          case "$GITHUB_REF" in refs/heads/main|"refs/tags/$TAG") ;; *) exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ inputs.commit }}', persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: v3.1.3}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: promotion-recovery-${{ env.SOURCE_RUN }}-${{ env.SOURCE_ATTEMPT }}
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          path: ${{ runner.temp }}/promotion
      - name: Mint fresh short-lived tap-only rollback token
        id: tap
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: zunderlabs
          repositories: homebrew-tap
          permission-contents: write
          skip-token-revoke: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Restore owned channels before gate reads or withdrawal signing
        id: channels
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap.outputs.token }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          VERIFY_RUN: ${{ inputs.run_id }}
          VERIFY_ATTEMPT: ${{ inputs.attempt }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          python -m guard_harness.promotion --phase channels-rollback --tag "$TAG" --commit "$SOURCE" \
            --run-id "$VERIFY_RUN" --attempt "$VERIFY_ATTEMPT" --source-run "$SOURCE_RUN" --source-attempt "$SOURCE_ATTEMPT" \
            --evidence "$RUNNER_TEMP/promotion-evidence" --work "$RUNNER_TEMP/promotion"
      - name: Obtain optional late promotion proof without replacing the signed baseline
        id: late
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: promotion-transaction-${{ env.SOURCE_RUN }}-${{ env.SOURCE_ATTEMPT }}
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          path: ${{ runner.temp }}/promotion-late
      - name: Retain original promoted attestation only
        if: steps.late.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/promotion-late/promoted.sigstore.json"
          if [ -f "$source" ] && [ ! -L "$source" ]; then
            cp "$source" "$RUNNER_TEMP/promotion/promoted.sigstore.json"
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          path: ${{ runner.temp }}/promotion-evidence
      - name: Reconcile canonical head and independently authenticate withdrawal predecessor
        id: needed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          VERIFY_RUN: ${{ inputs.run_id }}
          VERIFY_ATTEMPT: ${{ inputs.attempt }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -m guard_harness.promotion --phase withdraw --tag "$TAG" --commit "$SOURCE" \
            --run-id "$VERIFY_RUN" --attempt "$VERIFY_ATTEMPT" --source-run "$SOURCE_RUN" --source-attempt "$SOURCE_ATTEMPT" \
            --evidence "$RUNNER_TEMP/promotion-evidence" --work "$RUNNER_TEMP/promotion"
      - name: Sign withdrawal revision 4 without rewriting any release asset
        if: steps.needed.outputs.rollback_needed == 'true'
        id: withdrawn
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/promotion/candidate/assets/release-manifest.json
          predicate-type: https://zunderlabs.com/guard/release-state/v1
          predicate-path: ${{ runner.temp }}/promotion/withdrawn.predicate.json
      - name: Restore independent channels, publish withdrawal and restore the exact prior canonical capsule
        if: steps.needed.outputs.rollback_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap.outputs.token }}
          INSTALLER_PUBLISH_TOKEN: ${{ secrets.INSTALLER_PUBLISH_TOKEN }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          VERIFY_RUN: ${{ inputs.run_id }}
          VERIFY_ATTEMPT: ${{ inputs.attempt }}
          BUNDLE: ${{ steps.withdrawn.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          python -m guard_harness.promotion --phase rollback --tag "$TAG" --commit "$SOURCE" \
            --run-id "$VERIFY_RUN" --attempt "$VERIFY_ATTEMPT" --source-run "$SOURCE_RUN" --source-attempt "$SOURCE_ATTEMPT" --bundle "$BUNDLE" \
            --evidence "$RUNNER_TEMP/promotion-evidence" --work "$RUNNER_TEMP/promotion"
      - name: Require every independent channel restoration
        if: ${{ always() && steps.channels.outcome != 'success' }}
        run: exit 1
      - name: Retain signed withdrawal and every rollback outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
