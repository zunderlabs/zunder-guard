name: immutable-release-e2e-run
on:
  workflow_call:
permissions: {}
jobs:
  testnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    environment: release-testnet-e2e
    env:
      E2E_PRIVATE_ROOT: /tmp/zunder-release-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      policy_sha: ${{ steps.policy.outputs.sha }}
    permissions:
      contents: read
      packages: read
      actions: read
      id-token: write
    steps:
      - name: Resolve this immutable reusable workflow from GitHub's authenticated OIDC response
        id: policy
        run: |
          python3 - <<'PY'
          import base64, json, os, re
          from urllib.parse import urlsplit
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise RuntimeError('OIDC redirect refused')
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=zunder-policy-bootstrap'
          assert urlsplit(url).scheme == 'https'
          req = Request(url, headers={'Authorization': 'bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with build_opener(NoRedirect()).open(req, timeout=30) as r:
              assert r.status == 200
              raw = r.read(65537)
          assert len(raw) <= 65536
          token = json.loads(raw)['value']
          payload = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          sha = claims['job_workflow_sha']
          assert re.fullmatch('[0-9a-f]{40}', sha)
          assert claims['job_workflow_ref'] == 'zunderlabs/zunder-guard/.github/workflows/release-e2e-run.yml@' + sha
          assert claims['repository_id'] == '1409357189' and claims['repository_owner_id'] == '338317604'
          assert claims['repository'] == 'zunderlabs/zunder-guard' and claims['ref'] == 'refs/heads/main'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('sha=' + sha + '\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.policy.outputs.sha }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6
      - name: Stage trusted verification tools and temporary registry authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          mkdir "$RUNNER_TEMP/zunder-tools" "$RUNNER_TEMP/zunder-registry"
          cp "$(command -v cosign)" "$RUNNER_TEMP/zunder-tools/cosign"
          cp "$(command -v slsa-verifier)" "$RUNNER_TEMP/zunder-tools/slsa-verifier"
          printf '%s' "$GH_TOKEN" | docker --config "$RUNNER_TEMP/zunder-registry" login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Admit trusted trigger and verify every signed release subject
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/zunder-registry
          CONTROL_POLICY_COMMIT: ${{ steps.policy.outputs.sha }}
        run: python3 -B deploy/guard/e2e/orchestrator.py verify
      - name: Remove registry authentication before testnet key access
        run: docker --config "$RUNNER_TEMP/zunder-registry" logout ghcr.io
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: arn:aws:iam::436632189317:role/ZunderReleaseTestnetE2E
          aws-region: eu-central-1
          role-duration-seconds: 7200
          role-session-name: release-e2e-${{ github.run_id }}
          allowed-account-ids: '436632189317'
          unset-current-credentials: true
      - name: Run actual signed testnet journey with private stdin key
        env:
          AWS_CONFIG_FILE: ${{ env.E2E_PRIVATE_ROOT }}/aws-config
          CONTROL_POLICY_COMMIT: ${{ steps.policy.outputs.sha }}
        run: |
          umask 077
          printf '[default]\ncli_history = disabled\n' > "$AWS_CONFIG_FILE"
          python3 -B deploy/guard/e2e/orchestrator.py execute
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-testnet-evidence
          path: ${{ env.E2E_PRIVATE_ROOT }}/public/testnet-evidence.json
          if-no-files-found: error
          retention-days: 90
  attest:
    needs: testnet
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: signed-testnet-evidence
          path: evidence
      - name: Refuse incomplete or broader claims
        env:
          CONTROL_POLICY_COMMIT: ${{ needs.testnet.outputs.policy_sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path('evidence/testnet-evidence.json').read_text())
          assert p['kind'] == 'machine-signed-testnet-journey'
          assert p['journey_passed'] is True and p['runner_restored'] is True
          assert p['mainnet_actions'] is False and p['release_ready'] is False
          assert p['policy_commit'] == os.environ['CONTROL_POLICY_COMMIT']
          PY
      - uses: actions/attest@7d8b1cacecb65f487779b3b98fd5296a018d1a1b
        with:
          subject-path: evidence/testnet-evidence.json
          predicate-type: https://zunderlabs.com/attestations/release-testnet/v1
          predicate-path: evidence/testnet-evidence.json
          show-summary: true
