  mainnet-setup:
    if: ${{ (inputs.profile != 'nightly') && (inputs.target == 'all' || inputs.target == 'mainnet-setup') }}
    needs: subjects
    environment: e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, variant: linux, target: linux-amd64}
          - {os: windows-2022, variant: windows, target: windows-amd64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: install-matrix-subjects, path: '${{ runner.temp }}/subjects'}
      - shell: bash
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - name: Actual released-byte no-key mainnet setup refusals
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          DIAGNOSTIC: ${{ inputs.diagnostic }}
          TARGET: ${{ matrix.target }}
          ACCOUNT: ${{ vars.E2E_PAPER_ACCOUNT }}
          ATTACK_ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
        run: |
          set -euo pipefail
          umask 077
          if [ "$DIAGNOSTIC" != true ]; then [ "$GITHUB_SHA" = "$SOURCE" ]; fi
          python - <<'PY'
          import json, os, pathlib
          from guard_harness.mainnet_refusals import execute
          from guard_harness.native_release import Release
          from guard_harness.testnet_run import ROOT
          base=pathlib.Path(os.environ['RUNNER_TEMP'])
          release=Release(os.environ['TAG'],os.environ['SOURCE'],base/'subjects/candidate/assets')
          binary=base/('refusal-subject.exe' if os.environ['TARGET']=='windows-amd64' else 'refusal-subject')
          binary.write_bytes(release.binary(os.environ['TARGET']))
          binary.chmod(0o700)
          rules=json.loads((ROOT/'rules/vectors.json').read_bytes())['valid'][0]['canonical']
          try:
              execute(release,binary,account=os.environ['ACCOUNT'],rules=rules,work=base/'refusals/M2',harness_commit=os.environ['GITHUB_SHA'],diagnostic=os.environ['DIAGNOSTIC']=='true')
              if os.environ['TARGET']=='linux-amd64':
                  from guard_harness.mainnet_attack import execute as attacks, containers
                  attacks(release,binary,account=os.environ['ATTACK_ACCOUNT'],account_network='testnet',rules=rules,work=base/'attack-refusals')
                  from guard_harness.runner import run
                  manifest=json.loads(release.asset('release-manifest.json'))
                  image=manifest['distribution']['docker']['image']+'@'+manifest['distribution']['docker']['digest']
                  run(['docker','pull',image],log=base/'image-pull.log',timeout=300,sensitive_output=True,stdin=b'')
                  containers(release,image=image,home=base/'attack-refusals/attack-home',work=base/'container-refusals',account=os.environ['ATTACK_ACCOUNT'])
          finally:
              import shutil
              target=base/'mainnet-cases/M2'
              target.mkdir(parents=True,exist_ok=True)
              for directory in (base/'refusals/M2',base/'attack-refusals/M2',base/'container-refusals/M2'):
                  for source in directory.glob('*'):
                      if source.is_file() and source.suffix in ('.json','.log'):
                          if (target/source.name).exists(): raise SystemExit('ambiguous M2 case')
                          shutil.copyfile(source,target/source.name)
              descriptor=base/'attack-refusals/attack-fixture.json'
              if descriptor.exists(): shutil.copyfile(descriptor,target/descriptor.name)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mainnet-setup-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/mainnet-cases/M2/*.json
            ${{ runner.temp }}/mainnet-cases/M2/*.log
          if-no-files-found: error
          retention-days: 14
  mainnet-admission:
    if: ${{ always() && !inputs.diagnostic && inputs.profile != 'nightly' && needs.subjects.result == 'success' && needs.native.result == 'success' && needs.docker.result == 'success' && needs.mainnet-setup.result == 'success' && needs.native-mainnet.result == 'success' && needs.linux-mainnet.result == 'success' && needs.aws-stack.result == 'success' }}
    needs: [subjects, native, docker, mainnet-setup, native-mainnet, linux-mainnet, aws-stack]
    strategy:
      fail-fast: false
      matrix: {row: [M1, M2]}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: install-matrix-subjects, path: '${{ runner.temp }}/subjects'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.row == 'M2'
        with: {pattern: 'mainnet-setup-*', merge-multiple: true, path: '${{ runner.temp }}/observations/M2'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.row == 'M2'
        with: {name: install-matrix-macos-upgrade, path: '${{ runner.temp }}/macos'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.row == 'M1'
        with: {pattern: 'install-matrix-M1-*', path: '${{ runner.temp }}/M1-routes'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.row == 'M1'
        with: {name: 'I7-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/aws'}
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - name: Fail closed unless every platform observation completed
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          ROW: ${{ matrix.row }}
        run: |
          set -euo pipefail
          [ "$GITHUB_SHA" = "$SOURCE" ]
          python - <<'PY'
          import os, pathlib, shutil
          base=pathlib.Path(os.environ['RUNNER_TEMP'])
          row=os.environ['ROW']
          target=base/'observations'/row
          target.mkdir(parents=True,exist_ok=True)
          sources=((base/'macos').glob('**/mainnet/M2/*') if row=='M2' else
                   list((base/'M1-routes').rglob('*')) + list((base/'aws').glob('**/mainnet/M1/*')))
          for source in sources:
              if source.is_file() and source.suffix in ('.json','.log'):
                  destination=target/source.name
                  if destination.exists(): raise SystemExit('ambiguous platform observations')
                  shutil.copyfile(source,destination)
          PY
          python -m guard_harness.mainnet_evidence --row "$ROW" --tag "$TAG" --commit "$SOURCE" --assets "$RUNNER_TEMP/subjects/candidate/assets" --evidence "$RUNNER_TEMP/observations" --output "$RUNNER_TEMP/$ROW"
      - id: evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/subjects/candidate/assets/release-manifest.json
          predicate-type: https://zunderlabs.com/guard/journey/v1
          predicate-path: ${{ runner.temp }}/${{ matrix.row }}/${{ matrix.row }}.predicate.json
      - shell: bash
        env:
          BUNDLE: ${{ steps.evidence.outputs.bundle-path }}
          ROW: ${{ matrix.row }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/$ROW/$ROW.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: {name: '${{ matrix.row }}-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/${{ matrix.row }}', if-no-files-found: warn}
