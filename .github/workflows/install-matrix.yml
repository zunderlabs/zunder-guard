name: install-matrix
on:
  workflow_call:
    secrets:
      E2E_TESTNET_API_WALLET_KEY:
        description: Environment-scoped key, needed only by the protected testnet service row
        required: false
    inputs:
      tag: {type: string, required: true}
      commit: {type: string, required: true}
      previous_tag: {type: string, required: true}
      previous_commit: {type: string, required: true}
      diagnostic: {type: boolean, default: false}
      profile: {type: string, default: all}
      target: {type: string, default: all}
      scenario: {type: string, default: all}
  workflow_dispatch:
    inputs:
      tag: {type: string, required: true}
      commit: {type: string, required: true}
      previous_tag: {type: string, required: true}
      previous_commit: {type: string, required: true}
      diagnostic: {type: boolean, default: true}
      profile: {type: choice, options: [all, nightly], default: all}
      target: {type: choice, options: [all, linux-amd64, linux-arm64, linux-container, native, docker, aws-stack, linux-mainnet, native-mainnet, mainnet-setup], default: all}
      scenario: {type: choice, options: [all, fresh, upgrade], default: all}
permissions:
  contents: read
env:
  INSTALL_MATRIX_PROFILE: ${{ inputs.profile }}
  INSTALL_MATRIX_TARGET: ${{ inputs.target }}
  INSTALL_MATRIX_SCENARIO: ${{ inputs.scenario }}
jobs:
  subjects:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: v3.1.3}
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - name: Authenticate original candidate and predecessor bytes
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          PREVIOUS_SOURCE: ${{ inputs.previous_commit }}
          DIAGNOSTIC: ${{ inputs.diagnostic }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          [ "$GITHUB_REPOSITORY" = zunderlabs/zunder-guard ]
          [ "$INSTALL_MATRIX_PROFILE" = all ] || [ "$INSTALL_MATRIX_PROFILE" = nightly ]
          case "$INSTALL_MATRIX_TARGET" in all|linux-amd64|linux-arm64|linux-container|native|docker|aws-stack|linux-mainnet|native-mainnet|mainnet-setup) ;; *) exit 1 ;; esac
          case "$INSTALL_MATRIX_SCENARIO" in all|fresh|upgrade) ;; *) exit 1 ;; esac
          if [ "$INSTALL_MATRIX_TARGET" != all ] || [ "$INSTALL_MATRIX_SCENARIO" != all ]; then
            [ "$DIAGNOSTIC" = true ] || exit 1
            [ "$INSTALL_MATRIX_PROFILE" = all ] || exit 1
          fi
          if [ "$DIAGNOSTIC" != true ] && [ "$INSTALL_MATRIX_PROFILE" = all ]; then [ "$GITHUB_SHA" = "$SOURCE" ]; fi
          CHANNEL=staging
          if [ "$INSTALL_MATRIX_PROFILE" = nightly ]; then CHANNEL=canonical; fi
          install -d -m 700 "$RUNNER_TEMP/matrix"
          python -m guard_harness.native_release --tag "$TAG" --commit "$SOURCE" --previous-tag "$PREVIOUS_TAG" --previous-commit "$PREVIOUS_SOURCE" --work "$RUNNER_TEMP/matrix/subjects" --loader-channel "$CHANNEL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: install-matrix-subjects
          path: ${{ runner.temp }}/matrix/subjects
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  linux-amd64:
    if: ${{ (inputs.target == 'all' || inputs.target == 'linux-amd64') }}
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.scenario == 'fresh' && '["fresh"]' || inputs.scenario == 'upgrade' && '["upgrade"]' || '["fresh","upgrade"]') }}
    concurrency:
      group: guard-e2e-testnet
      cancel-in-progress: false
      queue: max
    needs: subjects
    environment: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: install-matrix-subjects, path: '${{ runner.temp }}/subjects'}
      - run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils
          sudo chmod 666 /dev/kvm
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - name: I1 authenticated paper and protected Testnet lifecycle
        shell: bash
        env:
          DIAGNOSTIC: ${{ inputs.diagnostic }}
          ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
          PAPER_ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
          WALLET_FRAME: ${{ secrets.E2E_TESTNET_API_WALLET_KEY }}
          GUARD_C6_SERIALIZED: '1'
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          umask 077
          python -m guard_harness.install_run --row I1 --scenario "$SCENARIO" --subjects "$RUNNER_TEMP/subjects" --account "$ACCOUNT" --paper-account "$PAPER_ACCOUNT" --output "$RUNNER_TEMP/I1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: {name: 'install-matrix-I1-${{ matrix.scenario }}', path: '${{ runner.temp }}/I1', if-no-files-found: error}
  linux-container:
    if: ${{ inputs.target == 'all' || inputs.target == 'linux-container' }}
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.scenario == 'fresh' && '["fresh"]' || inputs.scenario == 'upgrade' && '["upgrade"]' || '["fresh","upgrade"]') }}
    concurrency:
      group: guard-e2e-testnet
      cancel-in-progress: false
      queue: max
    needs: subjects
    environment: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: install-matrix-subjects, path: '${{ runner.temp }}/subjects'}
      - run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils
          sudo chmod 666 /dev/kvm
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - name: I6 authenticated paper and protected Testnet lifecycle
        shell: bash
        env:
          DIAGNOSTIC: ${{ inputs.diagnostic }}
          ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
          PAPER_ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
          WALLET_FRAME: ${{ secrets.E2E_TESTNET_API_WALLET_KEY }}
          GUARD_C6_SERIALIZED: '1'
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          umask 077
          python -m guard_harness.install_run --row I6 --scenario "$SCENARIO" --subjects "$RUNNER_TEMP/subjects" --account "$ACCOUNT" --paper-account "$PAPER_ACCOUNT" --output "$RUNNER_TEMP/I6"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: {name: 'install-matrix-I6-${{ matrix.scenario }}', path: '${{ runner.temp }}/I6', if-no-files-found: error}
  linux-arm64:
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.scenario == 'fresh' && '["fresh"]' || inputs.scenario == 'upgrade' && '["upgrade"]' || '["fresh","upgrade"]') }}
    concurrency:
      group: guard-e2e-testnet
      cancel-in-progress: false
      queue: max
    if: ${{ inputs.profile != 'nightly' && (inputs.target == 'all' || inputs.target == 'linux-arm64') }}
    needs: subjects
    environment: e2e
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: install-matrix-subjects, path: '${{ runner.temp }}/subjects'}
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - name: I2 authenticated paper and protected Testnet lifecycle
        shell: bash
        env:
          DIAGNOSTIC: ${{ inputs.diagnostic }}
          ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
          PAPER_ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
          WALLET_FRAME: ${{ secrets.E2E_TESTNET_API_WALLET_KEY }}
          GUARD_C6_SERIALIZED: '1'
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          umask 077
          python -m guard_harness.install_run --row I2 --scenario "$SCENARIO" --subjects "$RUNNER_TEMP/subjects" --account "$ACCOUNT" --paper-account "$PAPER_ACCOUNT" --output "$RUNNER_TEMP/I2"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: {name: 'install-matrix-I2-${{ matrix.scenario }}', path: '${{ runner.temp }}/I2', if-no-files-found: error}
  native:
    if: ${{ (inputs.target == 'all' || inputs.target == 'native') }}
    needs: subjects
    environment: e2e
    concurrency:
      group: guard-e2e-testnet
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix:
        variant: [macos, windows2022-ps51, windows2022-ps7, windows2025-ps51, windows2025-ps7]
        scenario: ${{ fromJSON(inputs.scenario == 'fresh' && '["fresh"]' || inputs.scenario == 'upgrade' && '["upgrade"]' || '["fresh","upgrade"]') }}
        include:
          - {os: macos-15, shell: sh, row: I3, variant: macos}
          - {os: windows-2022, shell: powershell.exe, row: I4, variant: windows2022-ps51}
          - {os: windows-2022, shell: pwsh.exe, row: I4, variant: windows2022-ps7}
          - {os: windows-2025, shell: powershell.exe, row: I4, variant: windows2025-ps51}
          - {os: windows-2025, shell: pwsh.exe, row: I4, variant: windows2025-ps7}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.scenario == 'fresh' && 180 || 240 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: install-matrix-subjects, path: '${{ runner.temp }}/subjects'}
      - name: Install harness
        shell: bash
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - name: Released-byte paper and read-only native testnet lifecycles
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          PREVIOUS_SOURCE: ${{ inputs.previous_commit }}
          ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
          WALLET_FRAME: ${{ secrets.E2E_TESTNET_API_WALLET_KEY }}
          NATIVE_SHELL: ${{ matrix.shell }}
          DIAGNOSTIC: ${{ inputs.diagnostic }}
          GUARD_C6_SERIALIZED: '1'
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          python -m guard_harness.native_run --subjects "$RUNNER_TEMP/subjects" --output "$RUNNER_TEMP/native-evidence" --scenario "$SCENARIO" --account "$ACCOUNT" --shell "$NATIVE_SHELL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: install-matrix-${{ matrix.variant }}-${{ matrix.scenario }}
          path: |
            ${{ runner.temp }}/native-evidence/identities.json
            ${{ runner.temp }}/native-evidence/**/*.receipt.json
            ${{ runner.temp }}/native-evidence/**/receipt.json
            ${{ runner.temp }}/native-evidence/**/*.log
            ${{ runner.temp }}/native-evidence/**/mainnet/M2/*.json
            ${{ runner.temp }}/native-evidence/channels/*.json
          if-no-files-found: error
          retention-days: 14
  docker:
    if: ${{ (inputs.target == 'all' || inputs.target == 'docker') }}
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.scenario == 'fresh' && '["fresh"]' || inputs.scenario == 'upgrade' && '["upgrade"]' || '["fresh","upgrade"]') }}
        channel: [docker, compose]
    concurrency:
      group: guard-e2e-testnet
      cancel-in-progress: false
      queue: max
    needs: subjects
    environment: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.scenario == 'fresh' && 240 || 300 }}
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: v3.1.3}
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - name: I5 signed digest Docker and Compose paper and Testnet lifecycle
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          PREVIOUS_SOURCE: ${{ inputs.previous_commit }}
          ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
          API_WALLET: ${{ vars.E2E_TESTNET_API_WALLET_ADDRESS }}
          WALLET_FRAME: ${{ secrets.E2E_TESTNET_API_WALLET_KEY }}
          GUARD_C6_SERIALIZED: '1'
          GH_TOKEN: ${{ github.token }}
          SCENARIO: ${{ matrix.scenario }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/I5-private"
          python - <<'PY'
          import os, pathlib, subprocess, sys
          key = os.environ.pop('WALLET_FRAME').strip().encode()+b'\n'
          common = ['--tag', os.environ['TAG'], '--commit', os.environ['SOURCE'], '--previous-tag', os.environ['PREVIOUS_TAG'], '--previous-commit', os.environ['PREVIOUS_SOURCE'], '--account', os.environ['ACCOUNT'], '--testnet-account', os.environ['ACCOUNT'], '--api-wallet', os.environ['API_WALLET'], '--testnet-key-stdin', '--scenario', os.environ['SCENARIO'], '--channel', os.environ['CHANNEL'], '--work', str(pathlib.Path(os.environ['RUNNER_TEMP'])/'I5-private/I5')]
          try:
              subprocess.run([sys.executable, '-m', 'guard_harness.docker_run', *common], input=key, check=True)
          except (subprocess.SubprocessError, OSError):
              raise SystemExit('Docker lifecycle failed; inspect sanitized diagnostics') from None
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: install-matrix-I5-${{ matrix.scenario }}-${{ matrix.channel }}
          path: |
            ${{ runner.temp }}/I5-private/I5/receipt.json
            ${{ runner.temp }}/I5-private/I5/**/receipt.json
            ${{ runner.temp }}/I5-private/I5/**/*.log
          if-no-files-found: error
  linux-container-admission:
    if: ${{ !inputs.diagnostic && inputs.profile == 'all' && needs.subjects.result == 'success' && needs.linux-amd64.result == 'success' && needs.linux-arm64.result == 'success' && needs.linux-container.result == 'success' && needs.docker.result == 'success' }}
    needs: [subjects, linux-amd64, linux-arm64, linux-container, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: {row: [I1, I2, I5, I6]}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ inputs.commit }}', persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: install-matrix-subjects, path: '${{ runner.temp }}/install-subjects'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {pattern: 'install-matrix-${{ matrix.row }}-*', path: '${{ runner.temp }}/install-parts'}
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - name: Admit complete paper and Testnet lifecycles on exact released bytes
        shell: bash
        env:
          SOURCE: ${{ inputs.commit }}
          ROW: ${{ matrix.row }}
        run: |
          set -euo pipefail
          [ "$GITHUB_SHA" = "$SOURCE" ]
          python -m guard_harness.install_artifacts --row "$ROW" --parts "$RUNNER_TEMP/install-parts" --output "$RUNNER_TEMP/install-evidence"
          python -m guard_harness.install_evidence --row "$ROW" --evidence "$RUNNER_TEMP/install-evidence" --subjects "$RUNNER_TEMP/install-subjects" --manifest "$RUNNER_TEMP/install-subjects/candidate/assets/release-manifest.json" --commit "$SOURCE" --output "$RUNNER_TEMP/$ROW.predicate.json"
      - name: Attest the complete install row on the authenticated immutable manifest
        id: evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/install-subjects/candidate/assets/release-manifest.json
          predicate-type: https://zunderlabs.com/guard/journey/v1
          predicate-path: ${{ runner.temp }}/${{ matrix.row }}.predicate.json
      - name: Collect the signed install evidence bundle
        shell: bash
        env:
          BUNDLE: ${{ steps.evidence.outputs.bundle-path }}
          ROW: ${{ matrix.row }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "$RUNNER_TEMP/$ROW.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.row }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ matrix.row }}.sigstore.json
          if-no-files-found: error
          retention-days: 14
  native-admission:
    if: ${{ !inputs.diagnostic && inputs.profile == 'all' && needs.subjects.result == 'success' && needs.native.result == 'success' }}
    needs: [subjects, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    strategy:
      matrix: {row: [I3, I4]}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {pattern: 'install-matrix-*', path: '${{ runner.temp }}/matrix-evidence'}
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - name: Admit only the complete native row at the exact released source
        shell: bash
        env:
          SOURCE: ${{ inputs.commit }}
          ROW: ${{ matrix.row }}
        run: |
          set -euo pipefail
          [ "$GITHUB_SHA" = "$SOURCE" ]
          python -m guard_harness.install_artifacts --row "$ROW" --parts "$RUNNER_TEMP/matrix-evidence" --output "$RUNNER_TEMP/native-row"
          python -m guard_harness.native_evidence --row "$ROW" --evidence "$RUNNER_TEMP/native-row" --subjects "$RUNNER_TEMP/matrix-evidence/install-matrix-subjects" --manifest "$RUNNER_TEMP/matrix-evidence/install-matrix-subjects/candidate/assets/release-manifest.json" --commit "$SOURCE" --output "$RUNNER_TEMP/$ROW.predicate.json"
      - name: Attest the full row on the original immutable build manifest
        id: evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/matrix-evidence/install-matrix-subjects/candidate/assets/release-manifest.json
          predicate-type: https://zunderlabs.com/guard/journey/v1
          predicate-path: ${{ runner.temp }}/${{ matrix.row }}.predicate.json
      - name: Collect the signed native evidence bundle
        shell: bash
        env:
          BUNDLE: ${{ steps.evidence.outputs.bundle-path }}
          ROW: ${{ matrix.row }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "$RUNNER_TEMP/$ROW.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.row }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/${{ matrix.row }}.predicate.json
            ${{ runner.temp }}/${{ matrix.row }}.sigstore.json
          if-no-files-found: error
  aws-stack:
    if: ${{ (inputs.profile != 'nightly') && (inputs.target == 'all' || inputs.target == 'aws-stack') }}
    needs: subjects
    environment: aws-sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: install-matrix-subjects, path: '${{ runner.temp }}/subjects'}
      - name: Require explicit sandbox role, region and funded public mainnet read account
        shell: bash
        env:
          ROLE: ${{ vars.CFN_SANDBOX_ROLE_ARN }}
          REGION: ${{ vars.CFN_SANDBOX_REGION }}
          EXECUTION_ROLE: ${{ vars.CFN_SANDBOX_EXEC_ROLE_ARN }}
          PERMISSIONS_BOUNDARY: ${{ vars.CFN_SANDBOX_PERMISSIONS_BOUNDARY_ARN }}
          PAPER_ACCOUNT: ${{ vars.E2E_PAPER_ACCOUNT }}
        run: |
          set -euo pipefail
          [ -n "$ROLE" ] && [ -n "$REGION" ] && [ -n "$EXECUTION_ROLE" ] && [ -n "$PERMISSIONS_BOUNDARY" ]
          [[ $PERMISSIONS_BOUNDARY =~ ^arn:aws:iam::[0-9]{12}:policy/[A-Za-z0-9_+=,.@/-]+$ ]]
          [[ ${PERMISSIONS_BOUNDARY%%:policy/*} == "${EXECUTION_ROLE%%:role/*}" ]]
          [[ $PAPER_ACCOUNT =~ ^0x[0-9a-fA-F]{40}$ ]]
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.CFN_SANDBOX_ROLE_ARN }}
          aws-region: ${{ vars.CFN_SANDBOX_REGION }}
          role-session-name: zunder-e2e-${{ github.run_id }}
          role-duration-seconds: 7200
          mask-aws-account-id: true
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - name: I7 signed public template, paper bot, reboot, upgrade and owned cleanup
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          DIAGNOSTIC: ${{ inputs.diagnostic }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          PREVIOUS_SOURCE: ${{ inputs.previous_commit }}
          ROLE: ${{ vars.CFN_SANDBOX_ROLE_ARN }}
          REGION: ${{ vars.CFN_SANDBOX_REGION }}
          EXECUTION_ROLE: ${{ vars.CFN_SANDBOX_EXEC_ROLE_ARN }}
          PERMISSIONS_BOUNDARY: ${{ vars.CFN_SANDBOX_PERMISSIONS_BOUNDARY_ARN }}
          PAPER_ACCOUNT: ${{ vars.E2E_PAPER_ACCOUNT }}
        run: |
          set -euo pipefail
          umask 077
          RULES=$(python -c 'import json; print(json.load(open("deploy/guard/rules/vectors.json"))["valid"][0]["canonical"])')
          python -m guard_harness.aws_lifecycle --tag "$TAG" --commit "$SOURCE" --previous-tag "$PREVIOUS_TAG" --previous-commit "$PREVIOUS_SOURCE" --account "$PAPER_ACCOUNT" --rules "$RULES" --role "$ROLE" --execution-role "$EXECUTION_ROLE" --permissions-boundary "$PERMISSIONS_BOUNDARY" --region "$REGION" --assets "$RUNNER_TEMP/subjects" --work "$RUNNER_TEMP/I7"
      - name: Prepare I7 predicate only after full lifecycle and confirmed cleanup
        if: ${{ !inputs.diagnostic && inputs.profile != 'nightly' }}
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [ "$GITHUB_SHA" = "$SOURCE" ]
          python -m guard_harness.aws_evidence --assets "$RUNNER_TEMP/subjects/candidate/assets" --work "$RUNNER_TEMP/I7" --tag "$TAG" --commit "$SOURCE"
      - name: Attest I7 on the immutable released build manifest
        id: evidence
        if: ${{ !inputs.diagnostic && inputs.profile != 'nightly' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/subjects/candidate/assets/release-manifest.json
          predicate-type: https://zunderlabs.com/guard/journey/v1
          predicate-path: ${{ runner.temp }}/I7/I7.predicate.json
      - name: Retain official I7 signed evidence
        if: ${{ !inputs.diagnostic && inputs.profile != 'nightly' }}
        shell: bash
        env:
          BUNDLE: ${{ steps.evidence.outputs.bundle-path }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/I7/I7.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: I7-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/I7/aws.receipt.json
            ${{ runner.temp }}/I7/I7.predicate.json
            ${{ runner.temp }}/I7/I7.sigstore.json
            ${{ runner.temp }}/I7/*.log
            ${{ runner.temp }}/I7/mainnet/M1/*.json
            ${{ runner.temp }}/I7/mainnet/M1/*.log
          if-no-files-found: warn
          retention-days: 14

  linux-mainnet:
    if: ${{ (inputs.profile != 'nightly') && (inputs.target == 'all' || inputs.target == 'linux-mainnet') }}
    needs: subjects
    environment: e2e
    strategy:
      fail-fast: false
      matrix: {mode: [native, container]}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: install-matrix-subjects, path: '${{ runner.temp }}/subjects'}
      - run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils
          sudo chmod 666 /dev/kvm
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - name: M1 protected staged native/container userRole refusal in KVM
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          ACCOUNT: ${{ vars.E2E_PAPER_ACCOUNT }}
          DIAGNOSTIC: ${{ inputs.diagnostic }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, tarfile
          from guard_harness.native_release import Release
          from guard_harness.testnet_run import ROOT
          base=pathlib.Path(os.environ['RUNNER_TEMP'])
          release=Release(os.environ['TAG'],os.environ['SOURCE'],base/'subjects/candidate/assets')
          rules=json.loads((ROOT/'rules/vectors.json').read_bytes())['valid'][0]['canonical']
          manifest=release.asset('release-manifest.json')
          distribution=json.loads(manifest)['distribution']['docker']
          image=distribution['image']+'@'+distribution['digest']
          output=base/'linux-mainnet'
          words=[sys.executable,'-m','guard_harness.linux_guest','--mainnet-refusals-only',
                 '--candidate',str(base/'subjects/i-staging'),'--previous',str(base/'subjects/previous/assets/install.sh'),
                 '--version',os.environ['TAG'],'--previous-version',os.environ['PREVIOUS_TAG'],
                 '--rules',rules,'--account',os.environ['ACCOUNT'],'--output',str(output),'--mode',os.environ['MODE'],
                 '--release-tag',os.environ['TAG'],'--release-commit',os.environ['SOURCE'],
                 '--harness-commit',os.environ['GITHUB_SHA'],
                 '--manifest-sha256',hashlib.sha256(manifest).hexdigest(),
                 '--binary-sha256',hashlib.sha256(release.binary('linux-amd64')).hexdigest()]
          if os.environ['MODE']=='container': words += ['--release-image',image]
          if os.environ['DIAGNOSTIC']=='true': words += ['--diagnostic']
          try:
              subprocess.run(words,check=True)
          finally:
              route='linux-container-native' if os.environ['MODE']=='container' else 'linux-systemd'
              target=base/'mainnet/M1'
              target.mkdir(parents=True,exist_ok=True)
              receipt=output/'mainnet-refusal.json'
              if receipt.exists(): (target/(route+'.json')).write_bytes(receipt.read_bytes())
              archive=output/'guest-evidence.tar.gz'
              if archive.exists():
                  with tarfile.open(archive) as captured:
                      member=captured.getmember('evidence/unapproved-wallet.log')
                      if not member.isfile() or member.size>262144: raise SystemExit('refusal log shape refused')
                      stream=captured.extractfile(member)
                      if stream is None: raise SystemExit('refusal log unavailable')
                      (target/(route+'.log')).write_bytes(stream.read())
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: install-matrix-M1-linux-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/mainnet/M1/*.json
            ${{ runner.temp }}/mainnet/M1/*.log
          if-no-files-found: warn
          retention-days: 14
  native-mainnet:
    if: ${{ (inputs.profile != 'nightly') && (inputs.target == 'all' || inputs.target == 'native-mainnet') }}
    needs: subjects
