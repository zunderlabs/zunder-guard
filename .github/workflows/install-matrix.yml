        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {pattern: 'install-matrix-*', path: '${{ runner.temp }}/matrix-evidence'}
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - name: Admit only the complete native row at the exact released source
        shell: bash
        env:
          SOURCE: ${{ inputs.commit }}
          ROW: ${{ matrix.row }}
        run: |
          set -euo pipefail
          [ "$GITHUB_SHA" = "$SOURCE" ]
          python -m guard_harness.install_artifacts --row "$ROW" --parts "$RUNNER_TEMP/matrix-evidence" --output "$RUNNER_TEMP/native-row"
          python -m guard_harness.native_evidence --row "$ROW" --evidence "$RUNNER_TEMP/native-row" --subjects "$RUNNER_TEMP/matrix-evidence/install-matrix-subjects" --manifest "$RUNNER_TEMP/matrix-evidence/install-matrix-subjects/candidate/assets/release-manifest.json" --commit "$SOURCE" --output "$RUNNER_TEMP/$ROW.predicate.json"
      - name: Attest the full row on the original immutable build manifest
        id: evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/matrix-evidence/install-matrix-subjects/candidate/assets/release-manifest.json
          predicate-type: https://zunderlabs.com/guard/journey/v1
          predicate-path: ${{ runner.temp }}/${{ matrix.row }}.predicate.json
      - name: Collect the signed native evidence bundle
        shell: bash
        env:
          BUNDLE: ${{ steps.evidence.outputs.bundle-path }}
          ROW: ${{ matrix.row }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "$RUNNER_TEMP/$ROW.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.row }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/${{ matrix.row }}.predicate.json
            ${{ runner.temp }}/${{ matrix.row }}.sigstore.json
          if-no-files-found: error
  aws-stack:
    if: ${{ (inputs.profile != 'nightly') && (inputs.target == 'all' || inputs.target == 'aws-stack') }}
    needs: subjects
    environment: aws-sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: install-matrix-subjects, path: '${{ runner.temp }}/subjects'}
      - name: Require explicit sandbox role, region and funded public mainnet read account
        shell: bash
        env:
          ROLE: ${{ vars.CFN_SANDBOX_ROLE_ARN }}
          REGION: ${{ vars.CFN_SANDBOX_REGION }}
          EXECUTION_ROLE: ${{ vars.CFN_SANDBOX_EXEC_ROLE_ARN }}
          PERMISSIONS_BOUNDARY: ${{ vars.CFN_SANDBOX_PERMISSIONS_BOUNDARY_ARN }}
          PAPER_ACCOUNT: ${{ vars.E2E_PAPER_ACCOUNT }}
        run: |
          set -euo pipefail
          [ -n "$ROLE" ] && [ -n "$REGION" ] && [ -n "$EXECUTION_ROLE" ] && [ -n "$PERMISSIONS_BOUNDARY" ]
          [[ $PERMISSIONS_BOUNDARY =~ ^arn:aws:iam::[0-9]{12}:policy/[A-Za-z0-9_+=,.@/-]+$ ]]
          [[ ${PERMISSIONS_BOUNDARY%%:policy/*} == "${EXECUTION_ROLE%%:role/*}" ]]
          [[ $PAPER_ACCOUNT =~ ^0x[0-9a-fA-F]{40}$ ]]
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.CFN_SANDBOX_ROLE_ARN }}
          aws-region: ${{ vars.CFN_SANDBOX_REGION }}
          role-session-name: zunder-e2e-${{ github.run_id }}
          role-duration-seconds: 7200
          mask-aws-account-id: true
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - name: I7 signed public template, paper bot, reboot, upgrade and owned cleanup
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          DIAGNOSTIC: ${{ inputs.diagnostic }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          PREVIOUS_SOURCE: ${{ inputs.previous_commit }}
          ROLE: ${{ vars.CFN_SANDBOX_ROLE_ARN }}
          REGION: ${{ vars.CFN_SANDBOX_REGION }}
          EXECUTION_ROLE: ${{ vars.CFN_SANDBOX_EXEC_ROLE_ARN }}
          PERMISSIONS_BOUNDARY: ${{ vars.CFN_SANDBOX_PERMISSIONS_BOUNDARY_ARN }}
          PAPER_ACCOUNT: ${{ vars.E2E_PAPER_ACCOUNT }}
        run: |
          set -euo pipefail
          umask 077
          RULES=$(python -c 'import json; print(json.load(open("deploy/guard/rules/vectors.json"))["valid"][0]["canonical"])')
          python -m guard_harness.aws_lifecycle --tag "$TAG" --commit "$SOURCE" --previous-tag "$PREVIOUS_TAG" --previous-commit "$PREVIOUS_SOURCE" --account "$PAPER_ACCOUNT" --rules "$RULES" --role "$ROLE" --execution-role "$EXECUTION_ROLE" --permissions-boundary "$PERMISSIONS_BOUNDARY" --region "$REGION" --assets "$RUNNER_TEMP/subjects" --work "$RUNNER_TEMP/I7"
      - name: Prepare I7 predicate only after full lifecycle and confirmed cleanup
        if: ${{ !inputs.diagnostic && inputs.profile != 'nightly' }}
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [ "$GITHUB_SHA" = "$SOURCE" ]
          python -m guard_harness.aws_evidence --assets "$RUNNER_TEMP/subjects/candidate/assets" --work "$RUNNER_TEMP/I7" --tag "$TAG" --commit "$SOURCE"
      - name: Attest I7 on the immutable released build manifest
        id: evidence
        if: ${{ !inputs.diagnostic && inputs.profile != 'nightly' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/subjects/candidate/assets/release-manifest.json
          predicate-type: https://zunderlabs.com/guard/journey/v1
          predicate-path: ${{ runner.temp }}/I7/I7.predicate.json
      - name: Retain official I7 signed evidence
        if: ${{ !inputs.diagnostic && inputs.profile != 'nightly' }}
        shell: bash
        env:
          BUNDLE: ${{ steps.evidence.outputs.bundle-path }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/I7/I7.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: I7-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/I7/aws.receipt.json
            ${{ runner.temp }}/I7/I7.predicate.json
            ${{ runner.temp }}/I7/I7.sigstore.json
            ${{ runner.temp }}/I7/*.log
            ${{ runner.temp }}/I7/mainnet/M1/*.json
            ${{ runner.temp }}/I7/mainnet/M1/*.log
          if-no-files-found: warn
          retention-days: 14

  linux-mainnet:
    if: ${{ (inputs.profile != 'nightly') && (inputs.target == 'all' || inputs.target == 'linux-mainnet') }}
    needs: subjects
    environment: e2e
    strategy:
      fail-fast: false
      matrix: {mode: [native, container]}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: install-matrix-subjects, path: '${{ runner.temp }}/subjects'}
      - run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils
          sudo chmod 666 /dev/kvm
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - name: M1 protected staged native/container userRole refusal in KVM
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          ACCOUNT: ${{ vars.E2E_PAPER_ACCOUNT }}
          DIAGNOSTIC: ${{ inputs.diagnostic }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, tarfile
          from guard_harness.native_release import Release
          from guard_harness.testnet_run import ROOT
          base=pathlib.Path(os.environ['RUNNER_TEMP'])
          release=Release(os.environ['TAG'],os.environ['SOURCE'],base/'subjects/candidate/assets')
          rules=json.loads((ROOT/'rules/vectors.json').read_bytes())['valid'][0]['canonical']
          manifest=release.asset('release-manifest.json')
          distribution=json.loads(manifest)['distribution']['docker']
          image=distribution['image']+'@'+distribution['digest']
          output=base/'linux-mainnet'
          words=[sys.executable,'-m','guard_harness.linux_guest','--mainnet-refusals-only',
                 '--candidate',str(base/'subjects/i-staging'),'--previous',str(base/'subjects/previous/assets/install.sh'),
                 '--version',os.environ['TAG'],'--previous-version',os.environ['PREVIOUS_TAG'],
                 '--rules',rules,'--account',os.environ['ACCOUNT'],'--output',str(output),'--mode',os.environ['MODE'],
                 '--release-tag',os.environ['TAG'],'--release-commit',os.environ['SOURCE'],
                 '--harness-commit',os.environ['GITHUB_SHA'],
                 '--manifest-sha256',hashlib.sha256(manifest).hexdigest(),
                 '--binary-sha256',hashlib.sha256(release.binary('linux-amd64')).hexdigest()]
          if os.environ['MODE']=='container': words += ['--release-image',image]
          if os.environ['DIAGNOSTIC']=='true': words += ['--diagnostic']
          failed=False
          try:
              subprocess.run(words,check=True)
          except subprocess.CalledProcessError:
              failed=True
              raise
          finally:
              route='linux-container-native' if os.environ['MODE']=='container' else 'linux-systemd'
              target=base/'mainnet/M1'
              target.mkdir(parents=True,exist_ok=True)
              if failed:
                  from guard_harness.mainnet_diagnostics import guest_failure
                  guest_failure(output,target/(route+'.failure.json'))
              receipt=output/'mainnet-refusal.json'
              if receipt.exists(): (target/(route+'.json')).write_bytes(receipt.read_bytes())
              archive=output/'guest-evidence.tar.gz'
              if archive.exists():
                  with tarfile.open(archive) as captured:
                      member=captured.getmember('evidence/unapproved-wallet.log')
                      if not member.isfile() or member.size>262144: raise SystemExit('refusal log shape refused')
                      stream=captured.extractfile(member)
                      if stream is None: raise SystemExit('refusal log unavailable')
                      (target/(route+'.log')).write_bytes(stream.read())
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: install-matrix-M1-linux-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/mainnet/M1/*.json
            ${{ runner.temp }}/mainnet/M1/*.log
          if-no-files-found: warn
          retention-days: 14
  native-mainnet:
