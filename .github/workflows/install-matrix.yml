name: install-matrix
on:
  workflow_call:
    secrets:
      E2E_TESTNET_API_WALLET_KEY:
        description: Environment-scoped key, needed only by the protected testnet service row
        required: false
    inputs:
      tag: {type: string, required: true}
      commit: {type: string, required: true}
      previous_tag: {type: string, required: true}
      previous_commit: {type: string, required: true}
      diagnostic: {type: boolean, default: false}
      profile: {type: string, default: all}
      target: {type: string, default: all}
      scenario: {type: string, default: all}
  workflow_dispatch:
    inputs:
      tag: {type: string, required: true}
      commit: {type: string, required: true}
      previous_tag: {type: string, required: true}
      previous_commit: {type: string, required: true}
      diagnostic: {type: boolean, default: true}
      profile: {type: choice, options: [all, nightly], default: all}
      target: {type: choice, options: [all, unix, linux, linux-guests, linux-amd64, linux-arm64, linux-container, native, macos, docker, aws-stack, linux-mainnet, native-mainnet, mainnet-setup, operator-recovery, testnet-foreground, testnet-systemd], default: all}
      scenario: {type: choice, options: [all, fresh, upgrade], default: all}
      source_installer_diagnostic: {type: boolean, default: false}
      recovery_context: {type: string, required: false, default: ''}
      recovery_context_sha256: {type: string, required: false, default: ''}
permissions:
  contents: read
# Only a standalone diagnostic owns the global account group here. Called jobs
# inherit ownership from the structurally admitted verify/nightly workflow.
concurrency:
  group: ${{ contains(github.workflow_ref, '/.github/workflows/install-matrix.yml@') && 'guard-e2e-testnet' || format('guard-c6-install-inner-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max
env:
  INSTALL_MATRIX_PROFILE: ${{ inputs.profile }}
  INSTALL_MATRIX_TARGET: ${{ inputs.target }}
  INSTALL_MATRIX_SCENARIO: ${{ inputs.scenario }}
jobs:
  subjects:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: v3.1.3}
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - name: Authenticate original candidate and predecessor bytes
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          PREVIOUS_SOURCE: ${{ inputs.previous_commit }}
          DIAGNOSTIC: ${{ inputs.diagnostic }}
          SOURCE_INSTALLER_DIAGNOSTIC: ${{ inputs.source_installer_diagnostic == true && 'true' || 'false' }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          CALLER_REF: ${{ github.ref }}
          CALLER_EVENT: ${{ github.event_name }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          [ "$GITHUB_REPOSITORY" = zunderlabs/zunder-guard ]
          [ "$INSTALL_MATRIX_PROFILE" = all ] || [ "$INSTALL_MATRIX_PROFILE" = nightly ]
          case "$INSTALL_MATRIX_TARGET" in all|unix|linux|linux-guests|linux-amd64|linux-arm64|linux-container|native|macos|docker|aws-stack|linux-mainnet|native-mainnet|mainnet-setup|operator-recovery|testnet-foreground|testnet-systemd) ;; *) exit 1 ;; esac
          case "$INSTALL_MATRIX_SCENARIO" in all|fresh|upgrade) ;; *) exit 1 ;; esac
          case "$SOURCE_INSTALLER_DIAGNOSTIC" in false) ;; true)
            [ "$CALLER_REPOSITORY" = zunderlabs/zunder-guard ] || exit 1
            [ "$CALLER_EVENT" = workflow_dispatch ] || exit 1
            [ "$WORKFLOW_REF" = "zunderlabs/zunder-guard/.github/workflows/install-matrix.yml@$CALLER_REF" ] || exit 1
            [ "$CALLER_SHA" = "$GITHUB_SHA" ] || exit 1
            [ "$INSTALL_MATRIX_TARGET" = unix ] || exit 1
            [ "$INSTALL_MATRIX_SCENARIO" = fresh ] || exit 1
            [ "$INSTALL_MATRIX_PROFILE" = all ] || exit 1
            [ "$DIAGNOSTIC" = true ] || exit 1
            ;; *) exit 1 ;; esac
          if [ "$INSTALL_MATRIX_TARGET" != all ] || [ "$INSTALL_MATRIX_SCENARIO" != all ]; then
            [ "$DIAGNOSTIC" = true ] || exit 1
            [ "$INSTALL_MATRIX_PROFILE" = all ] || exit 1
          fi
          if [ "$INSTALL_MATRIX_TARGET" = operator-recovery ] || [ "$INSTALL_MATRIX_TARGET" = testnet-foreground ] || [ "$INSTALL_MATRIX_TARGET" = testnet-systemd ]; then
            [ "$INSTALL_MATRIX_SCENARIO" = fresh ] || exit 1
          fi
          if [ "$DIAGNOSTIC" != true ] && [ "$INSTALL_MATRIX_PROFILE" = all ]; then [ "$GITHUB_SHA" = "$SOURCE" ]; fi
          CHANNEL=staging
          if [ "$INSTALL_MATRIX_PROFILE" = nightly ]; then CHANNEL=canonical; fi
          install -d -m 700 "$RUNNER_TEMP/matrix"
          python -m guard_harness.native_release --tag "$TAG" --commit "$SOURCE" --previous-tag "$PREVIOUS_TAG" --previous-commit "$PREVIOUS_SOURCE" --work "$RUNNER_TEMP/matrix/subjects" --loader-channel "$CHANNEL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: install-matrix-subjects
          path: ${{ runner.temp }}/matrix/subjects
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  testnet-foreground:
    name: T1 foreground diagnostic only
    if: ${{ inputs.target == 'testnet-foreground' && inputs.diagnostic == true && inputs.profile == 'all' && inputs.scenario == 'fresh' && contains(github.workflow_ref, '/.github/workflows/install-matrix.yml@') && github.event_name == 'workflow_dispatch' }}
    needs: subjects
    environment: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: v3.1.3}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: install-matrix-subjects, path: '${{ runner.temp }}/subjects'}
      - name: Install the trusted diagnostic harness
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - name: Admit standalone foreground C6 ownership before API wallet custody
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_REF: ${{ github.ref }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_EVENT: ${{ github.event_name }}
          DIAGNOSTIC: ${{ inputs.diagnostic }}
        shell: bash
        run: python -m guard_harness.c6_owner --callee install-matrix.yml --profile "$INSTALL_MATRIX_PROFILE" --role testnet-foreground
      - name: Reserve cleanup from the actual 120-minute job start
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_PAGES: ${{ runner.temp }}/foreground-jobs.json
          JOB_TIMEOUT_SECONDS: '7200'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$JOB_PAGES"
          python -m guard_harness.job_deadline
      - name: Run the exact released T1 with only API wallet stdin
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          E2E_ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
          API_WALLET: ${{ vars.E2E_TESTNET_API_WALLET_ADDRESS }}
          WALLET_INPUT: ${{ secrets.E2E_TESTNET_API_WALLET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          [ -n "$WALLET_INPUT" ]
          install -d -m 700 "$RUNNER_TEMP/guard-release"
          printf '%s\n' "$WALLET_INPUT" | env -u WALLET_INPUT python -m guard_harness.testnet_run \
            --tag "$TAG" --commit "$SOURCE" --account "$E2E_ACCOUNT" --api-wallet "$API_WALLET" \
            --deadline "$JOURNEY_DEADLINE" --work "$RUNNER_TEMP/guard-release/T1"
      - name: Label retained observations as diagnostic only
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'guard-release/T1/receipt.json'
          path.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
          if path.is_symlink(): raise SystemExit('diagnostic receipt path refused')
          value = json.loads(path.read_bytes()) if path.is_file() else {'schema':1,'journey':'T1','result':'failed','stage':'not_started'}
          value.update(diagnostic=True,gate_eligible=False,release_ready=False,harness_commit=os.environ['GITHUB_SHA'])
          path.write_text(json.dumps(value) + '\n')
          path.chmod(0o600)
          PY
      - name: Retain T1 observations before the outside failure scan
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: T1-diagnostic-early-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/guard-release/T1/receipt.json
            ${{ runner.temp }}/guard-release/T1/assets.log
            ${{ runner.temp }}/guard-release/T1/runtime/init.log
            ${{ runner.temp }}/guard-release/T1/runtime/pair.log
            ${{ runner.temp }}/guard-release/T1/runtime/process.log
            ${{ runner.temp }}/guard-release/T1/runtime/mcp.log
            ${{ runner.temp }}/guard-release/T1/runtime/entry-attempt.json
            ${{ runner.temp }}/guard-release/T1/runtime/ownership.json
            ${{ runner.temp }}/guard-release/T1/runtime/cleanup-responses.json
            ${{ runner.temp }}/guard-release/T1/runtime/entry-response.json
            ${{ runner.temp }}/guard-release/T1/runtime/collection-failure.json
          if-no-files-found: warn
          retention-days: 7
      - name: Independent keyless C6 flat scan after failure
        if: ${{ failure() || cancelled() }}
        env:
          E2E_ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
        run: python -m guard_harness.failure_scan --work "$RUNNER_TEMP/guard-release/T1-failure/postfailure-flat.json"
      - name: Retain final diagnostic observations after the outside scan
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: T1-diagnostic-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/guard-release/T1/receipt.json
            ${{ runner.temp }}/guard-release/T1-failure/postfailure-flat.json
            ${{ runner.temp }}/guard-release/T1/assets.log
            ${{ runner.temp }}/guard-release/T1/runtime/init.log
            ${{ runner.temp }}/guard-release/T1/runtime/pair.log
            ${{ runner.temp }}/guard-release/T1/runtime/process.log
            ${{ runner.temp }}/guard-release/T1/runtime/mcp.log
            ${{ runner.temp }}/guard-release/T1/runtime/entry-attempt.json
            ${{ runner.temp }}/guard-release/T1/runtime/ownership.json
            ${{ runner.temp }}/guard-release/T1/runtime/cleanup-responses.json
            ${{ runner.temp }}/guard-release/T1/runtime/entry-response.json
            ${{ runner.temp }}/guard-release/T1/runtime/collection-failure.json
          if-no-files-found: warn
          retention-days: 7
  testnet-systemd:
    name: T2 systemd diagnostic only
    if: ${{ inputs.target == 'testnet-systemd' && inputs.diagnostic == true && inputs.profile == 'all' && inputs.scenario == 'fresh' && contains(github.workflow_ref, '/.github/workflows/install-matrix.yml@') && github.event_name == 'workflow_dispatch' }}
    needs: subjects
    environment: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: v3.1.3}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: install-matrix-subjects, path: '${{ runner.temp }}/subjects'}
      - name: Install the trusted diagnostic harness
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
      - name: Admit standalone systemd C6 ownership before API wallet custody
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_REF: ${{ github.ref }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_EVENT: ${{ github.event_name }}
          DIAGNOSTIC: ${{ inputs.diagnostic }}
        shell: bash
        run: python -m guard_harness.c6_owner --callee install-matrix.yml --profile "$INSTALL_MATRIX_PROFILE" --role testnet-systemd
      - name: Reserve cleanup from the actual 120-minute job start
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_PAGES: ${{ runner.temp }}/systemd-jobs.json
          JOB_TIMEOUT_SECONDS: '7200'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$JOB_PAGES"
          python -m guard_harness.job_deadline
      - name: Run the exact released T2 with only API wallet stdin
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.commit }}
          E2E_ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
          API_WALLET: ${{ vars.E2E_TESTNET_API_WALLET_ADDRESS }}
          WALLET_INPUT: ${{ secrets.E2E_TESTNET_API_WALLET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          [ -n "$WALLET_INPUT" ]
          ROOT_PARENT="/root/guard-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sudo install -d -o root -g root -m 700 "$ROOT_PARENT"
          MARKER=$(python -c 'import secrets; print(secrets.token_hex(16))')
          printf '%s' "$MARKER" | sudo tee /etc/zunder-native-disposable >/dev/null
          sudo chmod 600 /etc/zunder-native-disposable
          printf '%s\n' "$WALLET_INPUT" | env -u WALLET_INPUT sudo --preserve-env=GH_TOKEN,PATH,GITHUB_ACTIONS,RUNNER_ENVIRONMENT \
            "$(command -v python)" -m guard_harness.testnet_run --service-marker "$MARKER" \
            --tag "$TAG" --commit "$SOURCE" --account "$E2E_ACCOUNT" --api-wallet "$API_WALLET" \
            --deadline "$JOURNEY_DEADLINE" --work "$ROOT_PARENT/T2"
      - name: Export only fixed diagnostic observations from root-owned service custody
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ROOT_WORK="/root/guard-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/T2"
          install -d -m 700 "$RUNNER_TEMP/guard-release/T2"
          FILES=()
          for FILE in receipt.json assets.log runtime/init.log runtime/testnet-service-install.log runtime/service-stop.log runtime/service-start.log runtime/pair.log runtime/process.log runtime/mcp.log runtime/entry-attempt.json runtime/entry-response.json runtime/ownership.json runtime/collection-failure.json runtime/cleanup-responses.json runtime/linux-opt-refusal.receipt.json runtime/linux-opt-normalized.receipt.json; do
            if sudo test -f "$ROOT_WORK/$FILE" && ! sudo test -L "$ROOT_WORK/$FILE"; then
              FILES+=("$FILE")
            fi
          done
          if [ "${#FILES[@]}" -gt 0 ]; then
            sudo /usr/bin/tar -C "$ROOT_WORK" -cf - "${FILES[@]}" | tar --no-same-owner --no-same-permissions -xf - -C "$RUNNER_TEMP/guard-release/T2"
          fi
      - name: Label retained observations as diagnostic only
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'guard-release/T2/receipt.json'
          path.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
          if path.is_symlink(): raise SystemExit('diagnostic receipt path refused')
          value = json.loads(path.read_bytes()) if path.is_file() else {'schema':1,'journey':'T2','result':'failed','stage':'not_started'}
          value.update(diagnostic=True,gate_eligible=False,release_ready=False,harness_commit=os.environ['GITHUB_SHA'])
          path.write_text(json.dumps(value) + '\n')
          path.chmod(0o600)
          PY
      - name: Retain T2 observations before the outside failure scan
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: T2-diagnostic-early-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/guard-release/T2/receipt.json
            ${{ runner.temp }}/guard-release/T2/assets.log
            ${{ runner.temp }}/guard-release/T2/runtime/init.log
            ${{ runner.temp }}/guard-release/T2/runtime/testnet-service-install.log
            ${{ runner.temp }}/guard-release/T2/runtime/service-stop.log
            ${{ runner.temp }}/guard-release/T2/runtime/service-start.log
            ${{ runner.temp }}/guard-release/T2/runtime/pair.log
            ${{ runner.temp }}/guard-release/T2/runtime/process.log
            ${{ runner.temp }}/guard-release/T2/runtime/mcp.log
            ${{ runner.temp }}/guard-release/T2/runtime/entry-attempt.json
            ${{ runner.temp }}/guard-release/T2/runtime/ownership.json
            ${{ runner.temp }}/guard-release/T2/runtime/cleanup-responses.json
            ${{ runner.temp }}/guard-release/T2/runtime/linux-opt-refusal.receipt.json
            ${{ runner.temp }}/guard-release/T2/runtime/linux-opt-normalized.receipt.json
            ${{ runner.temp }}/guard-release/T2/runtime/entry-response.json
            ${{ runner.temp }}/guard-release/T2/runtime/collection-failure.json
          if-no-files-found: warn
          retention-days: 7
      - name: Independent keyless C6 flat scan after failure
        if: ${{ failure() || cancelled() }}
        env:
          E2E_ACCOUNT: ${{ vars.E2E_TESTNET_ACCOUNT }}
        run: python -m guard_harness.failure_scan --work "$RUNNER_TEMP/guard-release/T2-failure/postfailure-flat.json"
      - name: Retain final diagnostic observations after the outside scan
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: T2-diagnostic-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/guard-release/T2/receipt.json
            ${{ runner.temp }}/guard-release/T2-failure/postfailure-flat.json
            ${{ runner.temp }}/guard-release/T2/assets.log
            ${{ runner.temp }}/guard-release/T2/runtime/init.log
            ${{ runner.temp }}/guard-release/T2/runtime/testnet-service-install.log
            ${{ runner.temp }}/guard-release/T2/runtime/service-stop.log
            ${{ runner.temp }}/guard-release/T2/runtime/service-start.log
            ${{ runner.temp }}/guard-release/T2/runtime/pair.log
            ${{ runner.temp }}/guard-release/T2/runtime/process.log
            ${{ runner.temp }}/guard-release/T2/runtime/mcp.log
            ${{ runner.temp }}/guard-release/T2/runtime/entry-attempt.json
            ${{ runner.temp }}/guard-release/T2/runtime/ownership.json
            ${{ runner.temp }}/guard-release/T2/runtime/cleanup-responses.json
            ${{ runner.temp }}/guard-release/T2/runtime/linux-opt-refusal.receipt.json
            ${{ runner.temp }}/guard-release/T2/runtime/linux-opt-normalized.receipt.json
            ${{ runner.temp }}/guard-release/T2/runtime/entry-response.json
            ${{ runner.temp }}/guard-release/T2/runtime/collection-failure.json
          if-no-files-found: warn
          retention-days: 7
  operator-recovery:
    name: Operator-attributed C6 recovery (diagnostic only)
    if: ${{ inputs.target == 'operator-recovery' && inputs.diagnostic == true && inputs.profile == 'all' && inputs.scenario == 'fresh' && contains(github.workflow_ref, '/.github/workflows/install-matrix.yml@') && github.event_name == 'workflow_dispatch' }}
    needs: subjects
    environment: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: v3.1.3}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: install-matrix-subjects, path: '${{ runner.temp }}/subjects'}
      - name: Install recovery consumer and private operator context
        shell: bash
        env:
          CONTEXT_JSON: ${{ inputs.recovery_context }}
        run: |
          set -euo pipefail
          umask 077
