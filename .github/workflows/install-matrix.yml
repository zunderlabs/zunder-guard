          import os, pathlib
          from guard_harness.native_release import Release
          from guard_harness.windows_policy import prepare
          base=pathlib.Path(os.environ['RUNNER_TEMP'])
          release=Release(os.environ['TAG'],os.environ['SOURCE'],base/'subjects/candidate/assets')
          work=base/'mainnet/windows-policy'
          work.parent.mkdir(mode=0o700,exist_ok=True)
          clean={name:value for name,value in os.environ.items()
                 if not name.startswith('ZUNDER_') and 'WALLET' not in name and 'TOKEN' not in name}
          prepare(release,work,clean)
