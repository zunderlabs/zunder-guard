# Release pipeline for github.com/zunderlabs/zunder-guard (deploy/guard/README.md, "Release
# pipeline"). Copy to .github/workflows/ in that repository; it is kept here, outside .github/,
# so nothing runs in this one.
#
# A pushed tag vX.Y.Z builds every binary reproducibly (pinned toolchain, --locked, remapped
# paths, SOURCE_DATE_EPOCH), rebuilds Linux on a fresh runner and refuses if the bytes differ,
# packs deterministic archives, writes SBOMs and SHA256SUMS, signs SHA256SUMS with Sigstore
# (keyless, this workflow's identity), records SLSA provenance, pushes a signed multi-arch image
# to GHCR. After every build, signature, provenance and installer smoke job succeeds, publish
# the assembled draft as a prerelease with latest=false. Canonical channel promotion requires
# the separate full journey gate; lifecycle/installer/tap/template staging wiring follows.
#
# Actions are pinned by commit; slsa-github-generator must be referenced by tag (its verifier
# requires that).
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  IMAGE: ghcr.io/zunderlabs/zunder-guard

jobs:
  native-policy-diagnostics:
    permissions: {contents: read}
    name: Windows policy observation (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Observe policy keys only (PowerShell 7; no fixture or Rust build)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./deploy/guard/test/windows-service-native.ps1 -DiagnosticsOnly -PolicyDiagnostic "$env:RUNNER_TEMP/wer-policy-pwsh.json"
      - name: Observe policy keys only (PowerShell 5.1; no fixture or Rust build)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./deploy/guard/test/windows-service-native.ps1 -DiagnosticsOnly -PolicyDiagnostic "$env:RUNNER_TEMP/wer-policy-ps51.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-policy-${{ matrix.runner }}-${{ github.sha }}
          path: ${{ runner.temp }}/wer-policy-*.json
          if-no-files-found: warn

  native-windows:
    name: windows-service-native
    permissions: {contents: read}
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mainnet loader transactions and trust regressions (PowerShell 7)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./deploy/guard/test/windows-mainnet-loader.ps1
      - name: Mainnet loader transactions and trust regressions (PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./deploy/guard/test/windows-mainnet-loader.ps1
      - name: Default Restricted policy bootstrap and process-only helper policy
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./deploy/guard/test/windows-mainnet-policy.ps1
      - run: rustup toolchain install
      - name: SCM argument and timeout regressions (PowerShell 7 and 5.1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustc --edition=2024 deploy/guard/test/windows-scm-argv.rs -o "$env:RUNNER_TEMP/scm-argv.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Native argv recorder build failed.' }
          & ./deploy/guard/test/windows-scm-argv.ps1 -ServicePath ./deploy/guard/windows/service.ps1 -Recorder "$env:RUNNER_TEMP/scm-argv.exe"
          & ./deploy/guard/test/windows-wait-started.ps1
          rustc --edition=2024 deploy/guard/test/windows-policy-fixture.rs -o "$env:RUNNER_TEMP/policy-fixture.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Policy-refusal recorder build failed.' }
          & ./deploy/guard/test/windows-policy-refusal.ps1 -HarnessPath ./deploy/guard/test/windows-service-native.ps1 -Recorder "$env:RUNNER_TEMP/policy-fixture.exe"
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -File ./deploy/guard/test/windows-scm-argv.ps1 -ServicePath ./deploy/guard/windows/service.ps1 -Recorder "$env:RUNNER_TEMP/scm-argv.exe"
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 5.1 argv regression failed.' }
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -File ./deploy/guard/test/windows-wait-started.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 5.1 wait regression failed.' }
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -File ./deploy/guard/test/windows-policy-refusal.ps1 -HarnessPath ./deploy/guard/test/windows-service-native.ps1 -Recorder "$env:RUNNER_TEMP/policy-fixture.exe"
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 5.1 policy-refusal regression failed.' }
      - run: cargo clippy --locked -p zunder-guard --all-targets -- -D warnings
      - name: Compile native and exercise synthetic credential, ACL and process containment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path native-service-receipt | Out-Null
          cargo test --locked -p zunder-guard --lib service:: -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Native service tests failed.' }
          cargo test --locked -p zunder-guard --lib service::windows::tests::native_protected_file_acl -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Elevated native ACL test failed.' }
          cargo build --locked -p zunder-guard --example windows_service_fixture
          if ($LASTEXITCODE -ne 0) { throw 'SCM fixture build failed.' }
          $ObservationStarted = [DateTimeOffset]::UtcNow
          & ./deploy/guard/test/windows-service-native.ps1 -ObservePolicyRefusal -Fixture ./target/debug/examples/windows_service_fixture.exe -PolicyDiagnostic ./native-service-receipt/wer-policy-pwsh.json
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -File ./deploy/guard/test/windows-service-native.ps1 -ObservePolicyRefusal -Fixture ./target/debug/examples/windows_service_fixture.exe -PolicyDiagnostic ./native-service-receipt/wer-policy-ps51.json
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 5.1 SCM observation failed.' }
          $HelperHash = (Get-FileHash ./deploy/guard/windows/service.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          $HarnessHash = (Get-FileHash ./deploy/guard/test/windows-service-native.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          $FixtureHash = (Get-FileHash ./target/debug/examples/windows_service_fixture.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $Observations = @()
          foreach ($Shell in @('pwsh','ps51')) {
            $Observation = Get-Content -Raw -LiteralPath "./native-service-receipt/wer-policy-$Shell.json.admission.json" | ConvertFrom-Json -DateKind String
            if ($Observation.version -ne 1 -or $Observation.invocation_id -notmatch '^[0-9a-f]{32}$' -or [DateTimeOffset]::Parse($Observation.started_utc) -lt $ObservationStarted -or [DateTimeOffset]::Parse($Observation.finished_utc) -lt [DateTimeOffset]::Parse($Observation.started_utc) -or -not $Observation.cleanup_complete -or $Observation.releaseReady -or $Observation.source_helper_sha256 -cne $HelperHash -or $Observation.harness_sha256 -cne $HarnessHash -or $Observation.fixture_sha256 -cne $FixtureHash) { throw 'Stale or inexact native observation.' }
            if (($Shell -eq 'pwsh' -and $Observation.powershell -cne $PSVersionTable.PSVersion.ToString()) -or ($Shell -eq 'ps51' -and $Observation.powershell -notmatch '^5\.1\.')) { throw 'Native observation PowerShell binding differs.' }
            if (($Observation.result -ceq 'positive-synthetic-lifecycle' -and $Observation.positive_lifecycle_verified -ceq $true) -or ($Observation.result -ceq 'expected-policy-refusal' -and $Observation.positive_lifecycle_verified -ceq $false)) { $Observations += $Observation } else { throw 'Unknown or inconsistent native observation.' }
          }
          if ($Observations[0].invocation_id -ceq $Observations[1].invocation_id) { throw 'Duplicate native observation.' }
          $PositiveLifecycle = @($Observations | Where-Object { $_.positive_lifecycle_verified }).Count -eq 2
          $Verified = @('machine protection round trip','immutable ACL refusal','reparse refusal','Job child and descendant termination','stdin EOF stop','framing and exact runtime config snapshot admission','independent randomized admission and lifecycle models')
          $LifecycleChecks = @('acknowledged SCM Stop wins over transient child exit','SCM Session-0 virtual account','machine decryption under service identity','broker death containment','four transient retries','service-owned renewal/admin access','bounded runtime crash dump scan')
          $Pending = @('broker crash artifact scan','signed production installer upgrade rollback','unattended reboot before user login')
          if ($PositiveLifecycle) { $Verified += $LifecycleChecks } else { $Verified += 'observed hosted crash policy refused before secret admission'; $Pending += $LifecycleChecks }
          $Errors = $null
          $Tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'deploy/guard/windows/service.ps1'),[ref]$Tokens,[ref]$Errors) | Out-Null
          if ($Errors.Count) { throw ($Errors | Out-String) }
          @{
            source = '${{ github.sha }}'
            os = [Environment]::OSVersion.VersionString
            architecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            credentials = 'synthetic only; no venue traffic'
            verified = $Verified
            pending = $Pending
            observations = $Observations
            positive_lifecycle_verified = $PositiveLifecycle
            releaseReady = $false
          } | ConvertTo-Json -Depth 8 | Set-Content native-service-receipt/windows.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-service-windows-${{ github.sha }}
          path: native-service-receipt/
          if-no-files-found: warn

  native-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Disposable VM prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq qemu-system-x86 qemu-utils cloud-image-utils ubuntu-cloudimage-keyring gpgv openssh-client curl
      - name: Real systemd and Docker lifecycle, including guest reboot
        run: python3 -B deploy/guard/test/container-native/vm.py --output "${{ runner.temp }}/container-native-evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: container-native-lifecycle
          path: ${{ runner.temp }}/container-native-evidence
          if-no-files-found: warn
          retention-days: 14

  native-services:
    if: always()
    needs: [native-policy-diagnostics, native-windows, native-container]
    permissions: {contents: read}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every native source prerequisite before signing
        shell: python
        run: |
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert set(results) == {'native-policy-diagnostics', 'native-windows', 'native-container'}
          assert all(row['result'] == 'success' for row in results.values()), 'Native prerequisite failed'

  # Linux: the Dockerfile's build stage (a rust:alpine image pinned by digest), natively on each
  # architecture, so anyone can rebuild the same bytes with one command (README, "Reproducing a
  # release"). macOS and Windows: the toolchain pinned by rust-toolchain.toml on GitHub's runners
  # (Windows: MSVC, the C runtime static, /Brepro).
  build:
    name: build ${{ matrix.target }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: linux-amd64, os: ubuntu-24.04, platform: linux/amd64, triple: "", exe: "" }
          - { target: linux-arm64, os: ubuntu-24.04-arm, platform: linux/arm64, triple: "", exe: "" }
          - { target: darwin-amd64, os: macos-15-intel, platform: "", triple: x86_64-apple-darwin, exe: "" }
          - { target: darwin-arm64, os: macos-15, platform: "", triple: aarch64-apple-darwin, exe: "" }
          - { target: windows-amd64, os: windows-2025, platform: "", triple: x86_64-pc-windows-msvc, exe: ".exe" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.platform != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Build (Linux, static musl, in the pinned builder image)
        if: matrix.platform != ''
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker buildx build -f deploy/guard/Dockerfile --target bin-build --platform "$PLATFORM" \
            --no-cache -o type=local,dest=out .
      - name: Build (macOS, Windows)
        if: matrix.triple != ''
        shell: bash
        env:
          TRIPLE: ${{ matrix.triple }}
          EXE: ${{ matrix.exe }}
        run: |
          rustup toolchain install
          rustup target add "$TRIPLE"
          deploy/guard/github/build-release.sh "$TRIPLE"
          mkdir -p out && cp "target/$TRIPLE/release/zunder-guard$EXE" out/
      - name: macOS credential isolation and crash-limit native gates
        if: startsWith(matrix.target, 'darwin-')
        shell: bash
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          # Synthetic private fixture Keychain only; no venue requests or real keys.
          # Serial execution keeps process-global Keychain interaction controls deterministic.
          mkdir -p native-macos-evidence
          python3 -B deploy/guard/test/macos-bootstrap.py deploy/guard/install.sh
          sw_vers > native-macos-evidence/os.txt
          uname -m > native-macos-evidence/architecture.txt
          git rev-parse HEAD > native-macos-evidence/source-commit.txt
          set +e
          cargo test --locked -p zunder-guard --target "$TRIPLE" service::macos::tests -- --test-threads=1 > native-macos-evidence/synthetic-tests.log 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > native-macos-evidence/exit-code.txt
          cat native-macos-evidence/synthetic-tests.log
          exit "$result"
      - name: System Keychain and launchd native synthetic lifecycle
        if: startsWith(matrix.target, 'darwin-')
        shell: bash
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          cargo build --locked -p zunder-guard --example macos_service_fixture --target "$TRIPLE"
          shasum -a 256 "target/$TRIPLE/debug/examples/macos_service_fixture" > native-macos-evidence/fixture-sha256.txt
          sudo /usr/bin/env GITHUB_ACTIONS=true RUNNER_OS=macOS RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" /bin/bash deploy/guard/macos/native-ci.sh "$PWD/target/$TRIPLE/debug/examples/macos_service_fixture" "$PWD/native-macos-evidence"
      - name: Retain native macOS synthetic gate evidence
        if: always() && startsWith(matrix.target, 'darwin-')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-macos-${{ matrix.target }}
          path: native-macos-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Refuse the stub, and a binary whose version is not the tag's
        shell: bash
        env:
          BIN: out/zunder-guard${{ matrix.exe }}
          TAG: ${{ github.ref_name }}
        run: |
          if grep -aq 'STUB: a packaging test double' "$BIN"; then
            echo "::error::the binary is the packaging STUB, not Guard"; exit 1
          fi
          # Every target here runs on its native architecture.
          version=$("$BIN" --version | tr -d '\r')
          if [ "$version" != "zunder-guard ${TAG#v}" ]; then
            echo "::error::the binary says '$version', the tag is $TAG: export with --version ${TAG#v}"; exit 1
          fi
          sha256sum "$BIN" 2>/dev/null || shasum -a 256 "$BIN"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: out/zunder-guard${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 7

  # The same source on fresh runners must give the same Linux binaries, bit for bit.
  reproduce:
    needs: build
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { target: linux-amd64, os: ubuntu-24.04, platform: linux/amd64 }
          - { target: linux-arm64, os: ubuntu-24.04-arm, platform: linux/arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker buildx build -f deploy/guard/Dockerfile --target bin-build --platform "$PLATFORM" \
            --no-cache -o type=local,dest=again .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bin-${{ matrix.target }}
          path: first
      - name: Compare
        run: |
          sha256sum first/zunder-guard again/zunder-guard
          cmp first/zunder-guard again/zunder-guard \
            || { echo "::error::the rebuild differs: the build is not reproducible"; exit 1; }

  package:
    needs: [build, reproduce, image, native-services]
    permissions:
      contents: write # the draft release
      id-token: write # Sigstore keyless signing
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          path: bins
      - name: Archives, install.sh, the loaders i and i.ps1, Homebrew formula, winget manifests, pinned templates
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          for t in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            GUARD_REQUIRE_NOTICES=1 deploy/guard/packaging/package.sh "$VERSION" "$t" "bins/bin-$t/zunder-guard" dist
          done
          GUARD_REQUIRE_NOTICES=1 deploy/guard/packaging/package.sh "$VERSION" windows-amd64 bins/bin-windows-amd64/zunder-guard.exe dist
      - name: SBOM (Cargo.lock, SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/zunder-guard-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM (Cargo.lock, CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/zunder-guard-${{ github.ref_name }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Render payloads and seal the immutable C2 manifest
        env:
          VERSION: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          RELEASE_COMMIT: ${{ github.sha }}
          AWS_TEMPLATE_BASE_URL: ${{ vars.AWS_TEMPLATE_BASE_URL }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          printf '%s@%s\n' "$IMAGE" "$IMAGE_DIGEST" >"dist/zunder-guard-$VERSION.image.txt"
          test -n "$AWS_TEMPLATE_BASE_URL" || { echo "AWS_TEMPLATE_BASE_URL is required" >&2; exit 1; }
          deploy/guard/packaging/render.sh "$VERSION" dist --payloads-only
          python3 -m venv "$RUNNER_TEMP/release-metadata-venv"
          "$RUNNER_TEMP/release-metadata-venv/bin/pip" install --require-hashes --only-binary=:all: \
            -r deploy/guard/harness/requirements-runtime.lock
          "$RUNNER_TEMP/release-metadata-venv/bin/pip" install --no-deps --no-build-isolation ./deploy/guard/harness
          assets=()
          for payload in dist/*; do assets+=(--asset "$payload"); done
          "$RUNNER_TEMP/release-metadata-venv/bin/python" -m guard_harness.build_manifest \
            --tag "$VERSION" --commit "$RELEASE_COMMIT" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --docker-digest "$IMAGE_DIGEST" \
            --template-url "${AWS_TEMPLATE_BASE_URL%/}/guard/$VERSION/cloudformation.yaml" \
            --schema deploy/guard/release/manifest.schema.json \
            --output dist/release-manifest.json --checksums dist/SHA256SUMS "${assets[@]}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign SHA256SUMS (keyless) and verify it the way install.sh will
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
          cosign verify-blob --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
      - id: hashes
        name: Subjects for SLSA provenance
        run: echo "hashes=$(base64 -w0 dist/SHA256SUMS)" >>"$GITHUB_OUTPUT"
      - name: Draft release (a person publishes it)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" --draft --verify-tag --title "Zunder Guard $VERSION" \
            --notes-file deploy/guard/packaging/release-readme.md dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 7

  # The installers users run, against the signed draft's own files (served from a folder with
  # ZUNDER_GUARD_BASE_URL, verified exactly as from GitHub) with the real cosign: install, set
  # up paper mode for a public account (reads, sends nothing), start, health. A failure here
  # means: do not publish the draft (RELEASE.md).
  install-smoke:
    needs: package
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RULES: zr1_eyJ2IjoxfQ
      ACCOUNT: "0x67f7aa8fb95c47e6ea9c517b623e0701cbf9d9ba"
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: sh one-liner (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export ZUNDER_GUARD_BASE_URL="file://$PWD/dist" ZUNDER_GUARD_HOME="$RUNNER_TEMP/guard"
          sh dist/i --non-interactive --network paper --rules "$RULES" --account "$ACCOUNT" --no-service --prefix "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/zunder-guard" run --network paper &
          for _ in $(seq 1 30); do "$RUNNER_TEMP/bin/zunder-guard" health && break; sleep 1; done
          "$RUNNER_TEMP/bin/zunder-guard" health
      - name: i.ps1 (Windows PowerShell 5.1, the documented scriptblock form)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:ZUNDER_GUARD_BASE_URL = (Resolve-Path dist).Path
          $env:ZUNDER_GUARD_HOME = Join-Path $env:RUNNER_TEMP 'guard'
          & ([scriptblock]::Create((Get-Content -Raw dist/i.ps1))) -NonInteractive -Rules $env:RULES -Account $env:ACCOUNT -InstallDir (Join-Path $env:RUNNER_TEMP 'bin')
          $exe = Join-Path $env:RUNNER_TEMP 'bin\zunder-guard.exe'
          $guard = Start-Process -FilePath $exe -ArgumentList 'run', '--network', 'paper' -PassThru -NoNewWindow
          foreach ($i in 1..30) { & $exe health; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 1 }
          & $exe health
          if ($LASTEXITCODE -ne 0) { throw 'Guard did not become healthy' }
          Stop-Process -Id $guard.Id

  provenance:
    needs: package
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses] SLSA verifier requires release-tag identity; plan 7 exception.
    with:
      base64-subjects: ${{ needs.package.outputs.hashes }}
      upload-assets: false
      provenance-name: zunder-guard-${{ github.ref_name }}.intoto.jsonl

  attach-provenance:
    needs: provenance
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zunder-guard-${{ github.ref_name }}.intoto.jsonl
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release upload --repo "$GITHUB_REPOSITORY" "$VERSION" "zunder-guard-$VERSION.intoto.jsonl"

  image:
    needs: [build, reproduce, native-services]
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-linux-*
          path: bins
      - name: The released, checksummed Linux binaries go into the image unchanged
        run: |
          for a in amd64 arm64; do install -D -m 0755 "bins/bin-linux-$a/zunder-guard" "dist/linux-$a/zunder-guard"; done
          sha256sum dist/linux-*/zunder-guard
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >>"$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/guard/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: GUARD_SOURCE=prebuilt
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          push: true
          provenance: false
          sbom: false
          outputs: type=image,rewrite-timestamp=true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: SBOM of the image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Sign the image and attach its SBOM (keyless)
        env:
          REF: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate image.spdx.json "$REF"

  image-provenance:
    needs: image
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses] SLSA verifier requires release-tag identity; plan 7 exception.
    with:
      image: ghcr.io/zunderlabs/zunder-guard
      digest: ${{ needs.image.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  stage-prerelease:
    needs: [attach-provenance, install-smoke, image-provenance]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish assembled prerelease without latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/guard/github/stage-prerelease.sh
