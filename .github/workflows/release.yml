# Release pipeline for github.com/zunderlabs/zunder-guard (deploy/guard/README.md, "Release
# pipeline"). Copy to .github/workflows/ in that repository; it is kept here, outside .github/,
# so nothing runs in this one.
#
# A pushed tag vX.Y.Z builds every binary reproducibly (pinned toolchain, --locked, remapped
# paths, SOURCE_DATE_EPOCH), rebuilds Linux on a fresh runner and refuses if the bytes differ,
# packs deterministic archives, writes SBOMs and SHA256SUMS, signs SHA256SUMS with Sigstore
# (keyless, this workflow's identity), records SLSA provenance, pushes a signed multi-arch image
# to GHCR, and leaves a DRAFT release. A person publishes the draft; publish.yml then updates the
# Homebrew tap, winget (when enabled) and the image's latest tag. Before anyone publishes,
# install-smoke runs the real installers (i on Linux and macOS, i.ps1 on Windows) against the
# signed draft's files with the real cosign, and starts Guard in paper mode.
#
# Actions are pinned by commit; slsa-github-generator must be referenced by tag (its verifier
# requires that).
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  IMAGE: ghcr.io/zunderlabs/zunder-guard

jobs:
  native-services:
    permissions:
      contents: read
    uses: ./.github/workflows/native-service.yml

  # Linux: the Dockerfile's build stage (a rust:alpine image pinned by digest), natively on each
  # architecture, so anyone can rebuild the same bytes with one command (README, "Reproducing a
  # release"). macOS and Windows: the toolchain pinned by rust-toolchain.toml on GitHub's runners
  # (Windows: MSVC, the C runtime static, /Brepro).
  build:
    name: build ${{ matrix.target }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: linux-amd64, os: ubuntu-24.04, platform: linux/amd64, triple: "", exe: "" }
          - { target: linux-arm64, os: ubuntu-24.04-arm, platform: linux/arm64, triple: "", exe: "" }
          - { target: darwin-amd64, os: macos-15-intel, platform: "", triple: x86_64-apple-darwin, exe: "" }
          - { target: darwin-arm64, os: macos-15, platform: "", triple: aarch64-apple-darwin, exe: "" }
          - { target: windows-amd64, os: windows-2025, platform: "", triple: x86_64-pc-windows-msvc, exe: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.platform != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (Linux, static musl, in the pinned builder image)
        if: matrix.platform != ''
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker buildx build -f deploy/guard/Dockerfile --target bin-build --platform "$PLATFORM" \
            --no-cache -o type=local,dest=out .
      - name: Build (macOS, Windows)
        if: matrix.triple != ''
        shell: bash
        env:
          TRIPLE: ${{ matrix.triple }}
          EXE: ${{ matrix.exe }}
        run: |
          rustup toolchain install
          rustup target add "$TRIPLE"
          deploy/guard/github/build-release.sh "$TRIPLE"
          mkdir -p out && cp "target/$TRIPLE/release/zunder-guard$EXE" out/
      - name: macOS credential isolation and crash-limit native gates
        if: startsWith(matrix.target, 'darwin-')
        shell: bash
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          # Synthetic private fixture Keychain only; no venue requests or real keys.
          # Serial execution keeps process-global Keychain interaction controls deterministic.
          mkdir -p native-macos-evidence
          python3 -B deploy/guard/test/macos-bootstrap.py deploy/guard/install.sh
          sw_vers > native-macos-evidence/os.txt
          uname -m > native-macos-evidence/architecture.txt
          git rev-parse HEAD > native-macos-evidence/source-commit.txt
          set +e
          cargo test --locked -p zunder-guard --target "$TRIPLE" service::macos::tests -- --test-threads=1 > native-macos-evidence/synthetic-tests.log 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > native-macos-evidence/exit-code.txt
          cat native-macos-evidence/synthetic-tests.log
          exit "$result"
      - name: System Keychain and launchd native synthetic lifecycle
        if: startsWith(matrix.target, 'darwin-')
        shell: bash
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          cargo build --locked -p zunder-guard --example macos_service_fixture --target "$TRIPLE"
          shasum -a 256 "target/$TRIPLE/debug/examples/macos_service_fixture" > native-macos-evidence/fixture-sha256.txt
          sudo /usr/bin/env GITHUB_ACTIONS=true RUNNER_OS=macOS RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" /bin/bash deploy/guard/macos/native-ci.sh "$PWD/target/$TRIPLE/debug/examples/macos_service_fixture" "$PWD/native-macos-evidence"
      - name: Retain native macOS synthetic gate evidence
        if: always() && startsWith(matrix.target, 'darwin-')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-macos-${{ matrix.target }}
          path: native-macos-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Refuse the stub, and a binary whose version is not the tag's
        shell: bash
        env:
          BIN: out/zunder-guard${{ matrix.exe }}
          TAG: ${{ github.ref_name }}
        run: |
          if grep -aq 'STUB: a packaging test double' "$BIN"; then
            echo "::error::the binary is the packaging STUB, not Guard"; exit 1
          fi
          # Every target here runs on its native architecture.
          version=$("$BIN" --version | tr -d '\r')
          if [ "$version" != "zunder-guard ${TAG#v}" ]; then
            echo "::error::the binary says '$version', the tag is $TAG: export with --version ${TAG#v}"; exit 1
          fi
          sha256sum "$BIN" 2>/dev/null || shasum -a 256 "$BIN"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: out/zunder-guard${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 7

  # The same source on fresh runners must give the same Linux binaries, bit for bit.
  reproduce:
    needs: build
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { target: linux-amd64, os: ubuntu-24.04, platform: linux/amd64 }
          - { target: linux-arm64, os: ubuntu-24.04-arm, platform: linux/arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker buildx build -f deploy/guard/Dockerfile --target bin-build --platform "$PLATFORM" \
            --no-cache -o type=local,dest=again .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bin-${{ matrix.target }}
          path: first
      - name: Compare
        run: |
          sha256sum first/zunder-guard again/zunder-guard
          cmp first/zunder-guard again/zunder-guard \
            || { echo "::error::the rebuild differs: the build is not reproducible"; exit 1; }

  package:
    needs: [build, reproduce, image, native-services]
    permissions:
      contents: write # the draft release
      id-token: write # Sigstore keyless signing
    runs-on: ubuntu-24.04
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          path: bins
      - name: Archives, install.sh, the loaders i and i.ps1, Homebrew formula, winget manifests, pinned templates
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          for t in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            GUARD_REQUIRE_NOTICES=1 deploy/guard/packaging/package.sh "$VERSION" "$t" "bins/bin-$t/zunder-guard" dist
          done
          GUARD_REQUIRE_NOTICES=1 deploy/guard/packaging/package.sh "$VERSION" windows-amd64 bins/bin-windows-amd64/zunder-guard.exe dist
      - name: SBOM (Cargo.lock, SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/zunder-guard-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM (Cargo.lock, CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/zunder-guard-${{ github.ref_name }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        env:
          VERSION: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          printf '%s@%s\n' "$IMAGE" "$IMAGE_DIGEST" >"dist/zunder-guard-$VERSION.image.txt"
          deploy/guard/packaging/render.sh "$VERSION" dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign SHA256SUMS (keyless) and verify it the way install.sh will
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
          cosign verify-blob --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
      - id: hashes
        name: Subjects for SLSA provenance
        run: echo "hashes=$(base64 -w0 dist/SHA256SUMS)" >>"$GITHUB_OUTPUT"
      - name: Draft release (a person publishes it)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" --draft --verify-tag --title "Zunder Guard $VERSION" \
            --notes-file deploy/guard/packaging/release-readme.md dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 7

  # The installers users run, against the signed draft's own files (served from a folder with
  # ZUNDER_GUARD_BASE_URL, verified exactly as from GitHub) with the real cosign: install, set
  # up paper mode for a public account (reads, sends nothing), start, health. A failure here
  # means: do not publish the draft (RELEASE.md).
  install-smoke:
    needs: package
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      RULES: zr1_eyJ2IjoxfQ
      ACCOUNT: "0x67f7aa8fb95c47e6ea9c517b623e0701cbf9d9ba"
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: sh one-liner (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export ZUNDER_GUARD_BASE_URL="file://$PWD/dist" ZUNDER_GUARD_HOME="$RUNNER_TEMP/guard"
          sh dist/i --non-interactive --network paper --rules "$RULES" --account "$ACCOUNT" --no-service --prefix "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/zunder-guard" run --network paper &
          for _ in $(seq 1 30); do "$RUNNER_TEMP/bin/zunder-guard" health && break; sleep 1; done
          "$RUNNER_TEMP/bin/zunder-guard" health
      - name: i.ps1 (Windows PowerShell 5.1, the documented scriptblock form)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:ZUNDER_GUARD_BASE_URL = (Resolve-Path dist).Path
          $env:ZUNDER_GUARD_HOME = Join-Path $env:RUNNER_TEMP 'guard'
          & ([scriptblock]::Create((Get-Content -Raw dist/i.ps1))) -NonInteractive -Rules $env:RULES -Account $env:ACCOUNT -InstallDir (Join-Path $env:RUNNER_TEMP 'bin')
          $exe = Join-Path $env:RUNNER_TEMP 'bin\zunder-guard.exe'
          $guard = Start-Process -FilePath $exe -ArgumentList 'run', '--network', 'paper' -PassThru -NoNewWindow
          foreach ($i in 1..30) { & $exe health; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 1 }
          & $exe health
          if ($LASTEXITCODE -ne 0) { throw 'Guard did not become healthy' }
          Stop-Process -Id $guard.Id

  provenance:
    needs: package
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.package.outputs.hashes }}
      upload-assets: false
      provenance-name: zunder-guard-${{ github.ref_name }}.intoto.jsonl

  attach-provenance:
    needs: provenance
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zunder-guard-${{ github.ref_name }}.intoto.jsonl
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release upload --repo "$GITHUB_REPOSITORY" "$VERSION" "zunder-guard-$VERSION.intoto.jsonl"

  image:
    needs: [build, reproduce, native-services]
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-linux-*
          path: bins
      - name: The released, checksummed Linux binaries go into the image unchanged
        run: |
          for a in amd64 arm64; do install -D -m 0755 "bins/bin-linux-$a/zunder-guard" "dist/linux-$a/zunder-guard"; done
          sha256sum dist/linux-*/zunder-guard
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >>"$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/guard/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: GUARD_SOURCE=prebuilt
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          push: true
          provenance: false
          sbom: false
          outputs: type=image,rewrite-timestamp=true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: SBOM of the image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Sign the image and attach its SBOM (keyless)
        env:
          REF: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate image.spdx.json "$REF"

  image-provenance:
    needs: image
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ghcr.io/zunderlabs/zunder-guard
      digest: ${{ needs.image.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
