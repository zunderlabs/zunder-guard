# C5 only: no purchase credentials, venue traffic or channel mutations.
name: monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: read
concurrency:
  group: guard-production-monitor
  cancel-in-progress: false
jobs:
  production:
    if: github.repository == 'zunderlabs/zunder-guard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: monitor
    permissions:
      contents: read
      actions: read
      attestations: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '24'}
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: v3.1.3}
      - name: Install locked consumers
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/guard/harness/requirements-runtime.lock
          python -m pip install --no-deps --no-build-isolation -e ./deploy/guard/harness
          npm ci --prefix deploy/guard/journeys
      - name: Authenticate promoted complete gate and exact canonical subjects
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m guard_harness.monitor --skip-unpromoted --work "$RUNNER_TEMP/P9-canonical"
      - name: Bounded C5 page, dry-run checkout and issuer checks
        if: steps.admission.outputs.promoted == 'true'
        working-directory: deploy/guard/journeys
        run: npm test -- --config monitor.config.ts
      - name: Retain public admission receipt only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: P9-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/P9-canonical/receipt.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Notify failure through the sole C5 authenticated write
        if: failure()
        env:
          MONITOR_ALERT_TOKEN: ${{ secrets.MONITOR_ALERT_TOKEN }}
          RUN_URL: https://github.com/zunderlabs/zunder-guard/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: python -m guard_harness.monitor --alert --check P9.monitor --run-url "$RUN_URL"
