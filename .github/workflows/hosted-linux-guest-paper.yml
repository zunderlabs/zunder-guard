name: public-hosted-linux-guest-paper
on:
  workflow_dispatch:
  push:
    branches: [release/linux-guest-paper]
permissions:
  contents: read
  actions: read
concurrency:
  group: public-hosted-linux-guest-paper-v1.0.4
  cancel-in-progress: false
jobs:
  linux-amd64-guest:
    if: github.repository == 'zunderlabs/zunder-guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Admit original successful signed candidate build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/zunderlabs/zunder-guard/actions/runs/38006057745 | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["head_sha"]=="ddb3ce0b86cdfd094cfffd60dd8ea8073f20d844" and r["run_attempt"]==1 and r["status"]=="completed" and r["conclusion"]=="success" and r["path"]==".github/workflows/release.yml"'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '11651844192,11651714491'
          run-id: 38006057745
          repository: zunderlabs/zunder-guard
          github-token: ${{ github.token }}
          merge-multiple: true
          digest-mismatch: error
          path: ${{ runner.temp }}/public-linux-guest-assets
      - name: Match all 27 original signed public inputs
        shell: bash
        run: python3 -I -S -B deploy/guard/github/hosted-linux-guest-paper/acquire.py "$RUNNER_TEMP/public-linux-guest-assets"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6
      - name: Verify signed manifest and all 24 provenance subjects
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t subjects < <(python3 -I -S -B deploy/guard/github/hosted-linux-guest-paper/acquire.py --subjects)
          test "${#subjects[@]}" -eq 24
          cd "$RUNNER_TEMP/public-linux-guest-assets"
          cosign verify-blob --bundle SHA256SUMS.sigstore.json --certificate-identity https://github.com/zunderlabs/zunder-guard/.github/workflows/release.yml@refs/tags/v1.0.4 --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS >/dev/null
          slsa-verifier verify-artifact "${subjects[@]}" --provenance-path zunder-guard-v1.0.4.intoto.jsonl --source-uri github.com/zunderlabs/zunder-guard --source-tag v1.0.4 --builder-id https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v2.1.0 --print-provenance | jq -se --arg commit ddb3ce0b86cdfd094cfffd60dd8ea8073f20d844 'length > 0 and all(.predicate.invocation.configSource.digest.sha1 == $commit and .predicate.invocation.configSource.entryPoint == ".github/workflows/release.yml")' >/dev/null
      - name: Prepare fixed authenticated public Ubuntu vendor tools
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/root LANG=C.UTF-8 LC_ALL=C.UTF-8 /usr/bin/timeout --signal=TERM --kill-after=30s 10m /usr/bin/python3 -I -S -B "$GITHUB_WORKSPACE/deploy/guard/github/hosted-linux-guest-paper/prepare_tools.py" --output "$RUNNER_TEMP/public-linux-guest-tools"
      - name: Actual signed Paper systemd lifecycle and guest reboot
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/root LANG=C.UTF-8 LC_ALL=C.UTF-8 /usr/bin/timeout --signal=TERM --kill-after=30s 40m /usr/bin/python3 -I -S -B "$GITHUB_WORKSPACE/deploy/guard/github/hosted-linux-guest-paper/host.py" --assets "$RUNNER_TEMP/public-linux-guest-assets" --output "$RUNNER_TEMP/public-linux-guest-receipt" --control-source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: public-linux-guest-paper-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/public-linux-guest-tools/receipt.json
            ${{ runner.temp }}/public-linux-guest-receipt/receipt.json
          if-no-files-found: error
          retention-days: 7
