name: Public Linux acquisition runtime preparation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-linux-acquisition-runtime-preparation
  cancel-in-progress: false
jobs:
  preparation:
    if: github.repository == 'zunderlabs/zunder-guard' && github.event.repository.private == false && github.ref == 'refs/heads/main' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Fixed no-secret getter and inert complete-inventory fixtures
        env:
          CONTROL_SOURCE: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$CONTROL_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CONTROL_SOURCE"
          test -z "$(git status --porcelain)"
          /usr/bin/python3.12 -I -B deploy/guard/github/hosted-reboot/acquisition-preparation/test_runtime_preparation.py
      - name: Prepare fixed root-owned runtime and retained inert inventories
        env:
          CONTROL_SOURCE: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          umask 077
          # The getter drops inherited credentials, runner toolcache and overrides.
          # Only bounded public summary stdout is retained here.
          sudo /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 /usr/bin/python3.12 -I -B deploy/guard/github/hosted-reboot/acquisition-preparation/prepare_runtime.py --workspace "$GITHUB_WORKSPACE" --control-source "$CONTROL_SOURCE" > "$RUNNER_TEMP/acquisition-preparation-summary.json" 2>/dev/null
      - name: Export only inert bounded inventory metadata
        if: always()
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/acquisition-preparation-inventories"
          for name in summary failure runtime-closure trust-closure complete-trees bootstrap; do
            fixed="/run/zunder-public-reboot-acquisition-preparation/$name.json"
            if sudo test -f "$fixed"; then
              sudo /usr/bin/cat "$fixed" > "$RUNNER_TEMP/acquisition-preparation-inventories/$name.json"
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: linux-acquisition-runtime-inert-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acquisition-preparation-inventories/*.json
          if-no-files-found: ignore
          retention-days: 7
