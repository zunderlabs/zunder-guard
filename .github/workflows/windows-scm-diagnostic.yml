# Canonical private source; exported once to .github/workflows/windows-scm-diagnostic.yml.
# Diagnostic only, never release evidence: installs a released Guard as the protected Windows
# service on a disposable hosted runner with a synthetic account and the Hyperliquid SDK's
# public test key (no secret, no testnet lock, no real account) and prints every installer step.
name: windows-scm-diagnostic
on:
  workflow_dispatch:
    inputs:
      tag: {type: string, required: true, description: 'Released tag, such as v1.0.2-rc.1'}
      runner: {type: choice, options: [windows-2022, windows-2025], default: windows-2022}
      shell: {type: choice, options: [powershell, pwsh], default: powershell}
permissions:
  contents: read
jobs:
  scm:
    name: SCM diagnostic (${{ inputs.runner }}, ${{ inputs.shell }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Synthetic SCM install, resume and start
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
          LOADER_SHELL: ${{ inputs.shell }}
        run: ./deploy/guard/test/windows-scm-diagnostic.ps1 -Tag $env:TAG -Shell $env:LOADER_SHELL -Out scm-diagnostic
      - if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-scm-diagnostic-${{ inputs.runner }}-${{ inputs.shell }}
          path: scm-diagnostic
          if-no-files-found: warn
